<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เช็กลิสต์และเอกสารเผยแพร่ — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
/* แท็บ — หน้าตาเดียวกับแท็บในฟอร์ม จะได้ไม่ต้องเรียนรู้ใหม่ */
.ptabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.ptab{min-height:42px;padding:0 15px;border-radius:999px;cursor:pointer;border:1px solid var(--border-med);
  background:var(--surface);font-family:var(--font-sans);font-size:13.5px;color:var(--fg-2);
  display:flex;align-items:center;gap:8px}
.ptab[aria-selected="true"]{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.ptab .b{font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:var(--g-100);color:var(--g-600)}
.ptab[aria-selected="true"] .b{background:rgba(255,255,255,.18);color:#fff}
.ptab .b.warn{background:var(--red-500);color:#fff}

/* แถวเครื่องบิน: แบบเครื่อง | ปกติ | ฉุกเฉิน — เห็นครบในบรรทัดเดียว */
.acrow{display:grid;grid-template-columns:112px 1fr 1fr;gap:10px;align-items:stretch;margin-bottom:7px}
.acrow .mdl{display:flex;flex-direction:column;justify-content:center;padding:0 12px;
  background:var(--navy-900);color:#fff;border-radius:8px}
.acrow .mdl b{font-family:var(--font-display);font-size:15px}
.acrow .mdl span{font-size:10.5px;color:rgba(255,255,255,.55);font-family:var(--font-mono)}
.cell{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:9px 12px;border:1px solid var(--border-light);border-radius:8px;background:var(--surface)}
.cell .k{font-size:11.5px;color:var(--g-500);font-family:var(--font-mono)}
.cell .k b{display:block;font-size:13px;color:var(--fg-1);font-weight:600;font-family:var(--font-sans)}

/* แถวทั่วไป (ปฏิบัติการ · แผนภูมิ) */
.prow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;
  padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;
  background:var(--surface);margin-bottom:7px}
.prow .nm{font-size:13.5px;line-height:1.35}
.prow .nm b{font-weight:600}
.prow .nm span{display:block;font-size:11px;color:var(--g-500);font-family:var(--font-mono)}
.prow .ed{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2);white-space:nowrap;text-align:right}

.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--green-100);color:var(--green-600)}
.b-soon{background:var(--amber-100);color:var(--amber-600)}
.b-out{background:var(--red-100);color:var(--red-600)}
.b-next{background:var(--sky-100);color:var(--sky-600)}
.b-none{background:var(--g-100);color:var(--g-600)}
a.go,span.go{min-height:34px;padding:0 12px;border-radius:7px;display:grid;place-items:center;
  font-size:12.5px;text-decoration:none;white-space:nowrap}
a.go{background:var(--navy-900);color:#fff}
span.go{background:var(--g-100);color:var(--g-400)}
@media(max-width:820px){
  .acrow{grid-template-columns:1fr}
  .acrow .mdl{flex-direction:row;align-items:baseline;gap:8px;padding:7px 12px}
}

h2.psec{font-family:var(--font-display);font-size:15px;margin:20px 0 9px}
h2.psec .d{font-family:var(--font-sans);font-size:12.5px;color:var(--fg-2);font-weight:400;display:block;margin-top:2px}
.printhead{display:none}

/* พิมพ์ = ได้สารบัญฉบับปัจจุบันครบทุกแท็บในใบเดียว ใช้เป็นเอกสารควบคุมได้ */
@media print{
  .topbar,.rail,.botnav,footer,.noprint{display:none !important}
  .body{display:block}.main{padding:0;max-width:none}
  .acrow,.prow,.cell{break-inside:avoid}
  .acrow .mdl{background:none;color:#000;border:1px solid #999}
  .acrow .mdl span{color:#555}
  a.go,span.go{display:none}
  .printhead{display:block !important;margin-bottom:14px;border-bottom:2px solid #0D1B2A;padding-bottom:7px}
  .badge{border:1px solid #999;background:none !important;color:#000 !important}
  h2.psec{font-size:14px;margin:14px 0 7px;border-bottom:1px solid #ccc}
}
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="printhead">
      <h1 style="font-size:18px">D-0507 Flight Training Co., Ltd. — รายการเช็กลิสต์และเอกสารเผยแพร่ที่ใช้อยู่</h1>
      <p class="sub" id="phead"></p>
    </div>

    <div class="greet noprint">
      <div><p class="eyebrow"><span data-t="pubs">เช็กลิสต์และเอกสาร</span> · <span data-t2="pubs">CHECKLISTS &amp; PUBLICATIONS</span></p>
        <h1 id="hd">—</h1></div>
      <button class="fb" id="prt">🖨 <span data-t="printList">พิมพ์รายการ</span></button>
    </div>

    <div id="warn"></div>
    <div class="ptabs noprint" id="tabs" role="tablist"></div>
    <div id="out"></div>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>
"use strict";
const PUB = @@PUBS@@, AIRAC = @@AIRAC@@, A = D0507;
let PUBS = PUB.pubs.slice(), TAB = (PUB.tabs[0]||{}).k, PRINTALL = false;

A.reg = { forms: [], status: {}, lefcount: {} };

/* ทะเบียนฉบับเต็มอยู่ Firestore เหมือนทะเบียนฟอร์ม — แก้ที่เดียวเห็นทุกเครื่อง
   ไฟล์ในรีโปเป็นโครงตั้งต้น ถ้ายังไม่เคยอัปโหลดก็ใช้โครงนั้นไปก่อน */
async function hydrate(){
  try{
    const d = await A.db.collection('publications').doc('current').get();
    if (d.exists && (d.data().pubs||[]).length) PUBS = d.data().pubs;
  }catch(e){ /* rule ไม่อนุญาต หรือยังไม่ได้อัปโหลด — ใช้ของในไฟล์ */ }
  paint();
}

// ทะเบียนเอกสารใช้คีย์ th/en ส่วนหมวดกับแท็บใช้ n/en — รับทั้งสองแบบ
const LL = o => !o ? '' : (A.lang==='en' ? (o.en || o.th || o.n) : (o.th || o.n || o.en));
const dmy = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m? m[3]+'/'+m[2]+'/'+m[1] : ''; };
const today = () => { const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* ช่วงวันของรอบ AIRAC ใด ๆ จากหมุดเดียวกับ tools/airac.py
   ต้องคำนวณเอง ไม่ใช่เปิดตารางที่ฝังมา เพราะตารางมีแต่รอบปัจจุบันกับอนาคต
   ถ้าใช้ตารางอย่างเดียว chart รอบเก่าจะกลายเป็น "ไม่รู้จักรอบ" แทนที่จะเป็น
   "หมดรอบแล้ว" ซึ่งกลบความเสี่ยงที่ระบบนี้ตั้งใจจะจับพอดี */
const ANCHOR = Date.UTC(2020, 0, 2), DAY = 86400000, CYCLE = 28 * DAY;
function airacRange(id){
  const m = /^(\d{2})(\d{2})$/.exec(String(id||''));
  if (!m) return null;
  const year = 2000 + +m[1], n = +m[2];
  let t = ANCHOR;
  while (new Date(t).getUTCFullYear() < year) t += CYCLE;
  if (new Date(t).getUTCFullYear() !== year) return null;
  t += (n - 1) * CYCLE;
  const from = new Date(t), to = new Date(t + CYCLE - DAY);
  if (from.getUTCFullYear() !== year) return null;      // เลขรอบเกินที่ปีนั้นมี
  return { from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10) };
}

function state(p){
  if (!p) return { k:'none', t:{th:'ยังไม่มี',en:'Missing'} };
  if (p.cat === 'chart'){
    const c = airacRange(p.airac);
    if (!c) return { k:'none', t:{th:'ยังไม่ระบุรอบ',en:'No cycle'} };
    const t = today();
    if (t > c.to)   return { k:'out',  t:{th:'หมดรอบแล้ว',en:'Expired'}, sub:c.to };
    if (t < c.from) return { k:'next', t:{th:'ยังไม่ถึงกำหนด',en:'Not yet effective'}, sub:c.from };
    const days = Math.round((new Date(c.to) - new Date(t)) / DAY);
    if (days <= 7) return { k:'soon', t:{th:'เหลือ '+days+' วัน',en:days+' days left'}, sub:c.to };
    return { k:'ok', t:{th:'ใช้อยู่',en:'Current'}, sub:c.to };
  }
  if (!p.file) return { k:'none', t:{th:'ยังไม่มีไฟล์',en:'No file'} };
  if (!p.ed)   return { k:'none', t:{th:'ยังไม่ออกฉบับ',en:'Not issued'} };
  return { k:'ok', t:{th:'ใช้อยู่',en:'Current'} };
}

const fileUrl = f => !f ? '' :
  (/^https?:/.test(f) ? f : 'https://drive.google.com/file/d/'+f+'/view');
const catsOf = tab => Object.entries(PUB.cats).filter(([,c]) => c.tab === tab).map(([k]) => k);
const inTab  = (p, tab) => catsOf(tab).includes(p.cat);
const T = k => A.L({
  pubs:{th:'เช็กลิสต์และเอกสารเผยแพร่',en:'Checklists & publications'},
  open:{th:'เปิด',en:'Open'},
  nofile:{th:'ยังไม่มีไฟล์',en:'No file'},
  eff:{th:'มีผล',en:'Eff'},
  until:{th:'ถึง',en:'until'},
  none:{th:'ยังไม่มีรายการในหมวดนี้ — เพิ่มได้ที่ publications.json',
        en:'Nothing here yet — add entries in publications.json'},
}[k]);

/* หนึ่งช่อง = หนึ่งฉบับ ใช้ในแถวเครื่องบิน */
function cell(p, label){
  const s = state(p), u = p ? fileUrl(p.file) : '';
  const ed = !p ? '—' : p.cat==='chart'
    ? 'AIRAC ' + A.esc(p.airac||'—')
    : (p.ed ? A.esc(p.ed+'/'+(p.rev||'00')) : '—');
  return `<div class="cell">
    <span class="k"><b>${A.esc(label)}</b>${ed}</span>
    <span class="badge b-${s.k}">${A.esc(A.L(s.t))}</span>
    ${u ? `<a class="go" href="${A.esc(u)}" target="_blank" rel="noopener">${A.esc(T('open'))} ↗</a>`
        : `<span class="go">${A.esc(T('nofile'))}</span>`}</div>`;
}

/* แท็บเครื่องบิน — หนึ่งแถวต่อหนึ่งแบบ ปกติกับฉุกเฉินอยู่ข้างกัน
   คนใช้จริงคิดว่า "วันนี้บินแบบไหน" ไม่ได้คิดว่า "เช็กลิสต์ประเภทไหน" */
function acHtml(){
  const find = (cat, m) => PUBS.find(p => p.cat===cat && p.model===m);
  return PUB.fleet.map(f => `<div class="acrow">
      <div class="mdl"><b>${A.esc(f.model)}</b><span>${A.esc((f.regs||[]).join(' · ') || '—')}</span></div>
      ${cell(find('normal', f.model), LL(PUB.cats.normal))}
      ${cell(find('emerg',  f.model), LL(PUB.cats.emerg))}</div>`).join('');
}

function listHtml(tab){
  const out = [];
  for (const ck of catsOf(tab)){
    const c = PUB.cats[ck], list = PUBS.filter(p => p.cat === ck);
    out.push(`<h2 class="psec">${A.esc(LL(c))}<span class="d">${A.esc(c.d||'')}</span></h2>`);
    out.push(list.length ? list.map(p => {
      const s = state(p), u = fileUrl(p.file);
      const ed = p.cat==='chart'
        ? `<b>AIRAC ${A.esc(p.airac||'—')}</b>${s.sub?' '+A.esc(T('until')+' '+dmy(s.sub)):''}`
        : `<b>${A.esc(p.ed?p.ed+'/'+(p.rev||'00'):'—')}</b>${p.eff?' '+A.esc(T('eff')+' '+dmy(p.eff)):''}`;
      return `<div class="prow">
        <div class="nm"><b>${A.esc(LL(p))}</b><span>${A.esc(p.id)}</span></div>
        <div class="ed">${ed}</div>
        <span class="badge b-${s.k}">${A.esc(A.L(s.t))}</span>
        ${u ? `<a class="go" href="${A.esc(u)}" target="_blank" rel="noopener">${A.esc(T('open'))} ↗</a>`
            : `<span class="go">${A.esc(T('nofile'))}</span>`}</div>`;
    }).join('') : `<p class="sub" style="padding:9px 14px;border:1px dashed var(--border-med);border-radius:8px">${A.esc(T('none'))}</p>`);
  }
  return out.join('');
}

function paint(){
  document.getElementById('hd').textContent = T('pubs');
  document.getElementById('phead').textContent =
    A.L({th:'พิมพ์เมื่อ ',en:'Printed '}) + dmy(today()) +
    ' · AIRAC ' + (AIRAC[0]||{}).c + ' ' + T('until') + ' ' + dmy((AIRAC[0]||{}).to);

  // ป้ายแท็บบอกจำนวน และขึ้นแดงถ้ามีของหมดรอบ/ใกล้หมดอยู่ในแท็บนั้น
  document.getElementById('tabs').innerHTML = PUB.tabs.map(tb => {
    const list = PUBS.filter(p => inTab(p, tb.k));
    const bad = list.filter(p => ['out','soon'].includes(state(p).k)).length;
    return `<button class="ptab" role="tab" data-k="${A.esc(tb.k)}"
      aria-selected="${TAB===tb.k}">${A.esc(LL(tb))}
      <span class="b${bad?' warn':''}">${bad? '!'+bad : list.length}</span></button>`;
  }).join('');
  document.getElementById('tabs').querySelectorAll('[data-k]').forEach(b =>
    b.onclick = () => { TAB = b.dataset.k; paint(); });

  // เตือนของที่หมดรอบหรือใกล้หมด — รวมทุกแท็บ ขึ้นบนสุด ไม่ต้องไล่หา
  const bad = PUBS.map(p=>({p,s:state(p)})).filter(x=>x.s.k==='out'||x.s.k==='soon');
  document.getElementById('warn').innerHTML = !bad.length ? '' :
    `<div class="fk-gate ${bad.some(x=>x.s.k==='out')?'stop':'warn'}" style="margin:14px 0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
        stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 9.5v4.5"/>
        <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>${A.esc(A.L({th:'ต้องปรับปรุง ',en:'Needs attention: '}))}${
        bad.map(x=>A.esc(LL(x.p)+' ('+A.L(x.s.t)+')')).join(' · ')}</span></div>`;

  // พิมพ์ = ออกทุกแท็บ ไม่ใช่เฉพาะที่เปิดอยู่ จะได้เป็นสารบัญครบในใบเดียว
  document.getElementById('out').innerHTML = PUB.tabs.map(tb => `
    <section style="${(PRINTALL || TAB === tb.k) ? '' : 'display:none'}">
      ${PRINTALL ? `<h2 class="psec">${A.esc(LL(tb))}</h2>` : ''}
      ${tb.k === 'ac' ? acHtml() : listHtml(tb.k)}</section>`).join('');
}

document.getElementById('prt').addEventListener('click', () => {
  PRINTALL = true; paint();
  window.print();
  PRINTALL = false; paint();
});
A.onLang.push(paint);

// เรียกท้ายสุด — paint ใช้ตัวช่วยที่ประกาศด้วย const ข้างบน
A.initAuth(@@FBCFG@@, hydrate);
paint();
</script>
</body></html>
