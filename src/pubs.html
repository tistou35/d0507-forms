<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เช็กลิสต์และเอกสารเผยแพร่ — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
/* แท็บ — หน้าตาเดียวกับแท็บในฟอร์ม จะได้ไม่ต้องเรียนรู้ใหม่ */
.ptabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.ptab{min-height:42px;padding:0 15px;border-radius:999px;cursor:pointer;border:1px solid var(--border-med);
  background:var(--surface);font-family:var(--font-sans);font-size:13.5px;color:var(--fg-2);
  display:flex;align-items:center;gap:8px}
.ptab[aria-selected="true"]{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
.ptab .b{font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:var(--g-100);color:var(--g-600)}
.ptab[aria-selected="true"] .b{background:rgba(255,255,255,.18);color:#fff}
.ptab .b.warn{background:var(--red-500);color:#fff}

/* แถวเครื่องบิน: แบบเครื่อง | ปกติ | ฉุกเฉิน — เห็นครบในบรรทัดเดียว */
.acrow{display:grid;grid-template-columns:112px 1fr 1fr;gap:10px;align-items:stretch;margin-bottom:7px}
.acrow .mdl{display:flex;flex-direction:column;justify-content:center;padding:0 12px;
  background:var(--navy-900);color:#fff;border-radius:8px}
.acrow .mdl b{font-family:var(--font-display);font-size:15px}
.acrow .mdl span{font-size:10.5px;color:rgba(255,255,255,.55);font-family:var(--font-mono)}
.cell{display:grid;grid-template-columns:1fr auto auto auto;gap:9px;align-items:center;
  padding:9px 12px;border:1px solid var(--border-light);border-radius:8px;background:var(--surface)}
.cell .k{font-size:11.5px;color:var(--g-500);font-family:var(--font-mono)}
.cell .k b{display:block;font-size:13px;color:var(--fg-1);font-weight:600;font-family:var(--font-sans)}

/* แถวสนามบิน: ICAO | วันมีผล | ผังสนามบิน | แผนภูมิปฏิบัติการ
   หนึ่งแถวต่อหนึ่งสนามบิน ไม่ใช่ต่อหนึ่งแผนภูมิ — 12 สนามบินมี 185 ชุด
   สิ่งที่คนเปิดหน้านี้อยากรู้คือ "ของสนามบินนี้เป็นรอบปัจจุบันไหม" ไม่ใช่รายชื่อทุกใบ */
/* คอลัมน์ป้ายตรึงความกว้างไว้ ไม่ใช้ auto — ป้าย "หมดรอบแล้ว" ยาวกว่า "ใช้อยู่"
   ถ้าปล่อยให้ยืดตามข้อความ ปุ่มของแถวที่หมดรอบจะเยื้องไปแถวเดียว อ่านแล้วสะดุด */
/* คอลัมน์แรกกว้างพอให้ ICAO กับป้าย "อัปเดตแล้ว" อยู่บรรทัดเดียวกัน
   แคบกว่านี้ป้ายจะตกบรรทัด แล้วแถวสูงขึ้นทั้งตาราง */
.adrow{display:grid;grid-template-columns:172px 122px 96px 1fr 1fr;gap:9px;align-items:center;
  padding:8px 12px;border:1px solid var(--border-light);border-radius:8px;
  background:var(--surface);margin-bottom:6px}
.adrow .badge{text-align:center}
.adrow .ad b{font-family:var(--font-mono);font-size:15px;font-weight:700;letter-spacing:.4px}
.adrow .ad span{display:block;font-size:11.5px;color:var(--g-500);line-height:1.3}
.adrow .eff{font-family:var(--font-mono);font-size:12px;color:var(--fg-1);white-space:nowrap}
.adrow .eff span{display:block;font-size:10.5px;color:var(--g-500)}
.adrow .eff.no{color:var(--g-400)}
a.gof,span.gof{justify-items:center;gap:7px;grid-auto-flow:column;font-size:12px}
a.gof i,span.gof i{font-style:normal;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.2)}
span.gof i{background:var(--g-200);color:var(--g-500)}
/* จอแคบ: ชื่อกับวันที่อยู่บรรทัดเดียว ป้ายไปมุมขวา ปุ่มสองอันเรียงล่าง
   ไม่ปล่อยให้ป้ายกินทั้งบรรทัด เพราะสิบสองสนามบินจะยาวเกินหน้าจอไปมาก */
@media(max-width:820px){
  .adrow{grid-template-columns:1fr auto;gap:6px 9px;padding:9px 11px}
  .adrow .ad {grid-area:1/1}
  .adrow .eff{grid-area:1/2;text-align:right}
  .adrow .badge{grid-area:2/2;justify-self:end}
  .adrow .go:nth-of-type(1){grid-area:2/1}
  .adrow .go:nth-of-type(2){grid-area:3/1/auto/-1}
}

/* แถบควบคุมเหนือรายการสนามบิน */
.cbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px 14px;margin-bottom:9px;border:1px solid var(--border-light);border-radius:8px;
  background:var(--g-50)}
.cbar .nx b{display:block;font-size:13px}
.cbar .nx span{font-size:11.5px;color:var(--g-500)}
.cbar .prog{min-width:230px}
.cbar .prog span{display:block;margin-top:4px;font-size:11.5px;color:var(--g-500);
  font-family:var(--font-mono)}
.cbar .bar{height:7px;border-radius:99px;background:var(--g-200);overflow:hidden}
.cbar .bar i{display:block;height:100%;background:var(--navy-900);border-radius:99px;
  transition:width .4s ease}
.adrow .ad{white-space:nowrap}
/* ต้องประกาศ display เอง — กฎชื่อสนามบิน (.ad span) ทำให้ span ทุกตัวเป็น block */
.adrow .ad .fresh{display:inline-block;margin-left:7px;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:99px;
  background:var(--green-100);color:var(--green-600);vertical-align:2px}

/* แถวทั่วไป (ปฏิบัติการ · แผนภูมิ) */
.prow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;align-items:center;
  padding:10px 14px;border:1px solid var(--border-light);border-radius:8px;
  background:var(--surface);margin-bottom:7px}
.prow .nm{font-size:13.5px;line-height:1.35}
.prow .nm b{font-weight:600}
.prow .nm span{display:block;font-size:11px;color:var(--g-500);font-family:var(--font-mono)}
.prow .ed{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2);white-space:nowrap;text-align:right}
/* เช็กลิสต์ที่สร้างในระบบ — บอกโครงของใบ (กี่หัวข้อ กี่รายการ กี่คอลัมน์)
   ให้เห็นจากรายการเลย ไม่ต้องเปิดเข้าไปดูทีละใบ */
.prow > div > b{font-weight:600;font-size:13.5px}
.prow .cd{display:block;font-size:11px;color:var(--g-500);font-family:var(--font-mono);
  line-height:1.5;margin-top:2px}
.prow .ops{display:flex;gap:7px;white-space:nowrap}
.prow .op{font-size:12.5px;text-decoration:none;color:var(--sky-600);
  border:1px solid var(--border-light);border-radius:7px;padding:4px 10px}
.prow .op:hover{border-color:var(--navy-900);color:var(--navy-900)}
.prow .op.ed2{color:var(--fg-2)}
/* ลิงก์ต้นฉบับที่แก้ไขได้ — เห็นเฉพาะเจ้าหน้าที่ ต่างจากปุ่มเปิดที่ทุกคนเห็น
   ไฟล์นี้คือตัวที่เอกสารควบคุมงอกมาจาก แก้แล้วต้องเลื่อนเลขกำกับและทำ PDF ใหม่ */
.prow a.go.ed3{background:var(--surface);color:var(--fg-2);
  border:1px dashed var(--border-med);white-space:nowrap}
.prow a.go.ed3:hover{color:var(--navy-900);border-color:var(--navy-900)}

.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--green-100);color:var(--green-600)}
.b-soon{background:var(--amber-100);color:var(--amber-600)}
.b-out{background:var(--red-100);color:var(--red-600)}
.b-next{background:var(--sky-100);color:var(--sky-600)}
.b-none{background:var(--g-100);color:var(--g-600)}
a.go,span.go{min-height:34px;padding:0 12px;border-radius:7px;display:grid;place-items:center;
  font-size:12.5px;text-decoration:none;white-space:nowrap}
a.go{background:var(--navy-900);color:#fff}
span.go{background:var(--g-100);color:var(--g-400)}
@media(max-width:820px){
  .acrow{grid-template-columns:1fr}
  .acrow .mdl{flex-direction:row;align-items:baseline;gap:8px;padding:7px 12px}
}

h2.psec{font-family:var(--font-display);font-size:15px;margin:20px 0 9px}
h2.psec .d{font-family:var(--font-sans);font-size:12.5px;color:var(--fg-2);font-weight:400;display:block;margin-top:2px}
.printhead{display:none}

/* พิมพ์ = ได้สารบัญฉบับปัจจุบันครบทุกแท็บในใบเดียว ใช้เป็นเอกสารควบคุมได้ */
@media print{
  .topbar,.rail,.botnav,footer,.noprint{display:none !important}
  .body{display:block}.main{padding:0;max-width:none}
  .acrow,.prow,.cell{break-inside:avoid}
  .acrow .mdl{background:none;color:#000;border:1px solid #999}
  .acrow .mdl span{color:#555}
  a.go,span.go{display:none}
  .printhead{display:block !important;margin-bottom:14px;border-bottom:2px solid #0D1B2A;padding-bottom:7px}
  .badge{border:1px solid #999;background:none !important;color:#000 !important}
  h2.psec{font-size:14px;margin:14px 0 7px;border-bottom:1px solid #ccc}
}
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="printhead">
      <h1 style="font-size:18px">D-0507 Flight Training Co., Ltd. — รายการเช็กลิสต์และเอกสารเผยแพร่ที่ใช้อยู่</h1>
      <p class="sub" id="phead"></p>
    </div>

    <div class="greet noprint">
      <div><p class="eyebrow"><span data-t="pubs">เช็กลิสต์และเอกสาร</span> · <span data-t2="pubs">CHECKLISTS &amp; PUBLICATIONS</span></p>
        <h1 id="hd">—</h1></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="fb hide" id="build" href="@@BASE@@admin/checklists/">✎ สร้างเช็กลิสต์</a>
        <button class="fb" id="prt">🖨 <span data-t="printList">พิมพ์รายการ</span></button>
      </div>
    </div>

    <div id="warn"></div>
    <div class="ptabs noprint" id="tabs" role="tablist"></div>
    <div id="out"></div>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>
"use strict";
const PUB = @@PUBS@@, AIRAC = @@AIRAC@@, A = D0507;
let PUBS = PUB.pubs.slice(), TAB = (PUB.tabs[0]||{}).k, PRINTALL = false;

/* สถานะการดึงแผนภูมิมาจาก Apps Script โดยตรง ไม่ได้เก็บซ้ำใน Firestore
   ฝั่งนั้นเป็นเจ้าของงานอยู่แล้ว เก็บสองที่เมื่อไรก็ไม่ตรงกันเมื่อนั้น
   ค่าที่ฝังมากับไฟล์ (publications.json) เป็นตัวสำรองให้คนที่ยังไม่ล็อกอิน */
let SYNC = null, BUSY = null, POLL = 0;
const FRESH_DAYS = 3;                    // ติดป้าย "อัปเดตแล้ว" กี่วันหลังดึงเสร็จ

const daysSince = iso => {
  const t = Date.parse(iso||''); if (!t) return null;
  return Math.floor((Date.now() - t) / 86400000);
};

A.reg = { forms: [], status: {}, lefcount: {} };

/* ทะเบียนฉบับเต็มอยู่ Firestore เหมือนทะเบียนฟอร์ม — แก้ที่เดียวเห็นทุกเครื่อง
   ไฟล์ในรีโปเป็นโครงตั้งต้น ถ้ายังไม่เคยอัปโหลดก็ใช้โครงนั้นไปก่อน */
async function hydrate(){
  try{
    const d = await A.db.collection('publications').doc('current').get();
    if (d.exists && (d.data().pubs||[]).length) PUBS = d.data().pubs;
  }catch(e){ /* rule ไม่อนุญาต หรือยังไม่ได้อัปโหลด — ใช้ของในไฟล์ */ }
  paint();
  loadSync();          // สถานะการดึงแผนภูมิ — เฉพาะเจ้าหน้าที่ที่ล็อกอินแล้ว
}

// ทะเบียนเอกสารใช้คีย์ th/en ส่วนหมวดกับแท็บใช้ n/en — รับทั้งสองแบบ
const LL = o => !o ? '' : (A.lang==='en' ? (o.en || o.th || o.n) : (o.th || o.n || o.en));
const dmy = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m? m[3]+'/'+m[2]+'/'+m[1] : ''; };
/* วันที่แบบคู่มือ: DD MMM YYYY — แผนภูมิใช้แบบนี้เพราะตรงกับที่ AIP พิมพ์บนใบ
   เทียบกันได้ทันทีโดยไม่ต้องแปลงในหัว */
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const dmmm = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  return m ? m[3]+' '+MON[+m[2]-1]+' '+m[1] : ''; };
const today = () => { const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* ช่วงวันของรอบ AIRAC ใด ๆ จากหมุดเดียวกับ tools/airac.py
   ต้องคำนวณเอง ไม่ใช่เปิดตารางที่ฝังมา เพราะตารางมีแต่รอบปัจจุบันกับอนาคต
   ถ้าใช้ตารางอย่างเดียว chart รอบเก่าจะกลายเป็น "ไม่รู้จักรอบ" แทนที่จะเป็น
   "หมดรอบแล้ว" ซึ่งกลบความเสี่ยงที่ระบบนี้ตั้งใจจะจับพอดี */
const ANCHOR = Date.UTC(2020, 0, 2), DAY = 86400000, CYCLE = 28 * DAY;
function airacRange(id){
  const m = /^(\d{2})(\d{2})$/.exec(String(id||''));
  if (!m) return null;
  const year = 2000 + +m[1], n = +m[2];
  let t = ANCHOR;
  while (new Date(t).getUTCFullYear() < year) t += CYCLE;
  if (new Date(t).getUTCFullYear() !== year) return null;
  t += (n - 1) * CYCLE;
  const from = new Date(t), to = new Date(t + CYCLE - DAY);
  if (from.getUTCFullYear() !== year) return null;      // เลขรอบเกินที่ปีนั้นมี
  return { from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10) };
}

function state(p){
  if (!p) return { k:'none', t:{th:'ยังไม่มี',en:'Missing'} };
  if (p.cat === 'chart'){
    const c = airacRange(p.airac);
    // ยังไม่เคยดึง — ต่างจาก "ดึงแล้วแต่หมดรอบ" ต้องแยกให้ออก ไม่งั้นอ่านผิดว่าปลอดภัย
    if (!c) return { k:'none', t:{th:'ยังไม่ดึง',en:'Not synced'} };
    const t = today();
    if (t > c.to)   return { k:'out',  t:{th:'หมดรอบแล้ว',en:'Expired'}, sub:c.to };
    if (t < c.from) return { k:'next', t:{th:'ยังไม่ถึงกำหนด',en:'Not yet effective'}, sub:c.from };
    const days = Math.round((new Date(c.to) - new Date(t)) / DAY);
    if (days <= 7) return { k:'soon', t:{th:'เหลือ '+days+' วัน',en:days+' days left'}, sub:c.to };
    return { k:'ok', t:{th:'ใช้อยู่',en:'Current'}, sub:c.to };
  }
  if (!p.file) return { k:'none', t:{th:'ยังไม่มีไฟล์',en:'No file'} };
  if (!p.ed)   return { k:'none', t:{th:'ยังไม่ออกฉบับ',en:'Not issued'} };
  return { k:'ok', t:{th:'ใช้อยู่',en:'Current'} };
}

/* file รับได้สามแบบ — URL เต็ม · ไฟล์ในรีโปนี้ · id ของไฟล์ใน Drive
   เอกสารที่ทำเองแล้วเก็บในรีโปดีกว่าฝาก Drive เพราะเวอร์ชันเดินคู่กับทะเบียน
   และไม่ต้องพึ่งสิทธิ์การแชร์ของ Drive ซึ่งบัญชีนี้ถูกนโยบายปิดไว้บางส่วน
   id ของ Drive ไม่มีทั้ง / และ . จึงแยกจากพาธในรีโปได้ด้วยตัวอักษรสองตัวนี้ */
/* เช็กลิสต์ที่สร้างในระบบนี้อยู่ใน Firestore ไม่ใช่ publications.json
   ผู้ดูแลสร้างเองได้ตลอด ไฟล์ทะเบียนแบบ static จึงตามไม่ทัน */
let MADE = [];
async function loadMade(){
  try {
    const s = await A.db.collection('checklists').orderBy('doc').get();
    MADE = s.docs.map(d => Object.assign({ id:d.id }, d.data()));
  } catch(e){ MADE = []; }
  if (MADE.length) paintMade();
  if (A.isStaff()) document.getElementById('build').classList.remove('hide');
}
function paintMade(){
  const host = document.getElementById('out');
  if (!host || document.getElementById('madewrap')) return;
  const box = document.createElement('section');
  box.id = 'madewrap';
  box.innerHTML = '<h3 class="ph">เช็กลิสต์ที่สร้างในระบบ</h3>'
    + '<p class="pd">เปิดอ่านบนเครื่อง แตะช่องขวาเพื่อทำเครื่องหมาย หรือพิมพ์ไปใช้</p>'
    + MADE.map(c => {
        const secs = (c.items||[]).filter(i => i.sec).length;
        const items = (c.items||[]).filter(i => !i.sec).length;
        return `<div class="prow">
        <div><b>${A.esc((c.title&&c.title.th)||c.doc)}</b>
          <span class="cd">${A.esc(c.doc||'')} · ${A.esc(c.code||'')}
            · ${secs ? secs + ' หัวข้อ · ' : ''}${items} รายการ
            · ${c.layout==='three'?'สามคอลัมน์':c.layout==='two'?'สองคอลัมน์':'แถวเดียว'}</span></div>
        <span class="ed">${A.esc(c.issue||'01')}/${A.esc(c.rev||'00')}</span>
        <span class="ops">
          <a class="op" href="@@BASE@@cl/?id=${encodeURIComponent(c.id)}">เปิด ↗</a>
          ${A.isStaff() ? `<a class="op ed2"
             href="@@BASE@@admin/checklists/?id=${encodeURIComponent(c.id)}">แก้ไข ✎</a>` : ''}
        </span>
      </div>`; }).join('');
  host.appendChild(box);
}

const fileUrl = f => !f ? '' :
  /^https?:/.test(f) ? f :
  /[\/.]/.test(f)    ? '@@BASE@@' + f :
                       'https://drive.google.com/file/d/' + f + '/view';
const catsOf = tab => Object.entries(PUB.cats).filter(([,c]) => c.tab === tab).map(([k]) => k);
const inTab  = (p, tab) => catsOf(tab).includes(p.cat);
const T = k => A.L({
  pubs:{th:'เช็กลิสต์และเอกสารเผยแพร่',en:'Checklists & publications'},
  open:{th:'เปิด',en:'Open'},
  nofile:{th:'ยังไม่มีไฟล์',en:'No file'},
  editSrc:{th:'แก้ต้นฉบับ',en:'Edit source'},
  eff:{th:'มีผล',en:'Eff'},
  until:{th:'ถึง',en:'until'},
  none:{th:'ยังไม่มีรายการในหมวดนี้ — เพิ่มได้ที่ publications.json',
        en:'Nothing here yet — add entries in publications.json'},
}[k]);

/* หนึ่งช่อง = หนึ่งฉบับ ใช้ในแถวเครื่องบิน */
function cell(p, label){
  const s = state(p), u = p ? fileUrl(p.file) : '';
  const ed = !p ? '—' : p.cat==='chart'
    ? 'AIRAC ' + A.esc(p.airac||'—')
    : (p.ed ? A.esc(p.ed+'/'+(p.rev||'00')) : '—');
  return `<div class="cell">
    <span class="k"><b>${A.esc(label)}</b>${ed}</span>
    <span class="badge b-${s.k}">${A.esc(A.L(s.t))}</span>
    ${u ? `<a class="go" href="${A.esc(u)}" target="_blank" rel="noopener">${A.esc(T('open'))} ↗</a>`
        : `<span class="go">${A.esc(T('nofile'))}</span>`}
    ${p && p.edit && A.isStaff()
        ? `<a class="go ed3" href="https://docs.google.com/document/d/${A.esc(p.edit)}/edit"
             target="_blank" rel="noopener"
             title="ต้นฉบับที่แก้ไขได้ — แก้แล้วต้องเลื่อนเลขกำกับและทำ PDF ใหม่"
             >${A.esc(T('editSrc'))} ✎</a>` : ''}</div>`;
}

/* แท็บเครื่องบิน — หนึ่งแถวต่อหนึ่งแบบ ปกติกับฉุกเฉินอยู่ข้างกัน
   คนใช้จริงคิดว่า "วันนี้บินแบบไหน" ไม่ได้คิดว่า "เช็กลิสต์ประเภทไหน" */
function acHtml(){
  const find = (cat, m) => PUBS.find(p => p.cat===cat && p.model===m);
  return PUB.fleet.map(f => `<div class="acrow">
      <div class="mdl"><b>${A.esc(f.model)}</b><span>${A.esc((f.regs||[]).join(' · ') || '—')}</span></div>
      ${cell(find('normal', f.model), LL(PUB.cats.normal))}
      ${cell(find('emerg',  f.model), LL(PUB.cats.emerg))}</div>`).join('');
}

/* แท็บสนามบิน — หนึ่งแถวต่อหนึ่งสนามบิน
   ลิงก์ชี้ไปที่ "โฟลเดอร์" ไม่ใช่ไฟล์ เพราะแผนภูมิของสนามบินหนึ่งแห่งมีเป็นสิบใบ
   และ AipSync เปลี่ยนแค่ชื่อโฟลเดอร์ทุกรอบ ลิงก์จึงไม่ตายเมื่อเปลี่ยนรอบ */
/* แถบควบคุมเหนือรายการสนามบิน — รอบถัดไป + ปุ่มอัปเดต + ความคืบหน้า
   ปุ่มมีไว้เผื่อกรณีเร่งด่วน ระบบดึงเองอยู่แล้วเมื่อถึงวันมีผล
   จึงต้องเขียนให้ชัดว่าไม่ต้องกด ไม่งั้นคนจะกดทุกวันเพราะไม่แน่ใจ */
function chartBar(){
  const s = SYNC;
  const nextEff = (s && s.next && s.next.date) || (AIRAC[1]||{}).from || '';
  const auto = A.L({th:'ระบบดึงเองเมื่อถึงวันมีผล — ปกติไม่ต้องกด',
                    en:'Syncs itself on the effective date — you normally need not press this'});
  const nx = nextEff
    ? `<b>${A.esc(A.L({th:'รอบถัดไปมีผล',en:'Next effective'}))} ${A.esc(dmmm(nextEff))}</b>
       <span>${A.esc(auto)}</span>`
    : `<b>${A.esc(A.L({th:'ยังไม่ทราบรอบถัดไป',en:'Next issue unknown'}))}</b><span>${A.esc(auto)}</span>`;

  let right = '';
  if (BUSY){
    const pct = BUSY.total ? Math.round(BUSY.i / BUSY.total * 100) : 0;
    right = `<div class="prog"><div class="bar"><i style="width:${pct}%"></i></div>
      <span>${A.esc(A.L({th:'กำลังดึง',en:'Syncing'}))} ${BUSY.i}/${BUSY.total} · ${pct}%${
        BUSY.fail ? ' · ' + A.esc(A.L({th:'ผิดพลาด',en:'failed'})) + ' ' + BUSY.fail : ''}</span></div>`;
  } else if (A.isStaff()){
    right = `<button class="fb" id="sync">⟳ <span>${A.esc(A.L({th:'อัปเดตเดี๋ยวนี้',en:'Update now'}))}</span></button>`;
  }
  return `<div class="cbar noprint"><div class="nx">${nx}</div>${right}</div>`;
}

function chartHtml(){
  const list = PUBS.filter(p => p.cat === 'chart')
                   .sort((a,b) => (a.icao||'').localeCompare(b.icao||''));
  if (!list.length) return `<p class="sub" style="padding:9px 14px;border:1px dashed var(--border-med);border-radius:8px">${A.esc(T('none'))}</p>`;
  const c = PUB.cats.chart;
  /* ต้องเป็น URL ของ "โฟลเดอร์" ไม่ใช่ fileUrl() ที่สร้าง /file/d/<id>/view
     รูปแบบไฟล์ใช้กับโฟลเดอร์ไม่ได้ กดแล้วขึ้นหน้าไม่พบ */
  const folderUrl = f => !f ? '' :
    (/^https?:/.test(f) ? f : 'https://drive.google.com/drive/folders/' + f);
  const fold = (url, label, n) => url
    ? `<a class="go gof" href="${A.esc(folderUrl(url))}" target="_blank" rel="noopener">${A.esc(label)}<i>${n||0}</i></a>`
    : `<span class="go gof">${A.esc(label)}<i>—</i></span>`;
  return `<h2 class="psec">${A.esc(LL(c))}<span class="d">${A.esc(c.d||'')}</span></h2>` +
    chartBar() +
    list.map(p => {
      const s = state(p);
      // ยังไม่เคยดึงก็เว้นไว้ — ป้ายสถานะข้าง ๆ บอกอยู่แล้ว เขียนซ้ำสองที่รกเปล่า ๆ
      const eff = p.eff
        ? `<b>${A.esc(dmmm(p.eff))}</b><span>AIRAC ${A.esc(p.airac||'—')}</span>`
        : `<b>—</b>`;
      /* ป้าย "อัปเดตแล้ว" อยู่ 3 วันหลังดึงเสร็จ แล้วหายไปเอง
         เป็นการบอกว่า "เพิ่งแตะของนี้" ไม่ใช่บอกว่า "ของนี้ยังใช้ได้"
         สองอย่างนี้ต่างกัน ป้ายสถานะข้าง ๆ เป็นตัวบอกว่ายังใช้ได้หรือไม่ */
      const d = daysSince(p.syncedAt);
      const fresh = (d !== null && d <= FRESH_DAYS)
        ? `<span class="fresh">${A.esc(A.L({th:'อัปเดตแล้ว',en:'Updated'}))}</span>` : '';
      return `<div class="adrow">
        <div class="ad"><b>${A.esc(p.icao||'')}</b>${fresh}<span>${A.esc(LL(p))}</span></div>
        <div class="eff${p.eff?'':' no'}">${eff}</div>
        <span class="badge b-${s.k}">${A.esc(A.L(s.t))}</span>
        ${fold(p.ap, A.L({th:'ผังสนามบิน',en:'Aerodrome'}), p.nap)}
        ${fold(p.op, A.L({th:'แผนภูมิปฏิบัติการ',en:'Operation'}), p.nop)}</div>`;
    }).join('');
}

function listHtml(tab){
  const out = [];
  for (const ck of catsOf(tab)){
    const c = PUB.cats[ck], list = PUBS.filter(p => p.cat === ck);
    out.push(`<h2 class="psec">${A.esc(LL(c))}<span class="d">${A.esc(c.d||'')}</span></h2>`);
    out.push(list.length ? list.map(p => {
      const s = state(p), u = fileUrl(p.file);
      const ed = p.cat==='chart'
        ? `<b>AIRAC ${A.esc(p.airac||'—')}</b>${s.sub?' '+A.esc(T('until')+' '+dmy(s.sub)):''}`
        : `<b>${A.esc(p.ed?p.ed+'/'+(p.rev||'00'):'—')}</b>${p.eff?' '+A.esc(T('eff')+' '+dmy(p.eff)):''}`;
      return `<div class="prow">
        <div class="nm"><b>${A.esc(LL(p))}</b><span>${A.esc(p.id)}</span></div>
        <div class="ed">${ed}</div>
        <span class="badge b-${s.k}">${A.esc(A.L(s.t))}</span>
        ${u ? `<a class="go" href="${A.esc(u)}" target="_blank" rel="noopener">${A.esc(T('open'))} ↗</a>`
            : `<span class="go">${A.esc(T('nofile'))}</span>`}
        ${p.edit && A.isStaff()
            ? `<a class="go ed3" href="https://docs.google.com/document/d/${A.esc(p.edit)}/edit"
                 target="_blank" rel="noopener" title="ต้นฉบับที่แก้ไขได้ — แก้แล้วต้องเลื่อนเลขกำกับและทำ PDF ใหม่"
                 >${A.esc(T('editSrc'))} ✎</a>` : ''}</div>`;
    }).join('') : `<p class="sub" style="padding:9px 14px;border:1px dashed var(--border-med);border-radius:8px">${A.esc(T('none'))}</p>`);
  }
  return out.join('');
}

function paint(){
  document.getElementById('hd').textContent = T('pubs');
  document.getElementById('phead').textContent =
    A.L({th:'พิมพ์เมื่อ ',en:'Printed '}) + dmy(today()) +
    ' · AIRAC ' + (AIRAC[0]||{}).c + ' ' + T('until') + ' ' + dmy((AIRAC[0]||{}).to);

  // ป้ายแท็บบอกจำนวน และขึ้นแดงถ้ามีของหมดรอบ/ใกล้หมดอยู่ในแท็บนั้น
  document.getElementById('tabs').innerHTML = PUB.tabs.map(tb => {
    const list = PUBS.filter(p => inTab(p, tb.k));
    const bad = list.filter(p => ['out','soon'].includes(state(p).k)).length;
    return `<button class="ptab" role="tab" data-k="${A.esc(tb.k)}"
      aria-selected="${TAB===tb.k}">${A.esc(LL(tb))}
      <span class="b${bad?' warn':''}">${bad? '!'+bad : list.length}</span></button>`;
  }).join('');
  document.getElementById('tabs').querySelectorAll('[data-k]').forEach(b =>
    b.onclick = () => { TAB = b.dataset.k; paint(); });

  // เตือนของที่หมดรอบหรือใกล้หมด — รวมทุกแท็บ ขึ้นบนสุด ไม่ต้องไล่หา
  const bad = PUBS.map(p=>({p,s:state(p)})).filter(x=>x.s.k==='out'||x.s.k==='soon');
  document.getElementById('warn').innerHTML = !bad.length ? '' :
    `<div class="fk-gate ${bad.some(x=>x.s.k==='out')?'stop':'warn'}" style="margin:14px 0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
        stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 9.5v4.5"/>
        <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>${A.esc(A.L({th:'ต้องปรับปรุง ',en:'Needs attention: '}))}${
        bad.map(x=>A.esc(LL(x.p)+' ('+A.L(x.s.t)+')')).join(' · ')}</span></div>`;

  // พิมพ์ = ออกทุกแท็บ ไม่ใช่เฉพาะที่เปิดอยู่ จะได้เป็นสารบัญครบในใบเดียว
  document.getElementById('out').innerHTML = PUB.tabs.map(tb => `
    <section style="${(PRINTALL || TAB === tb.k) ? '' : 'display:none'}">
      ${PRINTALL ? `<h2 class="psec">${A.esc(LL(tb))}</h2>` : ''}
      ${tb.k === 'ac' ? acHtml() : tb.k === 'chart' ? chartHtml() : listHtml(tb.k)}</section>`).join('');

  const b = document.getElementById('sync');
  if (b) b.onclick = () => startSync(b);
}

/* ── ดึงแผนภูมิ ──────────────────────────────────────────────
   ค่าที่ได้จาก Apps Script ทับค่าที่ฝังมากับไฟล์ เพราะฝั่งนั้นสดกว่าเสมอ
   ทับเฉพาะช่องที่ระบบดึงเป็นคนเขียน (ap/op/นับ/รอบ) ไม่แตะชื่อสนามบินที่คนตั้ง */
function applySync(){
  if (!SYNC || !SYNC.started) return;
  const by = {};
  (SYNC.ads||[]).forEach(a => by[a.icao] = a);
  const eff = (SYNC.issue||{}).date || '';
  PUBS.forEach(p => {
    if (p.cat !== 'chart') return;
    const a = by[p.icao];
    if (!a) return;
    p.ap = a.ap || ''; p.op = a.op || '';
    p.nap = a.nap || 0; p.nop = a.nop || 0;
    p.eff = eff;
    p.airac = (SYNC.issue||{}).cycle || p.airac || '';
    p.syncedAt = SYNC.finishedAt || p.syncedAt || '';
  });
}

async function loadSync(){
  if (!A.isStaff()) return;              // คนทั่วไปเห็นค่าที่ฝังมากับไฟล์
  const r = await A.gas('aipStatus');
  if (!r.ok) return;
  SYNC = r.result;
  BUSY = (SYNC.started && !SYNC.finishedAt)
    ? { i: SYNC.i, total: SYNC.total, fail: SYNC.fail } : null;
  applySync(); paint();
  if (BUSY) schedulePoll();
}

/* ถามสถานะทุก 10 วิระหว่างที่ยังดึงอยู่ — ตัวดึงเดินทีละรอบ 5 นาทีตาม trigger
   ตัวเลขจึงขยับเป็นช่วง ไม่ใช่ไหลตลอด เขียนไว้กันคนคิดว่าค้าง */
function schedulePoll(){
  clearTimeout(POLL);
  POLL = setTimeout(loadSync, 10000);
}

async function startSync(btn){
  btn.disabled = true;
  BUSY = { i: 0, total: 0, fail: 0 }; paint();
  const r = await A.gas('aipSync');
  if (!r.ok){
    BUSY = null; paint();
    alert(A.L({th:'เริ่มไม่สำเร็จ: ',en:'Could not start: '}) + r.error);
    return;
  }
  SYNC = r.result.status;
  BUSY = { i: SYNC.i||0, total: SYNC.total||0, fail: SYNC.fail||0 };
  paint(); schedulePoll();
}

document.getElementById('prt').addEventListener('click', () => {
  PRINTALL = true; paint();
  window.print();
  PRINTALL = false; paint();
});
A.onLang.push(paint);

// เรียกท้ายสุด — paint ใช้ตัวช่วยที่ประกาศด้วย const ข้างบน
A.initAuth(@@FBCFG@@, () => { hydrate(); loadMade(); });
paint();
loadMade();
</script>
</body></html>
