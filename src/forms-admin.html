<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>จัดการฟอร์ม — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
.fmrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--border-light);border-radius:8px;
  padding:14px 18px;margin-bottom:10px}
.fmrow .hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.fmrow .ab{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--navy-900);
  background:var(--g-100);border-radius:5px;padding:1px 7px;letter-spacing:.02em}
.fmrow .cd{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--sky-600)}
.fmrow .rc{font-family:var(--font-mono);font-size:11px;color:var(--g-500)}
.fmrow .mt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fmrow .vr{font-size:12px;color:var(--g-500)}
.tag.dep{background:var(--sky-50,#eaf2fb);color:var(--sky-600);border:1px solid rgba(42,111,190,.25)}
.tag.man{background:var(--g-50);color:var(--fg-2);border:1px solid var(--border-light);
  font-family:var(--font-mono);font-size:10.5px}
.fmrow .nm{font-size:15px;font-weight:600;font-family:var(--font-sans);line-height:1.3}
.fmrow .mt{font-size:12.5px;color:var(--g-500);margin-top:3px}
.fmrow .act{display:flex;gap:8px;flex-wrap:wrap}
.fb.sm{min-height:36px;font-size:12.5px;padding:0 12px}
.filters select{min-height:40px;padding:0 11px;border-radius:8px;border:1px solid var(--border-med);
  background:var(--surface);font-size:13.5px;font-family:inherit;color:var(--fg-1)}
.filters .cnt{font-size:12.5px;color:var(--g-500);margin-left:auto}
dialog{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px);
  box-shadow:var(--sh-lg);background:var(--surface);color:var(--fg-1)}
dialog::backdrop{background:rgba(13,27,42,.5)}
dialog .dh{background:var(--navy-900);color:#fff;padding:18px 22px}
dialog .dh h3{font-size:18px;font-weight:700;color:#fff}
dialog .dh p{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}
dialog .db{padding:20px 22px;max-height:60vh;overflow:auto}
dialog .df{padding:14px 22px;border-top:1px solid var(--g-100);display:flex;gap:10px;
  justify-content:flex-end;flex-wrap:wrap}
.ver{border-left:2px solid var(--g-150);padding:0 0 14px 16px;margin-left:6px;position:relative}
.ver::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--sky-500)}
.ver .h{font-size:13.5px;font-weight:600;font-family:var(--font-sans)}
.ver .m{font-size:12.5px;color:var(--g-500);line-height:1.6}
.ver pre{font-family:var(--font-mono);font-size:11.5px;background:var(--g-50);border-radius:6px;
  padding:10px 12px;margin-top:8px;white-space:pre-wrap;line-height:1.6}
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="greet"><div>
      <p class="eyebrow">ผู้ดูแลระบบ · FORM MANAGEMENT</p>
      <h1>จัดการฟอร์ม</h1>
      <p class="sub">เพิ่มฟอร์ม · ออกเวอร์ชันใหม่ · เปิด-ปิดใช้งาน · ดูประวัติการแก้ไข</p></div>
      <button class="obtn" id="add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        เพิ่มนิยามฟอร์ม</button>
    </div>

    <div id="gate"></div>

    <div id="body" class="hide">
      <section>
        <div class="sh"><h2>สรุป</h2><span class="en">Overview</span></div>
        <div class="stats" id="sum"></div>
      </section>

      <section>
        <div class="sh"><h2>นิยามฟอร์ม</h2><span class="en">Form definitions</span>
          <span class="rt"><button class="fb sm" id="dl">ดาวน์โหลดทั้งหมดเป็น JSON</button></span></div>
        <div class="filters">
          <button class="fb" data-f="all" aria-pressed="true">ทั้งหมด</button>
          <button class="fb" data-f="published" aria-pressed="false">ใช้งานอยู่</button>
          <button class="fb" data-f="draft" aria-pressed="false">ร่าง</button>
          <button class="fb" data-f="disabled" aria-pressed="false">ปิดใช้งาน</button>
          <button class="fb" data-f="none" aria-pressed="false">ยังไม่มีนิยาม</button>
        </div>
        <div class="filters">
          <select id="fdep"><option value="">ทุกแผนก</option></select>
          <select id="fman"><option value="">ทุกคู่มือ</option></select>
          <input id="q" type="search" placeholder="ค้นหาด้วยตัวย่อ · เลขเอกสาร · ชื่อ">
          <span class="cnt" id="cnt"></span>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>

<dialog id="dlg"><form method="dialog">
  <div class="dh"><h3 id="dt">—</h3><p id="ds"></p></div>
  <div class="db" id="dbody"></div>
  <div class="df" id="dfoot"></div>
</form></dialog>

<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script src="@@BASE@@assets/formmgr.js"></script>
<script>
"use strict";
const REG = @@REG@@;
const A = D0507, M = FormMgr;
let DEFS = {}, FILTER = 'all';

/* ตัวเลือกแผนกและคู่มือสร้างจากทะเบียนจริง ไม่ได้พิมพ์ทิ้งไว้
   วันหนึ่งมีแผนกใหม่ในทะเบียน ตัวกรองจะมีให้เองโดยไม่ต้องแก้หน้านี้

   ต้องสร้างหลัง A.hydrate() — ชุดที่ฝังมากับหน้าเว็บไม่มี own และ lef
   (เป็นข้อมูลภายใน) สร้างตอนโหลดหน้าจะได้รายการว่าง แล้วตัวกรองจะเงียบ
   คือเลือกแล้วไม่กรองอะไรเลย ซึ่งแย่กว่าไม่มีตัวกรอง */
function fillPickers(){
  const dep = document.getElementById('fdep'), man = document.getElementById('fman');
  dep.length = 1; man.length = 1;
  [...new Set(REG.forms.map(f => f.own).filter(Boolean))].sort().forEach(k =>
    dep.add(new Option(k + ' · ' + A.deptName(k), k)));
  [...new Set(REG.forms.flatMap(f => f.lef || []))].sort().forEach(k =>
    man.add(new Option(k + ' · ' + A.manualName(k), k)));
  man.add(new Option('ยังไม่อยู่ใน LEF', '__none__'));
  if (dep.dataset.wired) return;
  dep.dataset.wired = '1';
  [dep, man].forEach(el => el.addEventListener('change', render));
  document.getElementById('q').addEventListener('input', render);
}

A.reg = REG;
A.initAuth(@@FBCFG@@, boot);

const dlg = document.getElementById('dlg');
function modal(title, sub, body, foot){
  document.getElementById('dt').textContent = title;
  document.getElementById('ds').textContent = sub || '';
  document.getElementById('dbody').innerHTML = body;
  document.getElementById('dfoot').innerHTML = foot;
  dlg.showModal();
}
const codes = () => REG.forms.map(f => f.abbr);
const meta  = c => REG.forms.find(f => f.abbr === c) || {};

async function boot(){
  const ok = A.isStaff();
  document.getElementById('body').classList.toggle('hide', !ok);
  document.getElementById('add').style.display = ok ? '' : 'none';
  document.getElementById('gate').innerHTML = ok ? '' :
    `<div class="note"><b>ต้องเข้าสู่ระบบก่อน</b> — หน้านี้แก้ไขนิยามฟอร์มของระบบ
     <br><a class="big pri" style="margin-top:12px;display:inline-flex" href="@@BASE@@staff-login/">เข้าสู่ระบบ</a></div>`;
  if (!ok) return;
  if (!A.isAdmin()){
    document.getElementById('body').classList.add('hide');
    document.getElementById('gate').innerHTML =
      `<div class="warn"><b>${A.esc(A.t('adminOnly'))}</b><br>${A.esc(A.t('adminOnlySub'))}
       <br><a class="big sec" style="margin-top:12px;display:inline-flex" href="@@BASE@@queue/">${A.esc(A.t('backToQueue'))}</a></div>`;
    return;
  }
  await refresh();
}

async function refresh(){
  try {
    DEFS = {};
    (await M.list(A.db)).forEach(d => DEFS[d.code] = d);
  } catch(e){
    document.getElementById('list').innerHTML =
      `<div class="warn">อ่านนิยามฟอร์มไม่ได้: ${A.esc(e.code || e.message)}</div>`;
    return;
  }
  const all = REG.forms.length;
  const n = s => Object.values(DEFS).filter(d => d.status === s).length;
  document.getElementById('sum').innerHTML = [
    ['grn', n('published'), 'ใช้งานอยู่'],
    ['sky', n('draft'),     'ร่าง — ยังไม่ publish'],
    ['', n('disabled'),     'ปิดใช้งาน'],
    ['amb', all - Object.keys(DEFS).length, 'ยังไม่มีนิยามฟอร์ม'],
  ].map(b => `<div class="stat ${b[0]}"><div class="top"><span class="ti">${A.esc(b[2])}</span>
      <span class="n">${b[1]}</span></div></div>`).join('');
  fillPickers();
  render();
}

function render(){
  const dep = document.getElementById('fdep').value;
  const man = document.getElementById('fman').value;
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  let shown = 0;
  const rows = REG.forms.map(f => {
    const d = DEFS[f.abbr];
    const st = d ? d.status : 'none';
    if (FILTER !== 'all' && FILTER !== st) return '';
    if (dep && f.own !== dep) return '';
    if (man === '__none__' && (f.lef || []).length) return '';
    if (man && man !== '__none__' && !(f.lef || []).includes(man)) return '';
    if (q && ![f.abbr, f.doc, f.code, f.t, f.th].join(' ').toLowerCase().includes(q)) return '';
    shown++;
    const lv = { published:'ok', draft:'sh2', disabled:'', none:'warn' }[st];
    const label = d ? M.STATUS[st] : 'ยังไม่มีนิยาม';
    const ver = d && d.defRev ? `Issue ${d.issue}/Rev ${d.rev} · defRev ${d.defRev}` :
                d ? 'ยังไม่เคย publish' : '—';
    const act = [];
    if (d) {
      act.push(`<button class="fb sm" data-hist="${A.esc(f.abbr)}">ประวัติ</button>`);
      act.push(`<button class="fb sm" data-pub="${A.esc(f.abbr)}">ออกเวอร์ชันใหม่</button>`);
      if (st === 'disabled') act.push(`<button class="fb sm" data-on="${A.esc(f.abbr)}">เปิดใช้งาน</button>`);
      else if (d.defRev) act.push(`<button class="fb sm" data-off="${A.esc(f.abbr)}">ปิดใช้งาน</button>`);
    } else {
      act.push(`<button class="fb sm" data-new="${A.esc(f.abbr)}">เพิ่มนิยาม</button>`);
    }
    /* ตัวย่อมาก่อนชื่อไทย — คนที่ทำงานกับเอกสารพวกนี้จำ ADF · NPC · FRAE
       ได้ก่อนชื่อเต็มเสมอ เห็นชื่อไทยอย่างเดียวแล้วนึกไม่ออกว่าใบไหน */
    return `<div class="fmrow">
      <div>
        <div class="hd"><span class="ab">${A.esc(f.abbr)}</span>
          <span class="cd">${A.esc(f.doc || '—')}</span>
          ${f.code ? `<span class="rc" title="เลขกำกับบนกระดาษ">${A.esc(f.code)}</span>` : ''}</div>
        <div class="nm">${A.esc(f.th || f.t)}</div>
        <div class="mt">
          <span class="tag ${lv}">${A.esc(label)}</span>
          <span class="tag dep" title="แผนกเจ้าของเอกสาร">${A.esc(A.deptName(f.own))}</span>
          ${(f.lef || []).map(m => `<span class="tag man" title="${A.esc(A.manualName(m))}">${A.esc(m)}</span>`).join('')}
          ${!(f.lef || []).length ? '<span class="tag warn">ยังไม่อยู่ใน LEF</span>' : ''}
          <span class="vr">${A.esc(ver)}</span></div></div>
      <div class="act">${act.join('')}</div></div>`;
  }).join('');
  document.getElementById('list').innerHTML = rows ||
    '<p class="note">ไม่มีฟอร์มที่ตรงเงื่อนไข</p>';
  document.getElementById('cnt').textContent =
    shown === REG.forms.length ? REG.forms.length + ' ใบ'
                               : shown + ' จาก ' + REG.forms.length + ' ใบ';

  document.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => history(b.dataset.hist));
  document.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => publishDlg(b.dataset.pub));
  document.querySelectorAll('[data-off]').forEach(b => b.onclick = () => toggle(b.dataset.off, 'disabled'));
  document.querySelectorAll('[data-on]').forEach(b => b.onclick = () => toggle(b.dataset.on, 'published'));
  document.querySelectorAll('[data-new]').forEach(b => b.onclick = () => importDlg(b.dataset.new));
}

document.querySelectorAll('.fb[data-f]').forEach(b => b.onclick = () => {
  FILTER = b.dataset.f;
  document.querySelectorAll('.fb[data-f]').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === FILTER));
  render();
});

/* ── เพิ่ม / นำเข้านิยาม ── */
document.getElementById('add').onclick = () => importDlg(null);

function importDlg(code){
  modal('เพิ่มนิยามฟอร์ม', code ? 'สำหรับ ' + code : 'เลือกไฟล์ JSON ตามแบบใน _SCHEMA.md',
    `<div class="fk-f"><label for="fj">ไฟล์นิยามฟอร์ม (.json)</label>
       <p class="hint">ระบบจะตรวจตามสเปกก่อนบันทึก และบันทึกเป็น <b>ร่าง</b> — ยังไม่มีผลกับผู้ใช้
         จนกว่าจะกด “ออกเวอร์ชันใหม่”</p>
       <input id="fj" type="file" accept=".json,application/json"></div>
     <div id="vres"></div>`,
    `<button class="fb" value="cancel">ยกเลิก</button>
     <button class="fb" id="doImport" disabled style="background:var(--navy-900);color:#fff;border-color:var(--navy-900)">บันทึกเป็นร่าง</button>`);

  let DEF = null;
  document.getElementById('fj').onchange = async ev => {
    const f = ev.target.files[0];
    const box = document.getElementById('vres');
    document.getElementById('doImport').disabled = true; DEF = null;
    if (!f) { box.innerHTML = ''; return; }
    try {
      const raw = JSON.parse(await f.text());
      if (code && raw.code !== code)
        throw new Error(`ไฟล์นี้เป็นของ "${raw.code}" ไม่ใช่ "${code}"`);
      const errs = M.validate(raw, codes());
      if (errs.length) {
        box.innerHTML = `<div class="warn"><b>ยังไม่ผ่านการตรวจ ${errs.length} ข้อ</b><br>· ${errs.map(A.esc).join('<br>· ')}</div>`;
        return;
      }
      DEF = raw;
      const nf = (raw.sections || []).reduce((a, s) => a + (s.fields || []).length, 0);
      box.innerHTML = `<div class="note"><b>${A.esc(raw.code)}</b> —
        ${(raw.parties || []).length} ฝ่าย · ${(raw.sections || []).length} ส่วน · ${nf} ฟิลด์ ·
        ${(raw.gates || []).length} gate · ${(raw.route || []).length} ขั้นอนุมัติ<br>ตรวจผ่านทั้งหมด</div>`;
      document.getElementById('doImport').disabled = false;
    } catch(e){ box.innerHTML = `<div class="warn">อ่านไฟล์ไม่ได้: ${A.esc(e.message)}</div>`; }
  };
  document.getElementById('doImport').onclick = async e => {
    e.preventDefault();
    if (!DEF) return;
    try { await M.saveDraft(A.db, A.user, DEF); dlg.close(); await refresh(); }
    catch(err){ alert('บันทึกไม่สำเร็จ: ' + err.message); }
  };
}

/* ── ออกเวอร์ชันใหม่ ── */
function publishDlg(code){
  const d = DEFS[code];
  const nextRev   = String(Number(d.rev) + 1).padStart(2, '0');
  const nextIssue = String(Number(d.issue) + 1).padStart(2, '0');
  modal('ออกเวอร์ชันใหม่ — ' + code, `ปัจจุบัน Issue ${d.issue}/Rev ${d.rev} · defRev ${d.defRev || 0}`,
    `<div class="fk-f"><label>ระดับการเปลี่ยนแปลงของเอกสารควบคุม</label>
       <div class="fk-opts" id="bump">
         <button type="button" class="fk-opt" data-v="none" aria-pressed="true">คงเลขเดิม ${A.esc(d.issue)}/${A.esc(d.rev)}</button>
         <button type="button" class="fk-opt" data-v="rev" aria-pressed="false">แก้ไข → ${A.esc(d.issue)}/${nextRev}</button>
         <button type="button" class="fk-opt" data-v="issue" aria-pressed="false">ออกฉบับใหม่ → ${nextIssue}/00</button>
       </div>
       <p class="hint" id="bhint">ใช้เมื่อแก้เรื่องที่ไม่กระทบเนื้อหาควบคุม เช่น คำอธิบายหรือคำค้น</p></div>
     <div class="fk-f"><label for="cn">แก้อะไร <span style="color:var(--red-500)">*</span></label>
       <textarea id="cn" placeholder="เช่น เพิ่มช่องชั่วโมงพักผ่อน 24 ชม. และปรับเกณฑ์คะแนนเป็น 3 ระดับ"></textarea></div>
     <div class="fk-f"><label>เหตุผล <span style="color:var(--red-500)">*</span></label>
       <div class="fk-opts" id="reason">${M.REASONS.map((r, i) =>
         `<button type="button" class="fk-opt" data-v="${r}" aria-pressed="${i === 0}">${r}</button>`).join('')}</div></div>
     <div class="warn">รุ่นที่ publish แล้วจะถูกแช่แข็งไว้ แก้ไม่ได้ลบไม่ได้ ·
       ใบที่กรอกด้วยรุ่นเก่ายังผูกกับรุ่นเดิมเสมอ</div>`,
    `<button class="fb" value="cancel">ยกเลิก</button>
     <button class="fb" id="doPub" style="background:var(--navy-900);color:#fff;border-color:var(--navy-900)">publish</button>`);

  let bump = 'none', reason = M.REASONS[0];
  const HINT = { none:'ใช้เมื่อแก้เรื่องที่ไม่กระทบเนื้อหาควบคุม เช่น คำอธิบายหรือคำค้น',
                 rev:'ต้องอัปเดต LEF ในคู่มือให้ตรงกับเลข Revision ใหม่',
                 issue:'ต้องอัปเดต LEF และแจ้ง Distribution List ตามขั้นตอนเอกสารควบคุม' };
  const pick = (sel, set) => document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    document.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', x === b));
    set(b.dataset.v);
  });
  pick('#bump .fk-opt', v => { bump = v; document.getElementById('bhint').textContent = HINT[v]; });
  pick('#reason .fk-opt', v => reason = v);

  document.getElementById('doPub').onclick = async e => {
    e.preventDefault();
    try {
      const v = await M.publish(A.db, A.user, code, {
        bump, reason, changeNote: document.getElementById('cn').value, knownCodes: codes() });
      dlg.close(); await refresh();
      alert('publish แล้ว — Issue ' + v.issue + '/Rev ' + v.rev + ' · defRev ' + v.defRev);
    } catch(err){ alert(err.message); }
  };
}

/* ── เปิด / ปิด ── */
async function toggle(code, status){
  const msg = status === 'disabled'
    ? 'ปิดใช้งานฟอร์มนี้?\n\nผู้ใช้จะเริ่มกรอกใบใหม่ไม่ได้ แต่ใบที่ค้างอยู่ยังเดินต่อจนจบได้'
    : 'เปิดใช้งานฟอร์มนี้?';
  if (!confirm(msg)) return;
  try { await M.setStatus(A.db, A.user, code, status); await refresh(); }
  catch(e){ alert(e.message); }
}

/* ── ประวัติ ── */
async function history(code){
  modal('ประวัติการแก้ไข — ' + code, 'log แก้ไขไม่ได้ ลบไม่ได้', '<p class="hint">กำลังโหลด…</p>',
    `<button class="fb" value="cancel">ปิด</button>`);
  try {
    const [vers, evs] = await Promise.all([M.versions(A.db, code), M.events(A.db, code)]);
    const fmt = t => t && t.toDate ? t.toDate().toLocaleString('th-TH') : '—';
    document.getElementById('dbody').innerHTML =
      `<h4 style="font-family:var(--font-display);font-size:15px;margin-bottom:10px">รุ่นที่ publish (${vers.length})</h4>` +
      (vers.length ? vers.map(v => `<div class="ver">
          <div class="h">Issue ${A.esc(v.issue)}/Rev ${A.esc(v.rev)} · defRev ${v.defRev}</div>
          <div class="m">${A.esc(v.changeNote || '—')}<br>
            ${A.esc(v.reason || '')} · ${A.esc(v.publishedBy || '')} · ${A.esc(fmt(v.publishedAt))}</div>
        </div>`).join('') : '<p class="hint">ยังไม่เคย publish</p>') +
      `<h4 style="font-family:var(--font-display);font-size:15px;margin:18px 0 10px">log ทั้งหมด (${evs.length})</h4>` +
      evs.map(e => `<div class="ver">
          <div class="h">${A.esc(e.action)}${e.toDefRev != null ? ' → defRev ' + e.toDefRev : ''}</div>
          <div class="m">${A.esc(e.changeNote || '—')}
            ${e.diff ? '<br>' + A.esc(M.diffText(e.diff)) : ''}<br>
            ${A.esc(e.by || '')} · ${A.esc(fmt(e.at))}</div>
          ${e.action === 'published' ? `<pre>${A.esc(M.editorNote(code, e))}</pre>` : ''}
        </div>`).join('');
  } catch(e){
    document.getElementById('dbody').innerHTML = `<div class="warn">อ่านประวัติไม่ได้: ${A.esc(e.code || e.message)}</div>`;
  }
}

/* ── สำรองลงเครื่อง ── */
document.getElementById('dl').onclick = () => {
  const blob = new Blob([JSON.stringify(Object.values(DEFS), null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'formdefs-backup.json';
  a.click();
};
</script>
</body></html>
