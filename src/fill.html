<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กรอกฟอร์ม — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
dialog{border:0;border-radius:12px;padding:0;max-width:680px;width:calc(100% - 32px);
  box-shadow:var(--sh-lg);background:var(--surface);color:var(--fg-1)}
dialog::backdrop{background:rgba(13,27,42,.5)}
dialog .dh{background:var(--navy-900);color:#fff;padding:18px 22px}
dialog .dh h3{font-size:18px;font-weight:700;color:#fff}
dialog .dh p{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}
dialog .db{padding:18px 22px;max-height:60vh;overflow:auto}
dialog .df{padding:14px 22px;border-top:1px solid var(--g-100);display:flex;gap:10px;
  justify-content:flex-end;flex-wrap:wrap}
.rvh{font-family:var(--font-display);font-size:14px;color:var(--sky-600);
  margin:18px 0 6px;letter-spacing:.02em}
.rvh:first-child{margin-top:0}
.rvr{display:flex;gap:14px;justify-content:space-between;align-items:baseline;
  padding:6px 0;border-bottom:1px solid var(--g-100);font-size:13.5px}
.rvr span{color:var(--g-600);flex:1}
.rvr b{font-weight:600;text-align:right;max-width:55%}
</style>
</head><body>
@@TOPBAR@@
<main class="main" style="max-width:860px;margin:0 auto">
  <div id="head"></div>
  <div id="form"></div>
  <div id="foot"></div>
</main>

<dialog id="rv"><form method="dialog">
  <div class="dh"><h3 id="rvt">—</h3><p id="rvs"></p></div>
  <div class="db" id="rvb"></div>
  <div class="df" id="rvf"></div>
</form></dialog>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script src="@@BASE@@assets/formkit.js"></script>
<script>
"use strict";
const REG=@@REG@@, DEFS=@@DEFS@@, A=D0507;
const code=new URLSearchParams(location.search).get('c')||'';
/* หน้านี้ฝังเฉพาะฟอร์มสาธารณะ (7 ใบ) ทะเบียนเต็มอยู่ Firestore อ่านได้เฉพาะเจ้าหน้าที่
   ฟอร์มของเจ้าหน้าที่อีก 12 ใบจึงต้องรอ hydrate ก่อน ไม่งั้นขึ้น "ไม่พบฟอร์มนี้"
   ทั้งที่นิยามฟอร์มมีครบและ publish แล้ว */
let F=REG.forms.find(f=>f.abbr===code);
const DEF=DEFS[code];
let FK=null, DIR=[], PICK='';   // DIR = รายชื่อผู้รับฟอร์ม · PICK = คนที่เลือกไว้
let DRAFT_AT=0;                // เวลาที่บันทึกร่างไว้ ถ้ามีร่างค้าง

/* แถบบอกสถานะเครือข่าย — ต้องเห็นตลอด ไม่ใช่รู้ตอนกดส่งแล้วไม่ผ่าน
   คนกรอกบนเครื่องบินต้องรู้ตั้งแต่แรกว่าตอนนี้ไม่มีสัญญาณ แต่กรอกต่อได้ */
function netBar(){
  let el=document.getElementById('netbar');
  if(!el){ el=document.createElement('div'); el.id='netbar';
    document.getElementById('head').insertAdjacentElement('afterend', el); }
  const off=!A.online;
  const dr = DRAFT_AT ? new Date(DRAFT_AT) : null;
  const when = dr ? dr.toLocaleString(A.lang==='en'?'en-GB':'th-TH',
                 {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  el.className = 'netbar' + (off?' off':'');
  el.innerHTML = off
    ? `<b>${A.esc(A.L({th:'ไม่มีสัญญาณ',en:'Offline'}))}</b> — ${A.esc(A.L({
        th:'กรอกต่อได้ ระบบเก็บไว้ในเครื่อง กดส่งแล้วจะส่งเองเมื่อมีสัญญาณ',
        en:'Keep filling. Answers are held on this device and sent when a signal returns.'}))}`
    : (DRAFT_AT ? `${A.esc(A.L({th:'มีร่างค้างจาก',en:'Draft restored from'}))} ${A.esc(when)} — ${
        A.esc(A.L({th:'กรอกต่อได้เลย',en:'continue where you left off'}))}` : '');
  el.style.display = (off || DRAFT_AT) ? '' : 'none';
}
A.onNet.push(netBar);

/* ขั้นอนุมัติถัดไปที่ใช้จริงตามคำตอบปัจจุบัน (undefined = จบที่ผู้กรอก) */
/* ชื่อของค่าที่คำนวณได้ ใช้เป็นหัวคอลัมน์ในชีตบันทึก
   ตัวส่งออกไม่มีนิยามฟอร์ม จึงรู้แค่คีย์ ('score') ซึ่งอ่านไม่ออกว่าคืออะไร
   ส่งไปเฉพาะตอนส่งออก ไม่เก็บลง Firestore */
function cLabels(){
  const out = {};
  (DEF.compute||[]).forEach(c => { if (c.label) out[c.k] = LL(c.label); });
  return out;
}

function nextStep(){
  if(!FK) return null;
  const ctx=FK.ctx();
  return (DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx))[1] || null;
}
function needsApproval(){ return !!nextStep(); }

/* ต้องเลือกผู้อนุมัติตอนส่งไหม
   assignedBy 'submitter' = ผู้ส่งเลือกเอง (FRAE — นักเรียนเลือกครู)
   assignedBy 'later'     = ส่งไปก่อน ระบบจับคู่ทีหลัง (SDF — เข้ากองรอผู้มีสิทธิ์รับ) */
/* กติกาอนุมัติมาจาก config/approvals (admin ตั้ง) ตกกลับไปใช้ค่าในนิยามฟอร์มถ้ายังไม่ได้ตั้ง */
function approval(){ return A.approvalOf(F.abbr, DEF, F); }
function pickAtSend(){ return !!nextStep() && approval().mode==='pick'; }

/* รายชื่อครูที่รับฟอร์มประเภทนี้ — อ่านได้ทั้งโลก มีแค่ชื่อกับตำแหน่ง ไม่มีอีเมล */
async function loadDir(){
  try{
    await A.loadApprovals();
    const d=await A.db.collection('publicDirectory').doc('instructors').get();
    const want=approval().position || F.assignTo;
    DIR=((d.exists&&d.data().list)||[]).filter(x=>!want||(x.recv||[]).includes(want));
  }catch(e){ DIR=[]; }
}
A.reg = REG;
/* ยังไม่เจอในชุดสาธารณะ = อาจเป็นฟอร์มของเจ้าหน้าที่ — ดึงทะเบียนเต็มมาหาอีกที
   ต้องรอ login ให้เสร็จก่อน rule ถึงจะยอมให้อ่าน registry/current */
let looked=false;
async function findInFull(){
  if(!F){ await A.hydrate(); F = A.reg.forms.find(f=>f.abbr===code) || null; }
  looked=true;
}
A.initAuth(@@FBCFG@@, async ()=>{ await findInFull(); boot(); });
boot();
// เปลี่ยนภาษาแล้ว render ใหม่ทั้งใบ — ข้อมูลที่กรอกไว้อยู่ใน FK.data ไม่หาย
A.onLang.push(()=>{ if(FK) FK.lang=A.lang; boot(); });

function boot(){
  const head=document.getElementById('head');
  // ยังไม่ได้ลองดึงทะเบียนเต็ม อย่าเพิ่งบอกว่าไม่มี — เดี๋ยวขึ้นแล้วหายวูบ
  if(!F){ head.innerHTML = looked
      ? `<div class="warn"><b>${A.esc(A.t('notFound'))}</b></div>`
      : `<div class="warn">${A.esc(A.t('loading'))}</div>`; return; }
  head.innerHTML=`<div class="fhero"><div class="band">
      <p class="o">D-0507 Flight Training Co., Ltd.</p><h1>${A.esc(A.nm(F))}</h1>
      <p class="en">${A.esc(A.lang==='en'?(F.th||''):(F.t||''))}</p></div>
      <div class="grid">
        <div><span>${A.esc(A.t('docCode'))}</span><b>${A.esc(F.doc||F.abbr)}</b></div>
        <div><span>${A.esc(A.t('issueRev'))}</span><b>${F.iss?A.esc(F.iss)+' / '+A.esc(F.rev):'—'}</b></div>
        <div><span>${A.esc(A.t('effective'))}</span><b>${A.esc(F.eff||'—')}</b></div>
      </div></div>`;
  if(!DEF){
    document.getElementById('form').innerHTML=`<div class="draftbar" style="margin-top:18px">
      <b>${A.esc(A.t('noDefTitle'))}</b><br>
      ${A.esc(A.t('noDefBody'))}
      <span class="mono">formdefs/${A.esc(code)}.json</span> ${A.esc(A.t('noDefBody2'))}
      <span class="mono">formdefs/_SCHEMA.md</span> ${A.esc(A.t('noDefBody3'))}</div>
      <div class="acts" style="margin-top:16px"><a class="big sec" href="${A.formUrl(F)}">← ${A.esc(A.t('backToForm'))}</a></div>`;
    return;
  }
  // เก็บคำตอบเดิมไว้เมื่อ boot ซ้ำ (เช่นตอนสลับภาษา หรือ auth เปลี่ยนสถานะ)
  /* boot แรกใช้ค่าที่ส่งมาทาง ?p= ถ้ามี แล้วทับด้วยร่างที่ค้างในเครื่อง
     นักบินกรอกบนเครื่องแล้วปิดแท็บ ลงมากรอกต่อได้ ค่าที่พิมพ์ไว้ต้องยังอยู่
     ร่างมาทีหลังเพราะเป็นสิ่งที่คนนี้พิมพ์เอง สำคัญกว่าค่าตั้งต้นจากลิงก์ */
  let keep = FK ? FK.data : prefill();
  if (!FK) {
    const d = A.draftLoad(code);
    if (d) { keep = Object.assign({}, keep, d.data); DRAFT_AT = d.at; }
  }
  FK=new FormKit(DEF,{party:partyOf(),lang:A.lang,data:keep,
    onChange:()=>{ A.draftSave(code, FK.data); renderFoot(); },
    upload:async f=>{const r=await A.gas('attach',Object.assign({code:DEF.code},f));
      return r.ok?r.result:{error:r.error};}});
  FK.render(document.getElementById('form'));
  renderFoot();
  netBar();
  loadDir();
}
/* หน้านี้เป็นการ "เริ่มใบใหม่" เสมอ — คนที่กดกรอกคือผู้เริ่ม
   จึงได้ฝ่ายของขั้นแรกใน route ไม่ว่าจะล็อกอินหรือไม่ ไม่ว่ามีบทบาทอะไร

   เดิมจับคู่ตามบทบาทตรงนี้ ทำให้คนที่มีบทบาทครูถูกจัดเป็นฝ่ายครูทันที
   ส่วนของ PIC เลยกลายเป็นอ่านอย่างเดียว — ครูกรอกใบของตัวเองไม่ได้เลย

   การจับคู่ตามบทบาทเป็นเรื่องของการ "เปิดใบที่ส่งมาแล้วเพื่อลงนาม"
   ซึ่งเป็นคนละหน้ากัน (คิวงาน) ไม่ใช่ตอนเริ่มใบใหม่ */
/* ?p=<base64url ของ JSON> — ค่าที่ระบบต้นทาง (เช่น TrainHub) เติมมาให้ล่วงหน้า
   เพื่อไม่ต้องคัดลอกผลการเรียนด้วยมือ

   เป็นแค่ "ค่าตั้งต้น" เท่านั้น ผู้กรอกแก้ได้ทุกช่องก่อนส่ง

   ฟิลด์ชนิด sign ถูกตัดทิ้งเสมอ ลิงก์ต้องปลอมลายเซ็นไม่ได้ ไม่ว่าใครสร้างลิงก์ */
/* ค่าที่ส่งมาต้องรอดข้ามการล็อกอิน
   EFC เป็นฟอร์มเจ้าหน้าที่ ต้องล็อกอินก่อนถึงจะมี DEF ให้เติม
   ถ้าผู้ใช้กดเข้าสู่ระบบแล้วกลับมาโดยไม่มี query string ค่าจะหายเงียบ ๆ
   จึงเก็บไว้ตั้งแต่ boot แรก แล้วอ่านคืนเมื่อ URL ไม่มีให้
   ผูกกับรหัสฟอร์มและลบทิ้งหลังใช้ — จะได้ไม่ค้างไปโผล่ในใบอื่น */
/* หน้านี้อ่าน query param สี่ตัวเท่านั้น — c p ref sys
   ที่เหลือถูกทิ้งเงียบ ๆ ระบบภายนอกที่ส่งชื่ออื่นมาจะไม่ได้อะไรกลับและไม่รู้ตัว
   เกิดขึ้นมาแล้วจริง: อีกทีมเขียนตัวเชื่อมไป 280 บรรทัดก่อนจะรู้ว่าค่าไม่เคยถึงฟอร์ม
   ตอนนั้น ref ระดับบนสุดยังถูกทิ้ง ตอนนี้รับแล้วทั้งสองทาง (ดู linkRef ข้างล่าง)
   ค่าที่เป็นคำตอบของฟอร์มยังต้องอยู่ "ข้างใน" p เหมือนเดิม */
(function warnUnknownParams(){
  const KNOWN=new Set(['c','p','ref','sys']);
  const extra=[...new URLSearchParams(location.search).keys()].filter(k=>!KNOWN.has(k));
  if(extra.length) console.warn(
    '[fill] ทิ้ง query param ที่ไม่รู้จัก: '+extra.join(', ')+
    ' — หน้านี้อ่านแค่ c p ref sys · คำตอบของฟอร์มต้องใส่ไว้ข้างใน p');
})();

const PKEY='d0507.prefill.'+(new URLSearchParams(location.search).get('c')||'');
(function stashP(){
  const raw=new URLSearchParams(location.search).get('p');
  if(raw){ try{ sessionStorage.setItem(PKEY,raw); }catch(e){} }
})();

/* ?ref= · ?sys= — ใบนี้ถูกเปิดจากระบบอื่น และระบบนั้นรอผลอยู่
   ตอนนี้มีที่เดียว: ระบบทำแผนการบินส่งผู้โดยสารมาลงนาม PWR

   เราไม่รู้และไม่ต้องรู้ว่า ref แปลว่าอะไร — เป็นสายที่ต้นทางผูกไว้กับแถวของเขาเอง
   หน้าที่ของเราคือถือไว้ให้ครบแล้วส่งคืนพร้อมผล ไม่ตีความ ไม่แก้

   เก็บลง sessionStorage ด้วยเหตุผลเดียวกับ ?p= — ถ้าสายขาดตอนผู้กรอกวนไปล็อกอิน
   ต้นทางจะรอผลที่ไม่มีวันมา ซึ่งมองจากฝั่งโน้นแยกไม่ออกจาก "ยังไม่ได้ลงนาม" */
const RKEY='d0507.extref.'+(new URLSearchParams(location.search).get('c')||'');
(function stashRef(){
  const q=new URLSearchParams(location.search);
  const ref=q.get('ref');
  if(ref){ try{ sessionStorage.setItem(RKEY,JSON.stringify({ref:ref,sys:q.get('sys')||''})); }catch(e){} }
})();

/* สายกลับมาได้สองทาง และเรารับทั้งสอง
     1. ใน `p` ปนมากับค่าที่เติมให้ — ทางที่ระบบทำแผนการบินใช้ตอนนี้
     2. เป็น query `?ref=&sys=` แยกต่างหาก — ทางที่ TrainHub ใช้

   ไม่เลือกข้างเพราะลิงก์ที่ส่งออกไปแล้วเรียกคืนไม่ได้ ผู้โดยสารที่ถือลิงก์แบบเก่า
   อยู่ในมือต้องใช้ได้เหมือนกัน การรับทางเดียวแล้วประกาศว่าอีกทางผิด แปลว่า
   ใบที่ส่งจากลิงก์เก่าจะเงียบหายโดยไม่มีอะไรฟ้อง */
function extLink(){
  const q=new URLSearchParams(location.search);
  let ref=q.get('ref')||'', sys=q.get('sys')||'';
  if(!ref){
    const p=prefillRaw();
    if(p&&p.ref){ ref=String(p.ref); sys=String(p.sys||''); }
  }
  if(!ref){
    try{ const o=JSON.parse(sessionStorage.getItem(RKEY)||'null');
         if(o&&o.ref){ ref=o.ref; sys=o.sys||''; } }catch(e){}
  }
  // ยาวผิดปกติ = ไม่ใช่สายที่ระบบต้นทางออกให้ ไม่ต้องแบกต่อ
  if(!ref||ref.length>120) return null;
  return { extRef:ref, extSystem:String(sys||'').slice(0,40) };
}

/* บอกระบบต้นทางว่าใบนี้เดินไปถึงไหนแล้ว
   ยิงผ่าน Apps Script ของเราเอง ไม่ยิงตรงจากเบราว์เซอร์ เพราะกุญแจร่วมระหว่าง
   สองระบบต้องไม่อยู่ในหน้าเว็บที่ host สาธารณะ

   ล้มได้โดยไม่ทำให้ใบหาย — ใบลง Firestore ไปแล้วก่อนถึงบรรทัดนี้เสมอ
   สิ่งที่เสียคือปลายทางรู้ช้า ไม่ใช่หลักฐานหาย */
async function notifyExt(link,status,tracking){
  if(!link||!link.extRef) return null;
  try{
    return await A.gas('extNotify',{ ref:link.extRef, sys:link.extSystem,
      status:status, tracking:tracking||'', formCode:code });
  }catch(e){ console.warn('[extNotify] แจ้งกลับระบบต้นทางไม่สำเร็จ',e); return null; }
}

/* อ่านค่าที่ส่งมาโดยไม่กิน — prefill() ลบ stash ทิ้งหลังใช้ เรียกซ้ำจะได้ค่าว่าง
   ตัวนี้จึงแยกไว้ให้ extLink() ส่องหา ref ได้โดยไม่ไปแย่งค่าของช่องกรอก */
function prefillRaw(){
  let raw=new URLSearchParams(location.search).get('p');
  if(!raw){ try{ raw=sessionStorage.getItem(PKEY); }catch(e){} }
  if(!raw) return null;
  try{
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return (o&&typeof o==='object'&&!Array.isArray(o))?o:null;
  }catch(e){ return null; }
}

function prefill(){
  let raw=new URLSearchParams(location.search).get('p');
  if(!raw){ try{ raw=sessionStorage.getItem(PKEY); }catch(e){} }
  if(!raw||!DEF) return {};
  try{ sessionStorage.removeItem(PKEY); }catch(e){}
  let o;
  try{
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    o=JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ console.warn('[prefill] อ่านค่าที่ส่งมาไม่ได้',e); return {}; }
  if(!o||typeof o!=='object'||Array.isArray(o)) return {};
  const signKeys=new Set();
  (DEF.sections||[]).forEach(sec=>(sec.fields||[]).forEach(f=>{
    if(f.type==='sign') signKeys.add(f.k);
  }));
  const out={};
  Object.keys(o).forEach(k=>{ if(!signKeys.has(k)) out[k]=o[k]; });
  return out;
}

function partyOf(){
  if(!DEF) return null;
  const first=(DEF.route||[])[0];
  return (first&&first.party) || (DEF.parties&&DEF.parties[0]||{}).k;
}
function renderFoot(){
  if(!FK) return;
  const miss=FK.validate(), stop=FK.blocked();
  document.getElementById('foot').innerHTML=`
    ${miss.length?`<div class="warn" style="margin-bottom:14px">${A.esc(A.t('incomplete'))}:
      ${A.esc(miss.map(m=>m.label).join(' · '))}</div>`:''}
    <div class="acts"><button class="big ${miss.length||stop?'off':'pri'}"
      ${miss.length||stop?'disabled':''} id="send">${A.esc(A.t('send'))}</button>
      <a class="big sec" href="${A.formUrl(F)}">${A.esc(A.t('cancel'))}</a></div>`;
  const b=document.getElementById('send');
  if(b && !b.disabled) b.addEventListener('click', e=>{ e.preventDefault(); review(); });
}

/* ── ตรวจทานก่อนส่ง ────────────────────────────────────────
   ใบนี้เป็นเอกสารควบคุม แก้ทีหลังไม่ได้ จึงต้องเห็นทุกคำตอบก่อนกดยืนยัน */
const dlg=document.getElementById('rv');
function modal(title,sub,body,foot){
  document.getElementById('rvt').textContent=title;
  document.getElementById('rvs').textContent=sub||'';
  document.getElementById('rvb').innerHTML=body;
  document.getElementById('rvf').innerHTML=foot;
  dlg.showModal();
}
const LL=(o)=>FormKit.L(o,A.lang);

/* หัวสรุป — ฟอร์มที่มีคะแนนรวมใช้ score · ฟอร์มอื่นใช้ ui.headline (SDF ใช้ชั่วโมง FTL)
   ก่อนหน้านี้โชว์ "0 คะแนนความเสี่ยงรวม" กับฟอร์มที่ไม่มีคะแนน ซึ่งอ่านแล้วเข้าใจผิด */
function headBox(c,next){
  const hl=DEF.ui&&DEF.ui.headline;
  // ไม่มีระบบคะแนน ก็ไม่ต้องมีกล่องตัวเลข — บอกแค่ว่าส่งแล้วไปไหนต่อ
  if(!FK.scored()) return next
    ? `<div class="rvnext" style="margin-bottom:14px">${A.esc(next)}</div>` : '';
  const big=hl ? (c[hl.value]===undefined?0:c[hl.value]) : c.score;
  const lab=hl ? FormKit.L(hl,A.lang)+' · '+A.t('limit')+' '+hl.of
               : FormKit.L({th:'คะแนนความเสี่ยงรวม',en:'Total risk score'},A.lang);
  return `<div class="fk-score ${FK.band().lv}"><span class="n">${A.esc(String(big))}</span>
    <span><b style="font-size:14.5px">${A.esc(lab)}</b><br>
    <span style="font-size:12.5px;color:var(--g-500)">${A.esc(next)}</span></span></div>`;
}

function shown(v,f){
  if(v===undefined||v===null||v==='') return '—';
  if(typeof v==='boolean') return v?'✓':'—';
  // ตารางติ๊ก — เก็บเป็น { ข้อ: ค่า } แสดงเป็นรายชื่อข้อที่ติ๊ก ไม่ใช่ [object Object]
  if(v&&typeof v==='object'&&!Array.isArray(v)&&f&&f.type==='checklist'){
    const nm=o=>o?LL(o.n)||o.v:'';
    const on=(f.items||[]).filter(it=>v[it.id]).map(it=>{
      const lab=LL(it)||it.th||it.id;
      const opt=(f.opts||[]).find(o=>o.v===v[it.id]);
      const val=opt?nm(opt):v[it.id];
      return (f.opts&&f.opts.length>1)?`${lab} — ${val}`:lab;
    });
    if(!on.length) return '—';
    return on.join('\n')+`  (${on.length}/${(f.items||[]).length})`;
  }
  // ตารางแถวซ้ำ — แถวว่างไม่ต้องแสดง คนตรวจทานจะได้เห็นเฉพาะที่กรอกจริง
  if(Array.isArray(v)&&v.length&&typeof v[0]==='object'){
    const cols=(f&&f.cols)||[];
    const rows=v.filter(r=>r&&Object.keys(r).some(k=>String(r[k]||'').trim()!==''));
    if(!rows.length) return '—';
    return rows.map((r,i)=>(i+1)+'. '+cols.map(c=>r[c.k]).filter(x=>String(x||'').trim()!=='')
      .join(' · ')).join('\n');
  }
  if(Array.isArray(v)) return v.join(' · ');
  if(typeof v==='string'&&v.indexOf('data:image')===0) return '✓ '+A.t('signed');
  if(f&&f.opt){ const o=f.opt.find(x=>String(x.v)===String(v)); if(o) return LL(o.n)||o.v; }
  if(f&&f.type==='date') return A.esc(v).split('-').reverse().join('/');
  return String(v);
}

function review(){
  const ctx=FK.ctx(), c=FK.computed(), gates=FK.gates();
  const me=partyOf();
  const rows=(DEF.sections||[])
    .filter(s=>FormKit.evalCond(s.showIf,ctx))
    // ส่วนที่ซ่อนจากฝ่ายอื่นก็ต้องไม่โผล่ในหน้าตรวจทานด้วย
    .filter(s=>!(s.hideOthers && me && s.party!==me))
    .map(sec=>{
    const fs=(sec.fields||[]).filter(f=>f.type!=='static'&&FormKit.evalCond(f.showIf,ctx));
    if(!fs.length) return '';
    // ช่องติ๊กแสดงเฉพาะข้อที่ติ๊ก แล้วสรุปจำนวนไว้ท้าย — ถ้าโชว์ '—' ครบทุกข้อ
    // ข้อที่ติ๊กจริงจะจมหายไปในแถวว่าง 36 แถว
    const box=fs.filter(f=>f.type==='check');
    const on=box.filter(f=>FK.data[f.k]);
    const rest=fs.filter(f=>f.type!=='check');
    const line=f=>`<div class="rvr"><span>${A.esc(LL(f.label))}</span>
        <b>${A.esc(shown(FK.data[f.k],f))}</b></div>`;
    return `<h4 class="rvh">${A.esc(LL(sec.title))}</h4>`
      + rest.map(line).join('') + on.map(line).join('')
      + (box.length?`<div class="rvr"><span>${A.esc(A.t('ticked'))}</span>
          <b>${on.length} / ${box.length}</b></div>`:'');
  }).join('');

  const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
  const st1=nextStep();
  const nx=(DEF.parties||[]).find(p=>p.k===(st1||{}).party);
  const next=!st1 ? A.t('endsHere')
    : st1.assignedBy==='submitter' ? A.t('goesToApproval')+' — '+(LL(nx&&nx.n)||st1.party)
    : A.t('goesToPool')+' — '+(LL(nx&&nx.n)||st1.party);

  // ผู้ที่ไม่ได้ล็อกอินปิดใบเองไม่ได้ — ใบต้องมีคนรับผิดชอบเสมอ
  const anon=!A.isStaff(), needs=needsApproval(), mustPick=pickAtSend();
  if(anon && !needs){
    modal(A.t('needLoginTitle'), A.t('needLoginSub'),
      `<p class="fk-static">${A.esc(A.t('needLoginBody'))}</p>`,
      `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
       <a class="big pri" href="@@BASE@@staff-login/?next=${
          encodeURIComponent(location.pathname + location.search)}">${A.esc(A.t('signIn'))}</a>`);
    return;
  }
  const picker = mustPick ? (DIR.length
    ? `<h4 class="rvh">${A.esc(A.t('sendToWho'))}</h4>
       <p class="hint" style="margin-bottom:8px">${A.esc(A.t('sendToWhoHint'))}</p>
       <div class="fk-opts" id="pick">`+DIR.map(x=>
         `<button type="button" class="fk-opt" data-uid="${A.esc(x.id)}"
            aria-pressed="${PICK===x.id}">${A.esc(x.name)}${x.cert?`<em style="font-style:normal;
            color:var(--g-500);font-size:11.5px;margin-left:7px">${A.esc(x.cert)}</em>`:''}</button>`).join('')+`</div>`
    : `<div class="fk-gate warn"><span>${A.esc(A.t('noRecipient'))}</span></div>`) : '';

  modal(A.t('reviewTitle'), A.t('reviewSub'),
    (gates.length?gates.map(g=>`<div class="fk-gate ${A.esc(g.level)}" style="margin-bottom:10px">
       <span>${A.esc(LL(g.msg))}</span></div>`).join(''):'')+
    headBox(c,next)+picker+rows,
    `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
     <button class="big pri" id="ok" value="ok">${A.esc(A.t('confirmSend'))}</button>`);
  const okb=document.getElementById('ok');
  const sync=()=>{ okb.disabled = mustPick && !PICK; okb.classList.toggle('off', okb.disabled); };
  document.querySelectorAll('#pick .fk-opt').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault(); PICK=b.dataset.uid;
    document.querySelectorAll('#pick .fk-opt').forEach(x=>x.setAttribute('aria-pressed', x===b));
    sync();
  }));
  sync();
  okb.addEventListener('click', e=>{ e.preventDefault(); if(okb.disabled) return; dlg.close(); send(); });
}

/* ── ส่งจริง ───────────────────────────────────────────────
   เขียนลง Firestore ก่อนเสมอ นั่นคือหลักฐานว่าส่งแล้ว
   ส่วนการทำ PDF/ชีต เป็นขั้นตามหลัง ล้มได้โดยไม่ทำให้ใบหาย */
async function send(){
  const foot=document.getElementById('foot');
  foot.innerHTML=`<div class="note">${A.esc(A.t('sending'))}</div>`;
  try{
    if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const u=firebase.auth().currentUser;
    const ref=A.db.collection('submissions').doc();
    const d=new Date(), p2=n=>String(n).padStart(2,'0');
    const trk=`${F.abbr}-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${ref.id.slice(0,4).toUpperCase()}`;
    const ctx=FK.ctx();
    const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
    const done=steps.length<=1;
    const st=steps[1]||null;

    // ลำดับคีย์และ status ต้องผ่าน newSubmissionOk() ใน firestore.rules
    // ผู้ไม่ล็อกอินสร้างได้เฉพาะ status 'pending' ที่มี assigneeUid จริงเท่านั้น
    const sub={
      formCode:F.abbr, tracking:trk,
      doc:F.doc||'', issue:F.iss||'', rev:F.rev||'', defRev:DEF.defRev||0,
      title:F.th||F.t||F.abbr,
      status: done?'complete':'pending',
      step: done?steps.length:2,
      assigneeUid: PICK||'',
      // ใบที่ยังไม่มีผู้รับต้องบอกว่าใครมีสิทธิ์รับไปอนุมัติ ไม่งั้นตกหล่นไม่มีใครรับผิดชอบ
      assignTo: (!PICK && st ? (approval().position || st.pool || F.assignTo || '') : ''),
      submitterUid:u.uid, submitterName:FK.data.picFirst?`${FK.data.picFirst} ${FK.data.picLast||''}`.trim():(u.displayName||''),
      submitterEmail:u.email||'',
      submittedAt:firebase.firestore.FieldValue.serverTimestamp(),
      computed:FK.computed(),
      data:FK.visibleData(),
    };
    // สายกลับไปยังระบบที่ส่งคนมา — เก็บไว้ในใบเอง ไม่ใช่แค่ใน sessionStorage
    // ขั้นอนุมัติเกิดทีหลัง คนละเครื่อง คนละคน ถ้าไม่ติดมากับใบ ตอนหัวหน้าครูฝึก
    // กดอนุมัติจะไม่มีอะไรบอกได้ว่าต้องแจ้งใครกลับ
    // (rules นับคีย์ไว้ที่ 22 — ใบนี้ 17 บวกสองยังอยู่ในนั้น)
    const link=extLink();
    if(link){ sub.extRef=link.extRef; sub.extSystem=link.extSystem; }
    await ref.set(sub);
    // ลบสายทิ้งเมื่อผูกกับใบเรียบร้อยแล้ว ไม่งั้นค้างไปโผล่ในใบถัดไปของแท็บเดียวกัน
    if(link){ try{ sessionStorage.removeItem(RKEY); }catch(e){} }

    // งานในคิวของผู้อนุมัติ — ถ้าไม่สร้าง ใบจะค้างเป็น pending โดยไม่มีใครเห็น
    if(!done){
      const who=DIR.find(x=>x.id===PICK)||{};
      await A.db.collection('tasks').add({
        subId:ref.id, formCode:F.abbr, tracking:trk, title:sub.title,
        assigneeUid:PICK||'', assigneeName:who.name||'',
        // ยังไม่มีผู้รับ = อยู่ในกองรอ ให้ผู้มีสิทธิ์ตามบทบาทมากดรับ
        state: PICK?'open':'pool',
        pool: PICK?'':(approval().position||(st&&st.pool)||F.assignTo||''),
        step:2,
        fromUid:u.uid, fromName:sub.submitterName,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
    }

    /* ── ยืนยันว่าถึงเซิร์ฟเวอร์จริงหรือยัง ────────────────────
       Firestore ที่เปิด persistence ไว้จะ resolve ทันทีจากแคชในเครื่อง
       แม้ไม่มีสัญญาณ — ใบไม่หาย แต่ยังไม่ถึงเซิร์ฟเวอร์
       บอกว่า "ส่งแล้ว" ตอนนั้นคือคำที่ไม่จริง คนกรอกอาจปิดเครื่องแล้วเดินจากไป
       ร่างในเครื่องจึงเก็บไว้จนกว่าเซิร์ฟเวอร์จะรับ ไม่ใช่ลบทันทีที่กดส่ง */
    const queued = await new Promise(res => {
      let done_=false;
      const un = ref.onSnapshot({includeMetadataChanges:true}, snap => {
        if (done_) return;
        if (!snap.metadata.hasPendingWrites){ done_=true; un(); res(false); }
      }, () => { if(!done_){ done_=true; res(true); } });
      // ไม่รอเกินสองวินาที — ถ้ายังไม่ยืนยันถือว่าเข้าคิว หน้าเว็บต้องไม่ค้าง
      setTimeout(() => { if(!done_){ done_=true; try{un();}catch(e){} res(true); } }, 2000);
    });
    if (!queued) A.draftClear(code);

    let ex=null;
    // render = ใบนี้ในรูปแบบที่พิมพ์ได้ (หัวข้อ ป้ายชื่อ ค่าที่อ่านออก ลายเซ็น)
    // ส่งไปกับการส่งออกเท่านั้น ไม่เก็บลง Firestore — ประกอบใหม่จากนิยามฟอร์มได้เสมอ
    // และ rules นับคีย์ของใบไว้ที่ 22
    if(done) ex=await A.exportSubmission(Object.assign({},sub,{
      submittedAt:d.toISOString(), render:FK.docSpec(), computedLabels:cLabels()}));

    /* แจ้งกลับทันทีที่ลงนามเสร็จ ไม่รอผลอนุมัติ
       ต้นทางถามคำถามเดียวคือ "คนนี้ลงนามหรือยัง" การอนุมัติของหัวหน้าครูฝึก
       เป็นขั้นตอนของระบบนี้ ปลายทางไม่ควรต้องรอมันก่อนจะทำบัญชีผู้โดยสารต่อ
       (พออนุมัติแล้วจะมีการแจ้งซ้ำอีกครั้งจากหน้าอนุมัติ) */
    const notified = await notifyExt(link, done?'approved':'submitted', trk);

    foot.innerHTML=`<div class="fk-gate ${queued?'warn':'info'}" style="margin-bottom:14px"><span>
        <b>${A.esc(queued ? A.L({th:'เก็บไว้ในเครื่องแล้ว — ยังไม่ถึงเซิร์ฟเวอร์',
                                 en:'Held on this device — not yet on the server'})
                          : A.t(done?'sentComplete':'sentPending'))}</b><br>
        ${queued ? A.esc(A.L({
            th:'ระบบจะส่งเองเมื่อมีสัญญาณ · อย่าเพิ่งล้างข้อมูลเบราว์เซอร์จนกว่าจะส่งสำเร็จ',
            en:'It will be sent automatically when a signal returns. Do not clear browser data until then.'}))+'<br>' : ''}
        ${A.esc(A.t('trackingNo'))}: <span class="mono">${A.esc(trk)}</span>
        ${link?'<br>'+A.esc(A.t(notified&&notified.ok?'extNotified':'extNotifyFailed')):''}
        ${ex&&ex.ok===false?'<br>'+A.esc(A.t('exportFailed'))+' '+A.esc(ex.error||''):''}
        ${ex&&ex.pdf?`<br><a href="${A.esc(ex.pdf)}" target="_blank" rel="noopener">PDF ↗</a>`:''}
      </span></div>
      <div class="acts"><a class="big pri" href="${A.formUrl(F)}">${A.esc(A.t('backToForm'))}</a>
        <a class="big sec" href="@@BASE@@all/">${A.esc(A.t('backToAll'))}</a></div>`;
    window.scrollTo({top:foot.getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'});
  }catch(e){
    foot.innerHTML=`<div class="fk-gate stop" style="margin-bottom:14px"><span>
        <b>${A.esc(A.t('sendFailed'))}</b><br>${A.esc(e.code||e.message||String(e))}
      </span></div>`;
    renderFootRetry();
  }
}
function renderFootRetry(){
  const d=document.createElement('div'); d.className='acts';
  d.innerHTML=`<button class="big pri" id="again">${A.esc(A.t('tryAgain'))}</button>`;
  document.getElementById('foot').appendChild(d);
  document.getElementById('again').addEventListener('click',()=>send());
}
</script>
