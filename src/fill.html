<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กรอกฟอร์ม — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
</head><body>
@@TOPBAR@@
<main class="main" style="max-width:860px;margin:0 auto">
  <div id="head"></div>
  <div id="form"></div>
  <div id="foot"></div>
</main>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script src="@@BASE@@assets/formkit.js"></script>
<script>
"use strict";
const REG=@@REG@@, DEFS=@@DEFS@@, A=D0507;
const code=new URLSearchParams(location.search).get('c')||'';
const F=REG.forms.find(f=>f.abbr===code);
const DEF=DEFS[code];
let FK=null;
A.reg = REG;
A.initAuth(@@FBCFG@@, boot); boot();

function boot(){
  const head=document.getElementById('head');
  if(!F){ head.innerHTML='<div class="warn"><b>ไม่พบฟอร์มนี้</b></div>'; return; }
  head.innerHTML=`<div class="fhero"><div class="band">
      <p class="o">D-0507 Flight Training Co., Ltd.</p><h1>${A.esc(F.th||F.t)}</h1>
      <p class="en">${A.esc(F.t)}</p></div>
      <div class="grid">
        <div><span>Doc code</span><b>${A.esc(F.doc||F.abbr)}</b></div>
        <div><span>Issue / Rev</span><b>${F.iss?A.esc(F.iss)+' / '+A.esc(F.rev):'—'}</b></div>
        <div><span>Effective</span><b>${A.esc(F.eff||'—')}</b></div>
      </div></div>`;
  if(!DEF){
    document.getElementById('form').innerHTML=`<div class="draftbar" style="margin-top:18px">
      <b>ฟอร์มนี้ยังไม่ได้ใส่ช่องกรอก</b><br>
      โครงระบบและตัวเรนเดอร์พร้อมแล้ว รอใส่นิยามฟอร์มที่
      <span class="mono">formdefs/${A.esc(code)}.json</span> ตามแบบมาตรฐานใน
      <span class="mono">formdefs/_SCHEMA.md</span> — เพิ่มไฟล์แล้ว build ก็ใช้ได้ทันที ไม่ต้องแก้โค้ด</div>
      <div class="acts" style="margin-top:16px"><a class="big sec" href="${A.formUrl(F)}">← กลับหน้าฟอร์ม</a></div>`;
    return;
  }
  FK=new FormKit(DEF,{party:partyOf(),onChange:()=>renderFoot()});
  FK.render(document.getElementById('form'));
  renderFoot();
}
function partyOf(){
  if(!DEF) return null;
  for(const p of DEF.parties||[]){
    if(p.auth==='public' && !A.isStaff()) return p.k;
    if(p.auth&&p.auth.startsWith('role:')&&A.roles.includes(p.auth.slice(5).toLowerCase())) return p.k;
  }
  return (DEF.parties&&DEF.parties[0]||{}).k;
}
function renderFoot(){
  if(!FK) return;
  const miss=FK.validate(), stop=FK.blocked();
  document.getElementById('foot').innerHTML=`
    ${miss.length?`<div class="warn" style="margin-bottom:14px">ยังกรอกไม่ครบ:
      ${A.esc(miss.map(m=>m.label).join(' · '))}</div>`:''}
    <div class="acts"><button class="big ${miss.length||stop?'off':'pri'}"
      ${miss.length||stop?'disabled':''} id="send">ส่งฟอร์ม</button>
      <a class="big sec" href="${A.formUrl(F)}">ยกเลิก</a></div>`;
}
</script>
</body></html>
