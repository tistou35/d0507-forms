<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>งานของฉัน — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
/* หนึ่งแถวต่อหนึ่งใบ — ชื่อใบและสถานะซ้าย ปุ่มขวา
   เดิมเป็นการ์ดที่กดได้ทั้งใบ มีทางไปทางเดียว ตอนนี้ต้องมีสามทาง (ทำงาน · ดู · พิมพ์) */
.qsec{margin-top:26px}
.qsec:first-of-type{margin-top:6px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--border-light);border-radius:10px;
  padding:12px 16px;margin-bottom:8px}
.qrow.hot{border-left:4px solid var(--amber-500)}
.qrow .t{font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow .m{font-size:12.5px;color:var(--g-500);margin-top:3px;line-height:1.55}
.qrow .m .mono{font-size:11.5px}
.qrow .b{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.qrow .b a{text-decoration:none}
.qrow .go{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
@media(max-width:640px){ .qrow{grid-template-columns:1fr} .qrow .b{justify-content:flex-start} }
.st{display:inline-flex;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.st.wait{background:var(--amber-100);color:var(--amber-600)}
.st.ok{background:var(--green-100);color:var(--green-600)}
.st.no{background:var(--red-100);color:var(--red-600)}
.st.dl{background:var(--sky-100);color:var(--sky-600)}
.empty{padding:14px 16px;border:1px dashed var(--border-med);border-radius:10px;color:var(--g-500);font-size:13.5px}
.qsec .sh .cnt{font-family:var(--font-mono);font-size:12px;color:var(--g-500);margin-left:8px}
.ffind{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ffind input{flex:1 1 240px;min-height:44px}
.ffind select{flex:0 1 200px;min-height:44px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchips button{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--border-med);background:var(--surface,#fff);
  cursor:pointer;font:inherit;font-size:13px;color:var(--fg-2)}
.fchips button[aria-pressed="true"]{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.fchips .n{font-family:var(--font-mono);font-size:11.5px;margin-left:6px;opacity:.75}
.kind{font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:4px;background:var(--g-100,#f1f5f9);color:var(--g-600,#475569)}
.where{color:var(--amber-600);font-weight:600}
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="greet"><div>
      <p class="eyebrow">งานของฉัน · MY QUEUE</p>
      <h1>งานของฉัน</h1>
      <p class="sub">ใบที่รอคุณอนุมัติหรือลงนาม และใบที่คุณส่งไปแล้ว — งาน CAR อยู่ที่ระบบตรวจสอบ ต้องเข้าสู่ระบบแยก</p></div></div>
    <div id="gate"></div>
    <section class="qsec" id="todo"></section>
    <section class="qsec" id="pool"></section>
    <section class="qsec" id="find"></section>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script>
"use strict";
const REG=@@REG@@, A=D0507;
A.reg = REG; A.paintFormCount();
A.initAuth(@@FBCFG@@, load);
A.onLang.push(() => load());

const esc=A.esc, L=o=>A.L(o);
const $=id=>document.getElementById(id);
const nameOf=code=>{ const f=REG.forms.find(x=>x.abbr===code); return f?A.nm(f):code; };
const when=v=>{ try{ const d=v&&v.toDate?v.toDate():(v?new Date(v):null);
  return d?d.toLocaleDateString(A.lang==='en'?'en-GB':'th-TH',{day:'2-digit',month:'short',year:'numeric'}):''; }catch(e){ return ''; } };
const ms=v=>{ try{ return v&&v.toMillis?v.toMillis():(v?new Date(v).getTime():0); }catch(e){ return 0; } };
const viewUrl=id=>'@@BASE@@view/?id='+encodeURIComponent(id);
const btnView=id=>id?`<a class="fb" href="${viewUrl(id)}">${esc(L({th:'ดู',en:'View'}))}</a>
  <a class="fb" href="${viewUrl(id)}&print=1" target="_blank" rel="noopener">${esc(L({th:'พิมพ์',en:'Print'}))}</a>`:'';
const head=(title,en,n)=>`<div class="sh"><h2>${esc(title)}<span class="cnt">${n}</span></h2><span class="en">${esc(en)}</span></div>`;

function load(){
  ['todo','pool','find'].forEach(k=>$(k).innerHTML='');
  if(!A.signedIn()){
    A.authGate($('gate'), {why: L({th:'งานของฉันแสดงใบที่ส่งถึงคุณและใบที่คุณส่งไป — เข้าสู่ระบบเพื่อดู',
                                  en:'My queue shows forms sent to you and forms you submitted — sign in to see them'})});
    return;
  }
  $('gate').innerHTML='';
  if(A.isStaff()) loadTasks();
  loadFind();
}

/* ── ค้นหาเอกสาร — ทุกใบและทุกบันทึกข้อความที่เกี่ยวกับฉัน รวมไว้ที่เดียว ─────────
   เดิมแยกเป็นสามส่วน (ใบที่ฉันส่ง · บันทึกข้อความ · ที่ฉันดำเนินการแล้ว 20 รายการล่าสุด)
   ไม่มีช่องค้น ใบที่ผ่านมือไปแล้วเกิน 20 รายการหาไม่เจอ และใบที่รออนุมัติไม่บอกว่าค้างอยู่ที่ใคร
   ที่มา: ใบที่ฉันส่ง · ใบที่เคยส่งถึงฉัน (tasks) · ใบในกองรอตำแหน่งของฉัน · บันทึกข้อความที่ฉันเกี่ยวข้อง
   ผู้ดูแลระบบเห็นทุกใบ · นักเรียนเห็นเฉพาะใบที่ตัวเองส่ง (rules อ่านใบคนอื่นไม่ได้) */
let FIND=[], FST='all', FSHOW=40;
async function loadFind(){
  const me=A.user.uid, staff=A.isStaff(), admin=A.isAdmin(), db=A.db;
  $('find').innerHTML=head(L({th:'ค้นหาเอกสาร',en:'Find a document'}),'All my forms & memos','…')+`<div class="empty">${esc(A.t('working'))}</div>`;
  const subs={}, role={}, addRole=(id,r)=>{ (role[id]=role[id]||new Set()).add(r); };
  const put=(d,r)=>{ subs[d.id]=Object.assign({id:d.id},d.data()); if(r) addRole(d.id,r); };
  let T=[], myPoolSubs=[];
  try{
    (await db.collection('submissions').where('submitterUid','==',me).get()).docs.forEach(d=>put(d,'ผู้ส่ง'));
    if(staff){
      T=(await db.collection('tasks').where('assigneeUid','==',me).get()).docs.map(d=>d.data()).filter(t=>t.subId);
      T.forEach(t=>addRole(t.subId, t.state==='open'?'รอฉัน':'ผ่านมือฉัน'));
      let recv=[]; try{ const d=await db.collection('publicDirectory').doc('instructors').get(); const x=((d.exists&&d.data().list)||[]).find(y=>y.id===me); recv=(x&&x.recv)||[]; }catch(e){}
      myPoolSubs=(await db.collection('tasks').where('state','==','pool').get()).docs.map(d=>d.data()).filter(t=>t.subId&&t.pool&&A.poolHas(recv,t.pool)).map(t=>t.subId);
      myPoolSubs.forEach(id=>addRole(id,'กองรอของฉัน'));
      if(admin) (await db.collection('submissions').get()).docs.forEach(d=>put(d,''));
      const need=[...new Set(T.map(t=>t.subId).concat(myPoolSubs))].filter(id=>!subs[id]);
      for(let i=0;i<need.length;i+=30){
        const s=await db.collection('submissions').where(firebase.firestore.FieldPath.documentId(),'in',need.slice(i,i+30)).get();
        s.docs.forEach(d=>put(d,''));
      }
    }
  }catch(e){
    $('find').innerHTML=head(L({th:'ค้นหาเอกสาร',en:'Find a document'}),'All my forms & memos','—')+
      `<div class="fk-gate stop"><span>${esc(L({th:'อ่านไม่ได้: ',en:'Could not read: '}))+esc(e.code||e.message)}</span></div>`;
    return;
  }
  // ใบที่ยังรออนุมัติ — ค้างที่ใคร (งานที่เปิดอยู่ของใบนั้น) · อ่าน tasks ได้เฉพาะเจ้าหน้าที่
  const at={};
  if(staff){
    const pend=Object.values(subs).filter(x=>x.status==='pending').map(x=>x.id);
    for(let i=0;i<pend.length;i+=30){
      try{ (await db.collection('tasks').where('subId','in',pend.slice(i,i+30)).get()).docs.map(d=>d.data())
        .filter(t=>t.state==='open'||t.state==='pool').forEach(t=>{ at[t.subId]= t.state==='pool' ? 'กองรอ '+(t.pool||'—') : (t.assigneeName||'—'); }); }catch(e){}
    }
  }
  const showTest=!!(A.profile&&A.profile.test);   // บัญชีทดสอบเห็นข้อมูลทดสอบ คนจริงไม่เห็น
  const rows=Object.values(subs).filter(x=>!x.test||showTest).map(x=>{ const st=A.subStatus(x);
    return { kind:'sub', id:x.id, code:x.formCode||'', title:x.title||nameOf(x.formCode), no:x.tracking||'', k:st.k, cls:st.cls, label:L(st.label),
      where: x.status==='pending' ? (at[x.id] ? 'ค้างที่ '+at[x.id] : (x.assignTo?'รอ '+x.assignTo:'ยังไม่มีผู้รับ')) : (x.closedBy?'โดย '+x.closedBy:''),
      who:x.submitterName||'', role:[...(role[x.id]||[])].join(' · '), t:ms(x.submittedAt), sub:x }; });
  // บันทึกข้อความ
  if(staff){
    const C=db.collection('memos'), Mm={};
    try{
      const qs = admin ? [C.get()] : [C.where('createdBy','==',me).get(), C.where('signers.proposer.uid','==',me).get(), C.where('signers.endorser.uid','==',me).get(),
        C.where('usignerUids','array-contains',me).get(), C.where('directorUids','array-contains',me).get()];
      (await Promise.all(qs)).forEach(s=>s.docs.forEach(d=>{ Mm[d.id]=Object.assign({id:d.id},d.data()); }));
    }catch(e){}
    const MST={routing:['wait','รอลงนามตามลำดับ'],draft:['wait','ร่าง'],submitted:['wait','รอผู้เสนอลงนาม'],returned:['no','ตีกลับ'],proposed:['wait','รอผู้สั่งการ/กรรมการ'],
      signed:['wait','ลงนามครบ · รอออกเลข'],issued:['ok','ออกแล้ว'],declined:['no','ไม่อนุมัติ'],cancelled:['no','ยกเลิก'],superseded:['ok','ถูกแทน'],recorded:['ok','ฉบับกระดาษ']};
    Object.values(Mm).filter(m=>!m.test||showTest).forEach(m=>{ const S=m.signers||{}, st=MST[m.status]||['wait',m.status];
      const r=[]; if(m.createdBy===me) r.push('ผู้จัดทำ'); if(S.proposer&&S.proposer.uid===me) r.push('ผู้เสนอ'); if(S.endorser&&S.endorser.uid===me) r.push('ผู้สั่งการ');
      if((m.directorUids||[]).includes(me)) r.push('กรรมการ'); (m.usigners||[]).forEach((u,i)=>{ if(u.uid===me) r.push('ผู้ลงนามลำดับที่ '+(i+1)); });
      const waitOn = m.status==='submitted' ? (S.proposer&&S.proposer.name) : m.status==='proposed' ? (m.board?'กรรมการ':(S.endorser&&S.endorser.name))
        : m.status==='signed' ? (m.createdByName||'ผู้จัดทำ')+' (ออกเลข)' : m.status==='routing' ? ((m.usigners||[])[m.cur||0]||{}).name : '';
      rows.push({ kind:'memo', id:m.id, code:'MEMO-'+(m.type||''), title:m.subject||'', no:m.number||m.docNumber||'(ยังไม่ออกเลข)', k:st[0], cls:st[0], label:st[1],
        where: st[0]==='wait'&&waitOn ? 'ค้างที่ '+waitOn : '', who:m.createdByName||'', role:r.join(' · '), t:ms(m.issuedAt||m.completedAt||m.createdAt), pdf:m.pdf&&m.pdf.url }); });
  }
  FIND=rows.sort((a,b)=>b.t-a.t); FSHOW=40;
  const codes=[...new Set(FIND.map(r=>r.code))].sort();
  const cnt=k=>FIND.filter(r=>k==='all'||r.k===k).length;
  $('find').innerHTML=head(L({th:'ค้นหาเอกสาร',en:'Find a document'}),'All my forms & memos',FIND.length)+
    `<p class="sub" style="margin:0 0 10px">${esc(L({th: admin?'ผู้ดูแลระบบเห็นทุกใบ · ค้นได้ทั้งชื่อเรื่อง เลขที่ ตัวย่อ และชื่อคน':'ทุกใบที่คุณส่ง ใบที่เคยส่งถึงคุณ ใบในกองรอตำแหน่งของคุณ และบันทึกข้อความที่คุณเกี่ยวข้อง · ค้นได้ทั้งชื่อเรื่อง เลขที่ ตัวย่อ และชื่อคน',
      en:'Everything you submitted, handled, can claim, or signed — search by title, number, form code or name'}))}</p>
    <div class="ffind"><input type="search" id="fq" placeholder="${esc(L({th:'ค้นหา เช่น MOC, ERP, เลขที่ หรือชื่อ',en:'Search e.g. MOC, ERP, a number or a name'}))}">
      <select id="fc"><option value="">${esc(L({th:'ทุกประเภท',en:'All types'}))}</option>${codes.map(c=>`<option value="${esc(c)}">${esc(c.startsWith('MEMO-')?'บันทึกข้อความ '+c.slice(5):c+' · '+nameOf(c))}</option>`).join('')}</select></div>
    <div class="fchips" id="fst">${[['all','ทั้งหมด'],['wait','รอดำเนินการ'],['ok','อนุมัติแล้ว / ออกแล้ว'],['no','ไม่อนุมัติ / ยกเลิก']].map(([k,t])=>
      `<button type="button" data-k="${k}" aria-pressed="${k===FST}">${esc(t)}<span class="n">${cnt(k)}</span></button>`).join('')}</div>
    <div id="flist"></div>`;
  $('fq').addEventListener('input',()=>{ FSHOW=40; paintFind(); }); $('fc').addEventListener('change',()=>{ FSHOW=40; paintFind(); });
  $('fst').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ FST=b.dataset.k; FSHOW=40;
    $('fst').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); paintFind(); }));
  paintFind();
}
function paintFind(){
  const q=($('fq').value||'').trim().toLowerCase(), c=$('fc').value;
  const R=FIND.filter(r=>(FST==='all'||r.k===FST) && (!c||r.code===c)
    && (!q || [r.code,r.title,r.no,r.who,r.where,r.role,r.label,nameOf(r.code)].join(' ').toLowerCase().includes(q)));
  $('flist').innerHTML = (R.length ? R.slice(0,FSHOW).map(r=>{
      const btn = r.kind==='memo'
        ? `<a class="fb go" href="@@BASE@@memo/?id=${encodeURIComponent(r.id)}">${esc(L({th:'เปิด',en:'Open'}))} →</a>${r.pdf?`<a class="fb" href="${esc(r.pdf)}" target="_blank" rel="noopener">PDF ↗</a>`:''}`
        : btnView(r.id);
      return `<div class="qrow${r.role.includes('รอฉัน')?' hot':''}"><div>
        <div class="t"><span class="kind">${esc(r.code)}</span>${esc(r.title)} <span class="st ${r.cls}">${esc(r.label)}</span></div>
        <div class="m"><span class="mono">${esc(r.no)}</span>${r.t?' · '+esc(when(r.t)):''}${r.who?' · '+esc(r.who):''}
          ${r.where?` · <span class="${r.k==='wait'?'where':''}">${esc(r.where)}</span>`:''}${r.role?'<br>'+esc(r.role):''}</div></div>
        <div class="b">${btn}</div></div>`; }).join('')
    : `<div class="empty">${esc(L({th:'ไม่พบเอกสารที่ตรงกับคำค้น',en:'No documents match'}))}</div>`)
    + (R.length>FSHOW?`<div class="acts2" style="margin-top:10px"><button class="fb" id="fmore">${esc(L({th:'แสดงเพิ่ม',en:'Show more'}))} (${R.length-FSHOW})</button></div>`:'');
  if($('fmore')) $('fmore').onclick=()=>{ FSHOW+=40; paintFind(); };
}

/* ── งานที่ส่งถึงฉัน ─────────────────────────────────────────
   อ่านทีเดียวด้วย assigneeUid แล้วแยกฝั่งเครื่อง — ค้างอยู่ / ทำไปแล้ว
   ไม่ใช้ where state in [...] คู่กับ assigneeUid เพราะต้องสร้าง composite index เพิ่ม */
async function loadTasks(){
  let T=[];
  try{
    const s=await A.db.collection('tasks').where('assigneeUid','==',A.user.uid).get();
    T=s.docs.map(d=>Object.assign({id:d.id},d.data()));
  }catch(e){
    $('todo').innerHTML=head(L({th:'รอฉันดำเนินการ',en:'Waiting for me'}),'To do','—')+
      `<div class="fk-gate stop"><span>${esc(L({th:'อ่านคิวงานไม่ได้: ',en:'Could not read the queue: '}))+esc(e.code||e.message)}</span></div>`;
    return;
  }
  const open=T.filter(t=>t.state==='open').sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  document.querySelectorAll('[data-cnt="queue"]').forEach(e=>e.textContent=open.length);

  $('todo').innerHTML=head(L({th:'รอฉันดำเนินการ',en:'Waiting for me'}),'To do',open.length)+
    (open.length ? open.map(t=>{
      const audit=t.app==='audit', memo=t.app==='memo';
      const go=audit?'@@BASE@@../d0507-audit/':memo?'@@BASE@@memo/?id='+encodeURIComponent(t.memoId):'@@BASE@@approve/?t='+encodeURIComponent(t.id);
      return `<div class="qrow hot"><div>
          <div class="t">${esc(t.title||nameOf(t.formCode))}
            ${t.delegated?`<span class="st dl">${esc(L({th:'มอบหมายต่อมาจาก ',en:'Delegated by '}))+esc(t.fromName||'—')}</span>`:''}</div>
          <div class="m"><span class="mono">${esc(t.tracking||'')}</span> ·
            ${esc(L({th:'จาก ',en:'From '}))}${esc(t.fromName||'—')}${t.createdAt?' · '+esc(when(t.createdAt)):''}
            ${t.note?'<br>'+esc(L({th:'หมายเหตุ: ',en:'Note: '}))+esc(t.note):''}</div></div>
        <div class="b"><a class="fb go" href="${go}">${esc(audit?L({th:'เปิดงานตรวจสอบ',en:'Open audit task'}):t.kind==='ack'?L({th:'อ่านและรับทราบ',en:'Read & acknowledge'}):t.kind==='mdate'?L({th:'ออกเลขและลงวันที่',en:'Assign number & date'}):L({th:'อนุมัติ / ลงนาม',en:'Approve / sign'}))} →</a>
          ${audit||memo?'':btnView(t.subId)}</div></div>`;
    }).join('') : `<div class="empty">${esc(L({th:'ไม่มีงานค้าง — ใบที่ส่งถึงคุณหรือมอบหมายต่อมาให้คุณจะขึ้นที่นี่',
                                              en:'Nothing waiting — forms sent or delegated to you appear here'}))}</div>`);

  loadPool();
}

/* ── กองรอ — ใบที่ยังไม่มีผู้รับ ใครมีตำแหน่งตรงกดรับได้ ── */
async function loadPool(){
  let recv=[];
  try{
    const d=await A.db.collection('publicDirectory').doc('instructors').get();
    const me=((d.exists&&d.data().list)||[]).find(x=>x.id===A.user.uid);
    recv=(me&&me.recv)||[];
  }catch(e){}
  let P=[];
  try{
    const ps=await A.db.collection('tasks').where('state','==','pool').get();
    P=ps.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>!t.pool||A.poolHas(recv,t.pool));
  }catch(e){ return; }
  if(!P.length) return;
  $('pool').innerHTML=head(A.t('poolTitle'),'Unassigned',P.length)+
    `<p class="sub" style="margin-bottom:12px">${esc(A.t('poolSub'))}</p>`+
    P.map(t=>`<div class="qrow"><div>
        <div class="t">${esc(t.title||nameOf(t.formCode))} <span class="st wait">${esc(t.pool||'')}</span></div>
        <div class="m"><span class="mono">${esc(t.tracking||'')}</span> · ${esc(A.t('fromWho'))}: ${esc(t.fromName||'—')}</div></div>
      <div class="b"><button class="fb go" data-claim="${esc(t.id)}">${esc(A.t('claim'))}</button>${btnView(t.subId)}</div></div>`).join('');
  $('pool').querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true; b.textContent=A.t('working');
    try{
      await A.db.collection('tasks').doc(b.dataset.claim).update({
        assigneeUid:A.user.uid, assigneeName:A.myName(),
        state:'open', claimedAt:firebase.firestore.FieldValue.serverTimestamp() });
      location.href='@@BASE@@approve/?t='+encodeURIComponent(b.dataset.claim);
    }catch(e){ b.disabled=false; b.textContent=e.code||e.message; }
  }));
}

</script>
</body></html>
