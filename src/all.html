<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คลังฟอร์ม — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="greet">
      <div><p class="eyebrow"><span data-t="allForms">คลังฟอร์ม</span> · <span data-t2="allForms">ALL FORMS</span></p>
        <h1 id="hd">—</h1>
        <p class="sub" data-t="allSub">รายการเดียว กรองได้ตามกลุ่มผู้ใช้ ระบบที่ฟอร์มอยู่ และสถานะเอกสาร</p></div>
    </div>

    <section>
      <div class="filters">
        <input id="q" type="search">
        <button class="fb" id="view" data-v="card">—</button>
      </div>
      <div class="filters" id="fgroup"></div>
      <div class="filters" id="fsys"></div>
      <div class="filters staffonly hide" id="fst"></div>
      <p class="sub" id="cnt" style="margin:4px 0 14px"></p>
      <div id="out"></div>
    </section>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script>
"use strict";
const REG = @@REG@@;
const A = D0507;
let GROUP='all', SYS='all', ST='all', VIEW='card';
document.querySelectorAll('[data-cnt="forms"]').forEach(
  e=>e.textContent=REG.forms.filter(f=>f.kind!=='ref' && (A.isStaff()||f.public)).length);
A.reg = REG;
A.initAuth(@@FBCFG@@, () => { chips(); paint(); });
// เปลี่ยนภาษาแล้ววาดใหม่ทั้งหน้า
A.onLang.push(() => { chips(); paint(); });

chips(); paint();

function pill(id, items, cur, set){
  document.getElementById(id).innerHTML = items.map(i =>
    `<button class="fb" data-v="${A.esc(i.v)}" aria-pressed="${i.v===cur}">${A.esc(i.n)}</button>`).join('');
  document.querySelectorAll('#'+id+' .fb').forEach(b => b.addEventListener('click', ()=>{
    set(b.dataset.v);
    document.querySelectorAll('#'+id+' .fb').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===b.dataset.v));
    paint();
  }));
}
function chips(){
  pill('fgroup', [{v:'all',n:A.t('allGroups')}].concat(REG.roles.map(r=>({v:r.k,n:A.n2(r)}))), GROUP, v=>GROUP=v);
  pill('fsys', [{v:'all',n:A.t('allSystems')}].concat(Object.keys(REG.systems).map(k=>({v:k,n:A.n2(REG.systems[k])}))), SYS, v=>SYS=v);
  if (A.isStaff()) {
    document.getElementById('fst').classList.remove('hide');
    pill('fst', [{v:'all',n:A.t('allStatus')},{v:'issue',n:A.t('stIssue')},
                 {v:'inlef',n:A.t('stInLef')},{v:'notlef',n:A.t('stNotLef')}], ST, v=>ST=v);
  }
}
function list(){
  /* เอกสารอ้างอิง (kind:'ref') ไม่ใช่ใบให้กรอก อยู่หมวดเช็กลิสต์และเอกสารเผยแพร่
     เคยปนอยู่ในรายการนี้แล้วขึ้นว่า "ยังไม่มีฟอร์มออนไลน์" ทั้งที่ไม่มีวันต้องมี */
  const FORMS = REG.forms.filter(f=>f.kind!=='ref');
  /* unlisted = อยู่ในชุดสาธารณะเพื่อให้เปิดจากลิงก์ได้ แต่ไม่ใช่ฟอร์มที่
     คนนอกเดินมาหยิบเอง จึงไม่ขึ้นเป็นการ์ดในคลัง */
  let L = A.isStaff() ? FORMS.slice() : FORMS.filter(f=>f.public);
  if (GROUP!=='all') L = L.filter(f=>f.r && f.r[GROUP]);
  if (SYS!=='all')   L = L.filter(f=>f.sys===SYS);
  if (A.isStaff()){
    if (ST==='issue')  L = L.filter(f=>f.st!=='ok');
    if (ST==='inlef')  L = L.filter(f=>f.lef && f.lef.length);
    if (ST==='notlef') L = L.filter(f=>!f.lef || !f.lef.length);
  }
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q) L = L.map(f=>({f,s:A.score(f,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.f);
  return L;
}
function paint(){
  const L = list();
  document.getElementById('hd').textContent = A.L(A.T.allFormsN)(L.length);
  document.getElementById('q').placeholder = A.t('searchAll');
  document.getElementById('view').textContent =
    A.t('viewAs') + ': ' + A.t(VIEW==='card'?'viewCard':'viewTable');
  document.getElementById('cnt').textContent =
    A.t(A.isStaff()?'viewStaff':'viewPublic');
  const role = GROUP!=='all' ? GROUP : (A.roles[0] || 'stu');
  document.getElementById('out').innerHTML = !L.length
    ? `<p class="note">${A.esc(A.t('noMatch'))}</p>`
    : VIEW==='card'
      ? '<div class="forms">' + L.map(f=>A.card(REG,f,f.r&&f.r[role])).join('') + '</div>'
      : table(L);
}
function table(L){
  return `<div class="twrap"><table class="reg"><thead><tr>
    <th>${A.esc(A.t('docCode'))}</th><th>${A.esc(A.t('colName'))}</th><th>${A.esc(A.t('colGroup'))}</th><th>${A.esc(A.t('colSystem'))}</th>${A.isStaff()?`<th>${A.esc(A.t('colStatus'))}</th>`:''}
    </tr></thead><tbody>` + L.map(f=>{
      const s=A.sysOf(REG,f), st=REG.status[f.st];
      return `<tr onclick="location.href='${A.formUrl(f)}'" style="cursor:pointer">
        <td class="c">${A.esc(f.doc||f.abbr)}</td>
        <td class="nm">${A.esc(A.nm(f))}<span class="th">${A.esc(A.lang==='en'?(f.th||''):(f.t||''))}</span></td>
        <td class="c">${A.esc(Object.keys(f.r||{}).map(k=>A.L(A.ROLE_N[k])||k).join(' · ')||'—')}</td>
        <td class="c">${A.esc(A.n2(s))}</td>
        ${A.isStaff()?`<td><span class="tag ${st?st.lv:''}">${A.esc(st?A.n2(st):'')}</span></td>`:''}
      </tr>`;}).join('') + `</tbody></table></div>`;
}
document.getElementById('q').addEventListener('input', paint);
document.getElementById('view').addEventListener('click', e=>{
  VIEW = VIEW==='card' ? 'table' : 'card';
  e.target.textContent = A.t('viewAs') + ': ' + A.t(VIEW==='card'?'viewCard':'viewTable');
  paint();
});
</script>
</body></html>
