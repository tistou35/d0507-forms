<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บันทึกข้อความ — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
/* ── หน้ารายการ ── */
.mbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mbar input,.mbar select{min-height:38px;padding:0 11px;border-radius:8px;border:1px solid var(--border-med);
  background:var(--surface);color:var(--fg-1);font-family:inherit;font-size:13.5px}
.mbar input{flex:1;min-width:180px}
.twrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:10px;background:var(--surface)}
table.ml{width:100%;border-collapse:collapse;font-size:13.5px}
table.ml th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--g-500);
  padding:9px 12px;border-bottom:1px solid var(--border-light);white-space:nowrap;background:var(--g-50)}
table.ml td{padding:9px 12px;border-bottom:1px solid var(--g-100);vertical-align:top}
table.ml tbody tr{cursor:pointer} table.ml tbody tr:hover{background:var(--sky-100)}
table.ml tr:last-child td{border-bottom:0}
.mono{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
.st{display:inline-flex;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.draft{background:var(--g-100);color:var(--g-600)} .st.submitted{background:var(--amber-100);color:var(--amber-600)}
.st.issued{background:var(--green-100);color:var(--green-600)} .st.returned{background:var(--red-100);color:var(--red-600)}
.st.cancelled,.st.superseded,.st.expired{background:var(--g-100);color:var(--g-500);text-decoration:line-through}
.empty{padding:16px;border:1px dashed var(--border-med);border-radius:10px;color:var(--g-500);font-size:13.5px}
/* ── ฟอร์มสร้าง ── */
.mf{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.mf .full{grid-column:1/-1}
.mf label{display:block;font-size:12.5px;color:var(--g-600);margin-bottom:5px}
.mf input[type=text],.mf input[type=date],.mf input[type=url],.mf select,.mf textarea{width:100%;min-height:40px;
  padding:8px 11px;border-radius:8px;border:1px solid var(--border-med);background:var(--surface);
  color:var(--fg-1);font-family:inherit;font-size:14px}
.mf .hint{font-size:12px;color:var(--g-500);margin-top:4px}
.mf .ck{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.mf .ck input{width:17px;height:17px;margin-top:2px}
.calc{background:var(--g-50);border-radius:8px;padding:9px 11px;font-family:var(--font-mono);font-size:13px;min-height:40px}
@media(max-width:700px){ .mf{grid-template-columns:1fr} }
.warnbox{margin:12px 0}
/* ── ตัวหนังสือ ── */
.letter{background:#fff;color:#111;border:1px solid var(--border-light);border-radius:6px;padding:40px 48px;
  max-width:820px;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.6}
.letter .org{text-align:center;font-weight:700;letter-spacing:.04em;font-size:15px}
.letter .org2{text-align:center;font-size:12px;color:#444}
.letter h2{text-align:center;font-size:18px;letter-spacing:.12em;margin:18px 0 14px;font-family:inherit}
.letter table.hd{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13.5px}
.letter table.hd td{padding:4px 8px;border:1px solid #bbb;vertical-align:top}
.letter table.hd td.k{width:22%;font-weight:700;background:#f4f4f4}
.letter .retro{border:2px solid #b45309;background:#fff7ed;padding:10px 12px;margin:10px 0 14px;font-size:13px}
.letter ol{padding-left:22px} .letter li{margin-bottom:8px}
.letter .val{margin:12px 0;font-size:13.5px}
.letter .note{font-style:italic;font-size:13px;margin-top:10px}
.letter .sig{margin-top:30px;min-height:110px}
.letter .sig img{max-height:70px;display:block}
.letter .sig .ln{border-top:1px solid #333;width:280px;margin-top:4px;padding-top:4px;font-size:13.5px}
.letter .stamp{font-size:11.5px;color:#555;margin-top:6px}
.letter .draftmark{color:#b91c1c;font-weight:700;text-align:center;letter-spacing:.2em;margin-bottom:8px}
.acts2{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.pad{border:1px dashed var(--border-med);border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:420px;height:150px}
@media print{ .noprint,header,nav,footer,.rail,.botnav{display:none!important} .letter{border:0;padding:0} }
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <div class="greet noprint"><div>
      <p class="eyebrow">บันทึกข้อความภายใน · INTERNAL MEMORANDUM</p>
      <h1 id="h1">บันทึกข้อความ</h1>
      <p class="sub" id="sub">ออกเลขที่ตอนลงนามเท่านั้น · วันที่ออกคือเวลาที่ลงนามจริง แก้ไม่ได้ · ห้ามลบ ยกเลิกหรือออกฉบับใหม่แทนเท่านั้น</p></div></div>
    <div id="gate"></div>
    <div id="app"></div>
  </main>
</div>
@@BOTNAV@@
<footer class="noprint">D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script>
"use strict";
const REG=@@REG@@, MT=@@MEMOTYPES@@, A=D0507;
const esc=A.esc, $=id=>document.getElementById(id);
const now=()=>firebase.firestore.FieldValue.serverTimestamp();
A.reg=REG;
const Q=new URLSearchParams(location.search);
let USERS=[], MEMOS=[];

/* ── วันที่ ────────────────────────────────────────────────
   เก็บเป็น YYYY-MM-DD เสมอ (ไม่มีเขตเวลามาปน) พิมพ์ออกเป็น DD MMM YYYY ตามคู่มือ */
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const ymd=d=>d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
const parse=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null; };
const long=s=>{ const d=parse(s); return d?String(d.getUTCDate()).padStart(2,'0')+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear():''; };
const addDays=(s,n)=>{ const d=parse(s); if(!d) return ''; d.setUTCDate(d.getUTCDate()+n); return ymd(d); };
/* วันมีผล + 1 ปี − 1 วัน · 29 ก.พ. + 1 ปี ให้ตกที่ 28 ก.พ. ไม่ไหลไป 1 มี.ค. */
const addYearsMinusDay=(s,n)=>{ const d=parse(s); if(!d) return '';
  const t=new Date(Date.UTC(d.getUTCFullYear()+n,d.getUTCMonth(),d.getUTCDate()));
  if(t.getUTCMonth()!==d.getUTCMonth()) t.setUTCDate(0);
  t.setUTCDate(t.getUTCDate()-1); return ymd(t); };
const bkkToday=()=>ymd(new Date(Date.now()+7*3600e3));
const tsDate=v=>{ try{ const d=v&&v.toDate?v.toDate():null; return d?ymd(new Date(d.getTime()+7*3600e3)):''; }catch(e){ return ''; } };
const tsFull=v=>{ try{ const d=v&&v.toDate?v.toDate():null; if(!d) return '';
  const b=new Date(d.getTime()+7*3600e3); return long(ymd(b))+' '+String(b.getUTCHours()).padStart(2,'0')+':'+String(b.getUTCMinutes()).padStart(2,'0')+' (UTC+7)'; }catch(e){ return ''; } };

const PURPOSE={ consider:{th:'เพื่อพิจารณา',en:'For consideration'}, approve:{th:'เพื่ออนุมัติ',en:'For approval'},
                inform:{th:'เพื่อทราบ',en:'For information'}, compliance:{th:'เพื่อถือปฏิบัติ',en:'For compliance'} };
const STATUS={ draft:'ร่าง', submitted:'รอลงนาม', returned:'ตีกลับ', issued:'ออกแล้ว',
               cancelled:'ยกเลิก', superseded:'ถูกแทน', expired:'หมดอายุ' };
const POSN={ HT:'Head of Training', ACM:'Accountable Manager', CFI:'Chief Flight Instructor', CMM:'Compliance Monitoring Manager',
             OPS:'Flight Operations', SM:'Safety Manager' };

A.initAuth(@@FBCFG@@, boot);

async function boot(){
  if(!A.signedIn()||!A.isStaff()){
    $('app').innerHTML='';
    A.authGate($('gate'),{why:A.L({th:'บันทึกข้อความภายในเปิดได้เฉพาะเจ้าหน้าที่',en:'Internal memos are for staff only'})});
    return;
  }
  $('gate').innerHTML='';
  try{ USERS=(await A.db.collection('users').get()).docs.map(d=>Object.assign({uid:d.id},d.data())).filter(u=>u.active!==false); }catch(e){ USERS=[]; }
  if(Q.get('id')) return viewMemo(Q.get('id'));
  if(Q.get('new')) return newMemo(Q.get('new'));
  return listMemos();
}

/* ── คน ───────────────────────────────────────────────────
   ผู้ได้รับมอบหมายบางคนยังไม่มีบัญชีในระบบ — พิมพ์ชื่อได้ uid ว่างไว้
   (หนังสือออกได้ตามปกติ ส่วนการกดรับทราบรอจนเจ้าตัวมีบัญชี) */
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function personKey(p){ return p ? (p.uid || 'name:'+norm(p.name)) : ''; }
function holders(pos){ return USERS.filter(u=>(u.positions||[]).includes(pos)); }

/* ผู้ลงนามตามตำแหน่ง — ถ้าผู้ลงนามปกติเป็นผู้ได้ประโยชน์ หรือผู้ประเมินประเมินตัวเอง
   ให้ขึ้นไปที่ตำแหน่งสำรอง (AUTH: HT → ACM) และผู้ลงนามต้องไม่ใช่ผู้ได้ประโยชน์เสมอ */
function resolveSigner(type, f){
  const cfg=MT[type].signer||{}, ben=f.beneficiary, ev=f.evaluator;
  const selfEval = ben && ev && personKey(ben)===personKey(ev);
  const pick = pos=>{ const h=holders(pos); return h.length===1 ? h[0] : (h.length>1 ? {multi:h} : null); };
  let pos=cfg.position, s=pick(pos), why='';
  const isBen = x=> x && !x.multi && ben && (x.uid===ben.uid || norm(x.name)===norm(ben.name));
  if(selfEval || isBen(s)){
    pos=cfg.conflictPosition; s=pick(pos);
    why = selfEval ? 'ผู้ประเมินประเมินตัวเอง' : 'ผู้ลงนามปกติเป็นผู้ได้รับประโยชน์';
  }
  if(!s) return { pos, why, error:'ยังไม่มีผู้ถือตำแหน่ง '+pos+' ('+(POSN[pos]||pos)+') ในระบบ — ตั้งตำแหน่งให้ที่หน้าตั้งค่าระบบก่อน' };
  if(s.multi) return { pos, why, error:'มีผู้ถือตำแหน่ง '+pos+' มากกว่าหนึ่งคน ('+s.multi.map(u=>u.name).join(', ')+') — ต้องเหลือคนเดียว' };
  if(isBen(s)) return { pos, why, error:'ผู้ลงนามเป็นผู้ได้รับประโยชน์จากหนังสือฉบับนี้ — ลงนามไม่ได้' };
  return { pos, why, uid:s.uid, name:s.name, title:POSN[pos]||pos };
}

/* ── ค่าที่ใช้แทนในหัวเรื่องและเนื้อหา ── */
function vars(type, f){
  const cfg=MT[type], v={};
  (cfg.fields||[]).forEach(x=>{
    const val=f[x.k];
    if(x.type==='person'){ v[x.k+'Name']=val?val.name:''; }
    else if(x.type==='select'){ const o=(x.opt||[]).find(o=>o.v===val)||{}; v[x.k]=val||''; Object.keys(o).forEach(k=>{ if(!['v','n'].includes(k)) v[k]=o[k]; }); }
    else { v[x.k]=val==null?'':val; if(x.type==='date') v[x.k+'Long']=long(val); }
  });
  computeInto(type, f); (cfg.compute||[]).forEach(c=>{ v[c.k]=f[c.k]||''; v[c.k+'Long']=long(f[c.k]); });
  v.scopeSentence = f.scope ? 'This authorisation is limited to: '+f.scope+'.' : '';
  return v;
}
function computeInto(type, f){
  (MT[type].compute||[]).forEach(c=>{
    const src=f[c.of];
    f[c.k] = c.op==='addDays' ? addDays(src,c.n) : c.op==='addYearsMinusDay' ? addYearsMinusDay(src,c.n) : '';
  });
}
const fill=(t,v)=>String(t||'').replace(/\{([a-zA-Z0-9_]+)\}/g,(m,k)=>v[k]==null?'':v[k]);
function bodyOf(type, v){ return (MT[type].body||[]).map(p=>fill(p,v)).filter(p=>p.trim()); }

/* ════════════════ รายการ ════════════════ */
async function listMemos(){
  $('h1').textContent='บันทึกข้อความ';
  const types=Object.values(MT);
  $('app').innerHTML=`<div class="acts2 noprint">${types.map(t=>`<a class="big pri" href="?new=${esc(t.code)}">+ ${esc(A.L(t.title))}</a>`).join('')}</div>
    <div id="list"><div class="empty">กำลังโหลด…</div></div>`;
  try{ MEMOS=(await A.db.collection('memos').get()).docs.map(d=>Object.assign({id:d.id},d.data())); }
  catch(e){ $('list').innerHTML=`<div class="empty">อ่านไม่ได้: ${esc(e.code||e.message)}</div>`; return; }
  MEMOS.sort((a,b)=>(b.seq||0)-(a.seq||0) || ((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  const today=bkkToday();
  const shown=MEMOS.filter(m=>!m.test || A.isAdmin());
  $('list').innerHTML = !shown.length ? '<div class="empty">ยังไม่มีบันทึกข้อความ</div>' :
    `<div class="twrap"><table class="ml"><thead><tr><th>เลขที่</th><th>ประเภท</th><th>เรื่อง</th><th>ผู้ลงนาม</th><th>มีผล</th><th>หมดอายุ</th><th>สถานะ</th></tr></thead><tbody>${
      shown.map(m=>{ const st = (m.status==='issued' && m.expiresOn && m.expiresOn<today) ? 'expired' : m.status;
        return `<tr data-id="${esc(m.id)}"><td class="mono">${esc(m.number||'— (ยังไม่ออกเลข)')}${m.test?' <b style="color:var(--red-600)">TEST</b>':''}</td>
        <td>${esc(m.type)}</td><td>${esc(m.subject||'')}</td><td>${esc((m.signer&&m.signer.name)||'—')}</td>
        <td class="mono">${esc(long(m.effectiveFrom))}</td><td class="mono">${esc(long(m.expiresOn))}</td>
        <td><span class="st ${esc(st)}">${esc(STATUS[st]||st)}</span></td></tr>`; }).join('')}</tbody></table></div>`;
  document.querySelectorAll('[data-id]').forEach(tr=>tr.addEventListener('click',()=>{ location.href='?id='+encodeURIComponent(tr.dataset.id); }));
}

/* ════════════════ สร้าง ════════════════ */
let F={};
function newMemo(type){
  const cfg=MT[type]; if(!cfg){ $('app').innerHTML='<div class="empty">ไม่รู้จักประเภทนี้</div>'; return; }
  $('h1').textContent='สร้าง'+A.L({th:'',en:' '})+A.L(cfg.title);
  F={};
  const opts=USERS.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)))
    .map(u=>`<option value="${esc(u.uid)}">${esc(u.name||u.email)}</option>`).join('');
  const fieldHtml=(cfg.fields||[]).map(x=>{
    const lab=`<label for="f_${x.k}">${esc(A.L(x.label))}${x.req?' <span style="color:var(--red-500)">*</span>':''}</label>`;
    const hint=x.hint?`<div class="hint">${esc(A.L(x.hint))}</div>`:'';
    if(x.type==='person') return `<div>${lab}<select id="f_${x.k}" data-k="${x.k}" data-t="person"><option value="">— เลือกจากรายชื่อ —</option>${opts}<option value="__free">ไม่มีในรายชื่อ — พิมพ์ชื่อเอง</option></select>
        <input type="text" id="f_${x.k}_free" data-k="${x.k}" data-t="personFree" placeholder="ชื่อ–นามสกุล (ตามที่ใช้ในเอกสาร)" style="display:none;margin-top:6px">${hint}</div>`;
    if(x.type==='select') return `<div>${lab}<select id="f_${x.k}" data-k="${x.k}"><option value="">—</option>${(x.opt||[]).map(o=>`<option value="${esc(o.v)}">${esc(A.L(o.n)||o.v)}</option>`).join('')}</select>${hint}</div>`;
    if(x.type==='check') return `<div class="full"><label class="ck"><input type="checkbox" id="f_${x.k}" data-k="${x.k}"> <span>${esc(A.L(x.label))}${x.req?' <span style="color:var(--red-500)">*</span>':''}</span></label>${hint}</div>`;
    const it = x.type==='date'?'date':x.type==='url'?'url':'text';
    return `<div${x.type==='url'||x.k==='scope'?' class="full"':''}>${lab}<input type="${it}" id="f_${x.k}" data-k="${x.k}" placeholder="${esc(x.ph||'')}">${hint}</div>`;
  }).join('');
  const calcHtml=(cfg.compute||[]).map(c=>`<div><label>${esc(A.L(c.label))} <span class="hint">(คำนวณเอง)</span></label><div class="calc" id="c_${c.k}">—</div></div>`).join('');
  $('app').innerHTML=`<div class="card"><div class="mf">${fieldHtml}${calcHtml}</div>
      <div id="chk" class="warnbox"></div>
      <h3 style="margin-top:18px">ตัวอย่างหนังสือ</h3><div id="pv"></div>
      <div class="acts2"><button class="big sec" id="save">บันทึกร่าง</button>
        <button class="big pri" id="submit">ส่งให้ผู้ลงนาม</button>
        ${A.isAdmin()?'<label class="ck" style="align-self:center;font-size:13px"><input type="checkbox" id="isTest"> ฉบับทดสอบ (ใช้เลขชุด TEST ไม่กินเลขจริง)</label>':''}
        <a class="big sec" href="./">ยกเลิก</a></div><div id="msg"></div></div>`;
  document.querySelectorAll('#app [data-k]').forEach(el=>{
    el.addEventListener('input',()=>readForm(type)); el.addEventListener('change',()=>readForm(type));
  });
  $('save').addEventListener('click',()=>saveMemo(type,false));
  $('submit').addEventListener('click',()=>saveMemo(type,true));
  readForm(type);
}
function readForm(type){
  const cfg=MT[type]; F={};
  (cfg.fields||[]).forEach(x=>{
    const el=$('f_'+x.k);
    if(x.type==='person'){
      const free=$('f_'+x.k+'_free'); free.style.display = el.value==='__free' ? '' : 'none';
      if(el.value==='__free') F[x.k] = free.value.trim() ? {uid:'', name:free.value.trim()} : null;
      else if(el.value){ const u=USERS.find(u=>u.uid===el.value); F[x.k]={uid:u.uid,name:u.name||u.email}; }
      else F[x.k]=null;
    } else if(x.type==='check') F[x.k]=el.checked;
    else F[x.k]=el.value.trim();
  });
  computeInto(type,F);
  (cfg.compute||[]).forEach(c=>{ $('c_'+c.k).textContent = F[c.k] ? long(F[c.k]) : '—'; });
  checks(type).then(r=>{ CHK=r; paintChecks(); });
  $('pv').innerHTML = letterHtml(draftModel(type));
}
let CHK={errors:[],warns:[],supersedes:null};
function paintChecks(){
  $('chk').innerHTML = CHK.errors.map(e=>`<div class="fk-gate stop" style="margin-bottom:8px"><span>${esc(e)}</span></div>`).join('')
    + CHK.warns.map(e=>`<div class="fk-gate warn" style="margin-bottom:8px"><span>${esc(e)}</span></div>`).join('');
}
/* ตรวจก่อนเสนอ — กฎกลาง + กฎเฉพาะ AUTH */
async function checks(type){
  const cfg=MT[type], errors=[], warns=[];
  (cfg.fields||[]).forEach(x=>{
    const v=F[x.k];
    if(x.req && (v==null||v===''||v===false)) errors.push('ยังไม่ได้กรอก: '+A.L(x.label));
    if(x.pattern && v && !new RegExp(x.pattern).test(v)) errors.push(A.L(x.label)+' ต้องอยู่ในรูปแบบ '+(x.ph||x.pattern));
  });
  const sg=resolveSigner(type,F);
  if(sg.error) errors.push('ผู้ลงนาม: '+sg.error);
  else if(sg.why) warns.push('ผู้ลงนามเปลี่ยนเป็น '+sg.title+' ('+sg.name+') เพราะ'+sg.why);
  if(F.beneficiary && F.evaluator && personKey(F.beneficiary)===personKey(F.evaluator))
    warns.push('ผู้ประเมินกับผู้ถูกประเมินเป็นคนเดียวกัน — ตรวจให้แน่ใจก่อนเสนอลงนาม');
  if(F.beneficiary && !F.beneficiary.uid) warns.push('ผู้ได้รับมอบหมายยังไม่มีบัญชีในระบบ — ออกหนังสือได้ แต่จะกดรับทราบได้เมื่อมีบัญชีแล้ว');
  if(F.effectiveFrom && F.effectiveFrom < bkkToday()) warns.push('วันมีผลอยู่ก่อนวันนี้ — หนังสือจะพิมพ์ข้อความ "ออกหนังสือยืนยันย้อนหลัง" ให้เอง (วันที่ออกยังเป็นวันที่ลงนามจริง)');
  if(F.effectiveFrom && F.effectiveFrom < bkkToday() && !(cfg.backdate&&cfg.backdate.allowed)) errors.push('ประเภทนี้ย้อนวันมีผลไม่ได้');
  // ฉบับเดิมที่ยังไม่หมดอายุ — ฉบับใหม่ต้องเป็น "แทนฉบับเลขที่ …"
  let supersedes=null;
  if(F.beneficiary && F.duty){
    try{
      if(!MEMOS.length) MEMOS=(await A.db.collection('memos').where('type','==',type).get()).docs.map(d=>Object.assign({id:d.id},d.data()));
      const old=MEMOS.filter(m=>m.type===type && m.status==='issued' && !m.test
        && m.beneficiaryKey===personKey(F.beneficiary) && m.fields && m.fields.duty===F.duty
        && (m.expiresOn||'')>=bkkToday());
      if(old.length){ supersedes={id:old[0].id, number:old[0].number};
        warns.push('มีหนังสือแต่งตั้งหน้าที่เดียวกันที่ยังไม่หมดอายุ ('+old[0].number+') — ฉบับนี้จะออกเป็น "แทนฉบับเลขที่ '+old[0].number+'"'); }
      const pending=MEMOS.filter(m=>m.type===type && ['draft','submitted','returned'].includes(m.status)
        && m.beneficiaryKey===personKey(F.beneficiary) && m.fields && m.fields.duty===F.duty);
      if(pending.length) warns.push('มีร่างหรือฉบับรอลงนามของคนนี้หน้าที่เดียวกันอยู่แล้ว '+pending.length+' ฉบับ');
    }catch(e){}
  }
  return {errors,warns,supersedes,signer:sg};
}
function draftModel(type){
  const cfg=MT[type], v=vars(type,F), sg=resolveSigner(type,F);
  return { type, subject:fill(cfg.subject,v), body:bodyOf(type,v), purpose:cfg.purpose,
    signer: sg.error?{name:'(position vacant)',title:POSN[sg.pos]||sg.pos||''}:sg, fields:F, effectiveFrom:F.effectiveFrom, expiresOn:F.expiresOn,
    beneficiaryName: F.beneficiary?F.beneficiary.name:'', status:'draft', supersedesNumber: CHK.supersedes&&CHK.supersedes.number };
}
function renderOf(type, f, sup){
  const cfg=MT[type], v=vars(type, Object.assign({}, f));
  return { cc:(cfg.distribution||[]).filter(d=>d.position).map(d=>d.label).join(' · '),
    purpose:(PURPOSE[cfg.purpose]||{}).en||'',
    reference:[f.flightId?'Flight ID '+f.flightId:'', v.evalForm||'', sup&&sup.number?'Supersedes '+sup.number:''].filter(Boolean).join(' · '),
    retro: cfg.backdate ? fill(cfg.backdate.statement, v) : '',
    validity:'Effective from: '+long(f.effectiveFrom)+'   ·   Valid until: '+long(f.expiresOn),
    note: cfg.fixedNote ? 'Note: '+cfg.fixedNote : '' };
}
async function saveMemo(type, submit){
  CHK=await checks(type); paintChecks();
  if(submit && CHK.errors.length){ $('msg').innerHTML='<div class="fk-gate stop"><span>ยังส่งไม่ได้ — แก้ข้อที่แดงก่อน</span></div>'; return; }
  const cfg=MT[type], v=vars(type,F), sg=CHK.signer, me=A.myName()||A.user.email;
  const test=!!($('isTest')&&$('isTest').checked);
  const doc={ type, status: submit?'submitted':'draft', test,
    subject:fill(cfg.subject,v), body:bodyOf(type,v), purpose:cfg.purpose,
    fields: JSON.parse(JSON.stringify(F)), effectiveFrom:F.effectiveFrom||'', expiresOn:F.expiresOn||'',
    beneficiaryUid:(F.beneficiary&&F.beneficiary.uid)||'', beneficiaryKey:personKey(F.beneficiary),
    beneficiaryName:(F.beneficiary&&F.beneficiary.name)||'',
    signer: sg.error ? {uid:'',name:'',title:sg.pos||'',pos:sg.pos||''} : {uid:sg.uid,name:sg.name,title:sg.title,pos:sg.pos},
    supersedes: CHK.supersedes||null,
    // ข้อความที่พิมพ์ลง PDF — ตรึงไว้ตอนสร้าง ตัวส่งออกอ่านจากตรงนี้ ไม่รับจากเบราว์เซอร์
    render: renderOf(type, F, CHK.supersedes),
    to: [ F.beneficiary ? F.beneficiary.name : '' ],
    cc: (cfg.distribution||[]).filter(d=>d.position).map(d=>d.label),
    createdBy:A.user.uid, createdByName:me, createdAt:now(),
    chain:[{action: submit?'submit':'draft', byUid:A.user.uid, byName:me, at:bkkToday()}] };
  $('save').disabled=$('submit').disabled=true;
  try{
    const ref=await A.db.collection('memos').add(doc);
    await ref.collection('events').add({action: submit?'submit':'draft', byUid:A.user.uid, byName:me, at:now()});
    if(submit) await taskFor(ref.id, doc);
    location.href='?id='+encodeURIComponent(ref.id);
  }catch(e){ $('save').disabled=$('submit').disabled=false;
    $('msg').innerHTML=`<div class="fk-gate stop"><span>บันทึกไม่สำเร็จ: ${esc(e.code||e.message)}</span></div>`; }
}
/* งานในคิวของผู้ลงนาม — ไม่สร้าง = หนังสือค้างโดยไม่มีใครเห็น */
async function taskFor(id, m){
  await A.db.collection('tasks').add({ app:'memo', memoId:id, subId:'', formCode:'MEMO-'+m.type,
    title:'ลงนาม: '+m.subject, tracking:'(ออกเลขเมื่อลงนาม)', assigneeUid:m.signer.uid, assigneeName:m.signer.name,
    state:'open', step:1, fromUid:A.user.uid, fromName:A.myName()||A.user.email, createdAt:now() });
}

/* ════════════════ ตัวหนังสือ (หน้าจอ = PDF) ════════════════ */

  const issued = m.status!=='draft' && m.status!=='submitted' && m.status!=='returned' && m.number;
  const issueDate = issued ? long(tsDate(m.issuedAt)) : '(set on signature)';
  const retro = m.effectiveFrom && (issued ? m.effectiveFrom < tsDate(m.issuedAt) : m.effectiveFrom < bkkToday());
  const cfg=MT[m.type]||{}, v=vars(m.type, Object.assign({}, m.fields||{}));
  const refs=[ m.fields&&m.fields.flightId ? 'Flight ID '+m.fields.flightId : '', v.evalForm||'',
               m.supersedesNumber||(m.supersedes&&m.supersedes.number) ? 'Supersedes '+(m.supersedesNumber||m.supersedes.number) : '' ].filter(Boolean);
  return `<div class="letter">
    ${issued?'':'<div class="draftmark">DRAFT — NOT ISSUED</div>'}
    <div class="org">D-0507 FLIGHT TRAINING CO., LTD.</div>
    <div class="org2">Approved Training Organisation</div>
    <h2>INTERNAL MEMORANDUM</h2>
    <table class="hd">
      <tr><td class="k">No.</td><td>${esc(issued?m.number:'(assigned on signature)')}</td><td class="k">Date of issue</td><td>${esc(issueDate)}</td></tr>
      <tr><td class="k">From</td><td colspan="3">${esc((m.signer&&m.signer.title)||POSN[m.signer&&m.signer.pos]||'')}${m.signer&&m.signer.name?' — '+esc(m.signer.name):' — (position vacant)'}</td></tr>
      <tr><td class="k">To</td><td colspan="3">${esc(m.beneficiaryName||'')}</td></tr>
      <tr><td class="k">CC</td><td colspan="3">${esc((cfg.distribution||[]).filter(d=>d.position).map(d=>d.label).join(' · '))}</td></tr>
      <tr><td class="k">Subject</td><td colspan="3"><b>${esc(m.subject||'')}</b></td></tr>
      <tr><td class="k">Purpose</td><td colspan="3">${esc((PURPOSE[m.purpose]||{}).en||'')}</td></tr>
      <tr><td class="k">Reference</td><td colspan="3">${esc(refs.join(' · '))}</td></tr>
    </table>
    ${retro && cfg.backdate ? `<div class="retro">${esc(fill(cfg.backdate.statement, v))}</div>`:''}
    <ol>${(m.body||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    <div class="val"><b>Effective from:</b> ${esc(long(m.effectiveFrom))} &nbsp;·&nbsp; <b>Valid until:</b> ${esc(long(m.expiresOn))}</div>
    ${cfg.fixedNote?`<div class="note">Note: ${esc(cfg.fixedNote)}</div>`:''}
    <div class="sig">${issued && m.signature ? `<img src="${esc(m.signature)}" alt="">` : '<div style="height:70px"></div>'}
      <div class="ln">${esc((m.signer&&m.signer.name)||'')}<br>${esc((m.signer&&m.signer.title)||'')}</div>
      ${issued?`<div class="stamp">Signed electronically on ${esc(tsFull(m.issuedAt))} in the D-0507 Forms system.</div>`:''}</div>
  </div>`;
}

/* ════════════════ ดู / ลงนาม ════════════════ */
let M=null, MREF=null;
async function viewMemo(id){
  MREF=A.db.collection('memos').doc(id);
  let s; try{ s=await MREF.get(); }catch(e){ $('app').innerHTML=`<div class="empty">เปิดไม่ได้: ${esc(e.code||e.message)}</div>`; return; }
  if(!s.exists){ $('app').innerHTML='<div class="empty">ไม่พบบันทึกข้อความนี้</div>'; return; }
  M=Object.assign({id:s.id},s.data());
  $('h1').textContent = M.number || 'ร่างบันทึกข้อความ';
  $('sub').textContent = A.L((MT[M.type]||{}).title||{}) + ' · ' + (STATUS[M.status]||M.status);
  const me=A.user.uid, isSigner = M.signer && M.signer.uid===me, isOwner = M.createdBy===me;
  const acts=[];
  if(M.status==='submitted' && isSigner) acts.push('sign');
  if(['draft','returned'].includes(M.status) && (isOwner||A.isAdmin())) acts.push('resubmit');
  if(['draft','submitted','returned'].includes(M.status) && (isOwner||A.isAdmin())) acts.push('cancel');
  if(M.status==='issued' && A.isAdmin()) acts.push('cancelIssued');
  $('app').innerHTML=`
    <div class="acts2 noprint"><a class="big sec" href="./">← รายการ</a>
      <button class="big sec" onclick="print()">พิมพ์</button>
      ${M.pdf&&M.pdf.url?`<a class="big sec" href="${esc(M.pdf.url)}" target="_blank" rel="noopener">PDF ↗</a>`:''}
      ${M.status==='issued'&&!(M.pdf&&M.pdf.url)?'<button class="big sec" id="mkpdf">สร้าง PDF</button>':''}
      ${M.test?'<b style="color:var(--red-600);align-self:center">ฉบับทดสอบ</b>':''}</div>
    ${M.status==='returned'&&M.returnNote?`<div class="fk-gate stop noprint" style="margin-bottom:12px"><span><b>ตีกลับ:</b> ${esc(M.returnNote)}</span></div>`:''}
    ${M.cancelNote?`<div class="fk-gate warn noprint" style="margin-bottom:12px"><span><b>ยกเลิก:</b> ${esc(M.cancelNote)}</span></div>`:''}
    ${M.supersededBy?`<div class="fk-gate warn noprint" style="margin-bottom:12px"><span>ถูกแทนด้วย ${esc(M.supersededBy)}</span></div>`:''}
    ${letterHtml(M)}
    <div class="noprint" id="pmsg"></div>
    <div class="noprint" id="actbox" style="margin-top:18px"></div>
    <div class="noprint" id="hist" style="margin-top:18px"></div>`;
  if($('mkpdf')) $('mkpdf').addEventListener('click',()=>makePdf(true));
  paintActions(acts);
  paintHistory();
}
function paintActions(acts){
  const box=$('actbox'); if(!acts.length){ box.innerHTML=''; return; }
  let h='';
  if(acts.includes('sign')) h+=`<div class="card"><h3>ลงนามและออกหนังสือ</h3>
      <p class="hint">ลงนามแล้วระบบออกเลขที่ถัดไปและล็อกวันที่ออกเป็นเวลานี้ทันที แก้ภายหลังไม่ได้</p>
      <canvas class="pad" id="pad" width="840" height="300"></canvas>
      <div class="acts2"><button class="fb" id="clr">ล้างลายเซ็น</button>
        <button class="big pri" id="doSign">ลงนามและออกเลข</button>
        <button class="big sec" id="doReturn">ตีกลับ</button></div><div id="amsg"></div></div>`;
  if(acts.includes('resubmit')) h+=`<div class="acts2"><button class="big pri" id="doResubmit">${M.status==='returned'?'ส่งให้ผู้ลงนามอีกครั้ง':'ส่งให้ผู้ลงนาม'}</button></div>`;
  if(acts.includes('cancel')||acts.includes('cancelIssued')) h+=`<div class="acts2"><button class="big sec" id="doCancel">ยกเลิกฉบับนี้</button></div>`;
  box.innerHTML=h+'<div id="amsg2"></div>';
  if($('pad')) pad($('pad'));
  if($('doSign')) $('doSign').addEventListener('click',signIssue);
  if($('doReturn')) $('doReturn').addEventListener('click',()=>simple('return'));
  if($('doResubmit')) $('doResubmit').addEventListener('click',()=>simple('resubmit'));
  if($('doCancel')) $('doCancel').addEventListener('click',()=>simple('cancel'));
}
async function paintHistory(){
  try{
    const ev=(await MREF.collection('events').get()).docs.map(d=>d.data()).sort((a,b)=>((a.at&&a.at.seconds)||0)-((b.at&&b.at.seconds)||0));
    const N={draft:'บันทึกร่าง',submit:'ส่งให้ผู้ลงนาม',resubmit:'ส่งอีกครั้ง',return:'ตีกลับ',issue:'ลงนามและออกเลข',cancel:'ยกเลิก',pdf:'สร้าง PDF',supersede:'ถูกแทน'};
    $('hist').innerHTML=`<h3>ประวัติ</h3><div class="twrap"><table class="ml"><tbody>${ev.map(e=>`<tr style="cursor:default"><td class="mono">${esc(tsFull(e.at))}</td><td>${esc(N[e.action]||e.action)}</td><td>${esc(e.byName||'')}</td><td>${esc(e.note||'')}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){}
}
/* แผ่นลงนาม — เส้นดำบนพื้นโปร่ง ส่งออกเป็น PNG */
let PAD_DIRTY=false;
function pad(cv){
  const x=cv.getContext('2d'); x.lineWidth=3.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111';
  let on=false; const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener('pointerdown',e=>{ on=true; cv.setPointerCapture(e.pointerId); const [a,b]=pt(e); x.beginPath(); x.moveTo(a,b); });
  cv.addEventListener('pointermove',e=>{ if(!on) return; const [a,b]=pt(e); x.lineTo(a,b); x.stroke(); PAD_DIRTY=true; });
  cv.addEventListener('pointerup',()=>{ on=false; });
  $('clr').addEventListener('click',()=>{ x.clearRect(0,0,cv.width,cv.height); PAD_DIRTY=false; });
}
const say=(t,bad)=>{ const e=$('amsg')||$('amsg2')||$('pmsg'); if(e) e.innerHTML=`<div class="fk-gate ${bad?'stop':'info'}" style="margin-top:10px"><span>${esc(t)}</span></div>`; };

/* ลงนาม = ออกเลข + ล็อกวันที่ออก ใน transaction เดียวกับตัวนับ
   เลขที่ = D0507-MEMO-<ปี พ.ศ.>/<ลำดับ 4 หลัก> (<ประเภท>) ลำดับเดียวทั้งองค์กรต่อปี
   ฉบับทดสอบใช้ตัวนับแยก (memo-test) และขึ้นต้นด้วย TEST- ไม่กินเลขจริง */
async function signIssue(){
  if(!PAD_DIRTY){ say('ยังไม่ได้ลงลายมือชื่อ',true); return; }
  if(!confirm('ลงนามและออกเลขที่ตอนนี้? วันที่ออกจะล็อกเป็นเวลานี้ และแก้ไม่ได้อีก')) return;
  $('doSign').disabled=true; say('กำลังออกเลข…');
  const sig=$('pad').toDataURL('image/png'), me=A.myName()||A.user.email;
  const yearBE = new Date(Date.now()+7*3600e3).getUTCFullYear()+543;
  const ctr = M.test ? 'memo-test' : 'memo-'+yearBE;
  let number='';
  try{
    await A.db.runTransaction(async tx=>{
      const cref=A.db.collection('counters').doc(ctr);
      const [c,m]=[await tx.get(cref), await tx.get(MREF)];
      if(!m.exists || m.data().status!=='submitted') throw new Error('หนังสือฉบับนี้ไม่ได้อยู่ในสถานะรอลงนามแล้ว');
      const seq = c.exists ? c.data().next : 1;
      number = (M.test?'TEST-':'') + 'D0507-MEMO-'+yearBE+'/'+String(seq).padStart(4,'0')+' ('+M.type+')';
      tx.set(cref,{next:seq+1});
      tx.update(MREF,{ status:'issued', number, seq, year:yearBE, counter:ctr, issuedAt:now(), signature:sig,
        chain:firebase.firestore.FieldValue.arrayUnion({action:'issue', byUid:A.user.uid, byName:me, at:bkkToday(), note:number}) });
    });
  }catch(e){ $('doSign').disabled=false; say('ออกเลขไม่สำเร็จ: '+(e.code||e.message),true); return; }
  try{ await MREF.collection('events').add({action:'issue', byUid:A.user.uid, byName:me, note:number, at:now()}); }catch(e){}
  try{ const ts=await A.db.collection('tasks').where('memoId','==',M.id).get();
       for(const d of ts.docs) if(d.data().state==='open') await d.ref.update({state:'done', closedAt:now(), tracking:number}); }catch(e){}
  // ฉบับเดิมที่ถูกแทน
  if(M.supersedes&&M.supersedes.id){
    try{ await A.db.collection('memos').doc(M.supersedes.id).update({status:'superseded', supersededBy:number});
         await A.db.collection('memos').doc(M.supersedes.id).collection('events').add({action:'supersede', byUid:A.user.uid, byName:me, note:number, at:now()}); }catch(e){}
  }
  say('ออกเลขแล้ว — '+number+' · กำลังสร้าง PDF…');
  await viewMemo(M.id);
  await makePdf(false);
}
/* PDF สร้างที่ตัวส่งออก (Apps Script) — ล้มได้โดยหนังสือไม่เสีย เลขและวันที่ออกบันทึกไว้แล้ว */
async function makePdf(manual){
  say('กำลังสร้าง PDF… (อาจใช้เวลาเกือบนาที)');
  if($('mkpdf')) $('mkpdf').disabled=true;
  const r=await A.gas('memoPdf', {memoId:M.id}, {timeout:120000});
  if(!r.ok){ if($('mkpdf')) $('mkpdf').disabled=false; say('ออกหนังสือแล้ว แต่สร้าง PDF ไม่สำเร็จ: '+r.error+' — กด "สร้าง PDF" อีกครั้งได้',true); return; }
  try{ await MREF.update({pdf:{id:r.result.id, url:r.result.url, at:now()}});
       await MREF.collection('events').add({action:'pdf', byUid:A.user.uid, byName:A.myName()||'', at:now()}); }catch(e){}
  await viewMemo(M.id);
  if(manual) say('สร้าง PDF แล้ว');
}
async function simple(kind){
  const me=A.myName()||A.user.email;
  let note='';
  if(kind==='return'||kind==='cancel'){
    note=prompt(kind==='return'?'เหตุผลที่ตีกลับ (บังคับ)':'เหตุผลที่ยกเลิก (บังคับ)')||'';
    if(!note.trim()) return;
  }
  const patch={ chain:firebase.firestore.FieldValue.arrayUnion({action:kind, byUid:A.user.uid, byName:me, at:bkkToday(), note}) };
  if(kind==='return'){ patch.status='returned'; patch.returnNote=note; }
  if(kind==='resubmit'){
    // ร่างที่บันทึกไว้ตอนตำแหน่งยังว่าง ไม่มีผู้ลงนาม — หาใหม่ทุกครั้งที่ส่ง ตามผู้ถือตำแหน่งปัจจุบัน
    const sg=resolveSigner(M.type, Object.assign({}, M.fields||{}));
    if(sg.error){ say('ส่งไม่ได้ — ผู้ลงนาม: '+sg.error, true); return; }
    patch.status='submitted'; patch.signer={uid:sg.uid, name:sg.name, title:sg.title, pos:sg.pos}; M.signer=patch.signer;
  }
  if(kind==='cancel'){ patch.status='cancelled'; patch.cancelNote=note; patch.cancelledBy=me; }
  try{
    await MREF.update(patch);
    await MREF.collection('events').add({action:kind, byUid:A.user.uid, byName:me, note, at:now()});
    const ts=await A.db.collection('tasks').where('memoId','==',M.id).get();
    for(const d of ts.docs) if(d.data().state==='open' && kind!=='resubmit') await d.ref.update({state:'done', closedAt:now(), note});
    if(kind==='resubmit') await taskFor(M.id, M);
    await viewMemo(M.id);
  }catch(e){ say('ทำไม่สำเร็จ: '+(e.code||e.message),true); }
}
