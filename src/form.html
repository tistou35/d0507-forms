<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@@FTITLE@@ — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <p class="eyebrow" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky-500)">
      <a href="@@BASE@@all/" style="color:inherit;text-decoration:none" data-t="allForms">คลังฟอร์ม</a> ·
      <span id="chain"></span></p>

    <div class="fhero">
      <div class="band">
        <p class="o" id="org">D-0507 Flight Training Co., Ltd.</p>
        <h1 id="th"></h1>
        <p class="en" id="en"></p>
      </div>
      <div class="grid" id="meta"></div>
    </div>

    <div class="acts" id="acts"></div>
    <div id="alerts"></div>

    <div class="card" id="guidewrap" style="display:none">
      <h3 id="guidehd"></h3>
      <div class="gitems" id="guide"></div>
    </div>

    <div class="card">
      <h3 data-t="whenWho">ฟอร์มนี้ใช้เมื่อไร · ใครเกี่ยวข้อง</h3>
      <dl class="kv" id="who"></dl>
    </div>

    <div class="card staffonly hide">
      <h3 data-t="ctrlStatus">สถานะเอกสารควบคุม</h3>
      <dl class="kv" id="ctrl"></dl>
    </div>

    <div class="card" id="flowwrap" style="display:none">
      <h3 data-t="flowTitle">ลำดับการออกใบ</h3>
      <p class="hint" id="flowdesc" style="margin:3px 0 0"></p>
      <div class="flowsteps" id="flowsteps"></div>
    </div>

    <div class="card" id="relwrap" style="display:none">
      <h3 data-t="related">ฟอร์มที่เกี่ยวข้องในสายงานเดียวกัน</h3>
      <div class="forms" id="rel" style="margin-top:4px"></div>
    </div>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script>
"use strict";
const REG = @@REG@@;
const F   = @@FORM@@;
const A   = D0507;
const CHAIN_N = {
  preflight:{th:'ก่อนทำการบิน',en:'Pre-flight'}, training:{th:'บันทึกการฝึก',en:'Training records'},
  safety:{th:'นิรภัย / SMS',en:'Safety / SMS'}, maint:{th:'ช่างอากาศยาน',en:'Maintenance'},
  standardisation:{th:'มาตรฐานครูการบิน',en:'Instructor standardisation'},
  doccontrol:{th:'ควบคุมเอกสาร',en:'Document control'}, admin:{th:'ธุรการ / บุคคล',en:'Admin / HR'},
  audit:{th:'งานตรวจสอบ',en:'Audit'}, ops:{th:'ปฏิบัติการบิน',en:'Flight operations'}};

document.querySelectorAll('[data-cnt="forms"]').forEach(e=>e.textContent=REG.lefcount.total||'');
document.getElementById('th').textContent = A.nm(F);
document.getElementById('en').textContent = F.t;

A.reg = REG;
/* เมื่อ login แล้ว A.hydrate() จะดึงทะเบียนเต็มมาใส่ A.reg — เอารายละเอียดควบคุมของฟอร์มนี้มาเติม */
A.initAuth(@@FBCFG@@, () => {
  const full = (A.reg.forms || []).find(x => x.abbr === F.abbr);
  if (full) Object.assign(F, full);
  paint();
});
paint();
// เปลี่ยนภาษาแล้ววาดใหม่ทั้งหน้า
A.onLang.push(() => paint());

function paint(){
  const staff = A.isStaff();
  document.getElementById('chain').textContent = A.L(CHAIN_N[F.chain]) || '—';
  const s = A.sysOf(REG, F);

  document.getElementById('meta').innerHTML = [
    [A.t('docCode'), F.doc || '—'],
    [A.t('ctrlCode'), staff ? (F.code || '—') : null],
    [A.t('issueRev'), F.iss ? F.iss + ' / ' + F.rev : '—'],
    [A.t('effective'), F.eff || '—'],
    [A.t('inSystem'), A.n2(s)],
  ].filter(x => x[1] !== null).map(x =>
    `<div><span>${A.esc(x[0])}</span><b>${A.esc(x[1])}</b></div>`).join('');

  /* เอกสารอ้างอิงไม่ใช่ใบกรอก — ทะเบียนคุมมันเหมือนกันเพราะมันคือเอกสารควบคุม
     แต่หน้าเว็บต้องไม่บอกว่า "ยังไม่มีฟอร์มออนไลน์" ราวกับรอใครมาทำให้
     เกณฑ์การให้คะแนนจะไม่มีวันมีช่องกรอก การรอนั้นไม่มีวันจบ */
  const isRef = F.kind === 'ref';
  const t = isRef ? null : A.target(REG, F);
  const openDoc = A.L(isRef ? {th:'เปิดเอกสาร',en:'Open document'}
                            : {th:'ฟอร์มเปล่า (PDF)',en:'Blank form (PDF)'});
  document.getElementById('acts').innerHTML =
    (t ? `<a class="big pri" href="${A.esc(t.url)}"${t.ext?' target="_blank" rel="noopener"':''}>${A.esc(t.label)}${t.ext?' ↗':''}</a>` :
     isRef ? '' : `<span class="big off">${A.esc(A.t('noOnline'))}</span>`) +
    /* ฟอร์มที่ย้ายไปทำในระบบอื่นแล้ว คนยังต้องเห็นหน้าตาเอกสารได้
       ไม่งั้นต้องไปรื้อไฟล์ .docx เอง ซึ่งคนทั่วไปเปิดไม่ได้
       download ให้ชื่อไฟล์เป็นเลขเอกสาร ไม่ใช่ตัวย่อ — คนดาวน์โหลดไปเก็บ
       ต้องรู้ว่าเป็นเอกสารอะไรจากชื่อไฟล์โดยไม่ต้องเปิด */
    (F.blank ? `<a class="big ${isRef?'pri':'sec'}" href="@@BASE@@${A.esc(F.blank)}"
        download="${A.esc((F.doc||F.abbr)+'.pdf')}" target="_blank" rel="noopener">${
        A.esc(openDoc)} ↓</a>` : '') +
    /* แม่แบบ Google Doc — ตัวที่ระบบเอาไปเติมคำตอบแล้วออกเป็น PDF
       เป็นของเจ้าหน้าที่เท่านั้น เปิดได้เฉพาะคนที่มีสิทธิ์ใน Drive อยู่แล้ว
       คนนอกเห็นลิงก์ไปก็เปิดไม่ได้ แต่ไม่ควรเห็นตั้งแต่แรก */
    (staff && F.tpl ? `<a class="big sec" href="https://docs.google.com/document/d/${
        A.esc(F.tpl)}/edit" target="_blank" rel="noopener">${
        A.esc(A.L({th:'แม่แบบ Google Doc',en:'Google Doc template'}))} ↗</a>` : '') +
    /* ใบที่มีหน้าจัดการของตัวเอง (ตอนนี้มี DRC — เตรียมรายการแล้วสร้างลิงก์ให้ผู้รับ)
       ที่อยู่มาจากทะเบียน ไม่ได้ฝังตัวย่อไว้ในหน้านี้ ใบต่อไปที่ต้องมีหน้าจัดการ
       จึงเพิ่มได้ที่ทะเบียนอย่างเดียว */
    (staff && F.admin ? `<a class="big sec" href="@@BASE@@${A.esc(F.admin.url)}">${
        A.esc(A.L(F.admin.n))}</a>` : '') +
    `<a class="big sec" href="@@BASE@@all/">${A.esc(A.t('backToAll'))}</a>`;

  /* ขอบเขตการประเมิน — ใช้กับฟอร์มที่ตัวเอกสารอยู่ที่นี่เพื่อควบคุม
     แต่การกรอกจริงไปทำที่ระบบอื่น หน้านี้จึงต้องบอกให้ชัดว่าครอบคลุมอะไรและใครเป็นผู้ประเมิน */
  if (F.guide && (F.guide.items || []).length) {
    document.getElementById('guidewrap').style.display = '';
    document.getElementById('guidehd').textContent = A.L(F.guide);
    /* ฟอร์มที่ผู้ประเมินเป็นคนเดียวกันทุกหัวข้อ (เช่น SEF นักเรียนประเมินทั้งใบ)
       ไม่ต้องมีคอลัมน์ผู้ประเมินให้ซ้ำกันทุกแถว — บอกไว้ในหัวข้อพอ */
    const anyBy = F.guide.items.some(g => g.by);
    /* บางใบครอบคลุมหลายด้าน แต่ละด้านออกใบควบคุมคนละใบ (เช่น Annual Eval)
       ต้องบอกเลขใบที่ได้ ไม่งั้นคนกรอกจะคิดว่าทุกด้านออกใบเดียวกัน */
    const anyF = F.guide.items.some(g => g.f);
    const box = document.getElementById('guide');
    box.className = 'gitems' + (anyBy ? '' : ' nb') + (anyF ? ' wf' : '');
    box.innerHTML = F.guide.items.map(g =>
      `<div class="gitem"><b>${A.esc(g.n)}</b>${
        anyBy ? `<span class="by">${A.esc(g.by || '')}</span>` : ''}
        <span class="w">${A.esc(g.w)}</span>${
        !anyF ? '' : !g.f ? '<span class="gf">\u2014</span>'
          : g.fa && g.fa !== F.abbr
            ? `<a class="gf" href="@@BASE@@f/${A.esc(g.fa)}/">${A.esc(g.f)}</a>`
            : `<span class="gf on">${A.esc(g.f)}</span>`}</div>`).join('');
  }

  const al = [];
  if (F.hasDef === false && F.sys === 'here' && !F.jot && !F.assignTo && !isRef)
    al.push(['warn', A.t('noFields')]);
  if (staff && F.note) al.push([(REG.status[F.st]||{}).lv==='bad'?'stop':'warn', F.note]);
  document.getElementById('alerts').innerHTML = al.map(x =>
    `<div class="fk-gate ${x[0]==='stop'?'stop':'warn'}" style="margin-top:14px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
        stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 9.5v4.5"/>
        <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>${A.esc(x[1])}</span></div>`).join('');

  const rows = [];
  for (const r of REG.roles) if (F.r && F.r[r.k]) rows.push([A.n2(r), F.r[r.k]]);
  if (F.with && F.with.length) rows.push([A.t('withWhom'), F.with.join(' · ')]);
  if (F.assignTo) rows.push([A.t('sendTo'), F.assignTo]);
  rows.push([A.t('chain'), A.L(CHAIN_N[F.chain]) || '—']);
  document.getElementById('who').innerHTML = rows.map(r =>
    `<dt>${A.esc(r[0])}</dt><dd>${A.esc(r[1])}</dd>`).join('');

  if (staff) {
    const st = REG.status[F.st] || {};
    document.getElementById('ctrl').innerHTML = [
      [A.t('colStatus'), A.n2(st) || F.st],
      [A.t('inLef'), F.lef && F.lef.length ? F.lef.join(' · ') : A.t('notInLef')],
      [A.t('srcFile'), F.docx || '—'],
      [A.t('docOwner'), F.own || '—'],
      F.jotDup ? [A.t('jotDup'), F.jotDup] : null,
      F.sysOK ? [A.t('sysOK'), F.sysOK] : null,
    ].filter(Boolean).map(r => `<dt>${A.esc(r[0])}</dt><dd>${A.esc(r[1])}</dd>`).join('');
  }

  /* ลำดับการออกใบ — ใบที่ต้องออกก่อน ใบที่ต้องออกต่อ และเกณฑ์ที่ใบนี้อ้างอิง
     สายงาน (chain) บอกแค่ว่าอยู่หมวดเดียวกัน ไม่ได้บอกว่าอะไรมาก่อนอะไร
     ครูหนึ่งคนเดินผ่าน EFM → STR → PCR → RTR → PCR ซึ่งข้ามสายงาน QA กับ IM */
  const look = a => (REG.forms || []).find(x => x.abbr === a);
  const step = (t, list) => {
    const has = (list || []).map(look).filter(Boolean);
    if (!has.length) return '';
    return `<div class="fstep"><span class="lb">${A.esc(A.t(t))}</span><div class="fs">`
      + has.map(x => `<a href="../${A.esc(x.abbr)}/">${A.esc(A.nm(x))}
           <em>${A.esc(x.abbr)}</em></a>`).join('') + '</div></div>';
  };
  const flow = step('flowPrev', F.prev) + step('flowNext', F.next) + step('flowRefs', F.refs);
  if (flow) {
    document.getElementById('flowwrap').style.display = '';
    document.getElementById('flowsteps').innerHTML = flow;
    document.getElementById('flowdesc').textContent = F.flow ? A.L(F.flow) : '';
  }

  const rel = (A.isStaff() ? REG.forms : REG.forms.filter(f=>f.public))
    .filter(f => f.chain === F.chain && f.abbr !== F.abbr).slice(0, 6);
  if (rel.length) {
    document.getElementById('relwrap').style.display = '';
    document.getElementById('rel').innerHTML = rel.map(f => A.card(REG, f)).join('');
  }
}
</script>
</body></html>
