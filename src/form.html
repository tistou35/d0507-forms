<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@@FTITLE@@ — D-0507 Flight Training</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="@@BASE@@assets/app.css">
<style>
/* ตารางบันทึกที่ส่งเข้ามาของใบนี้ — กดแถวเพื่อเปิดดูรายละเอียด */
#recs .rbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
#recs .rbar input{flex:1;min-width:180px;min-height:38px;padding:0 11px;border-radius:8px;
  border:1px solid var(--border-med);background:var(--surface);color:var(--fg-1);font-family:inherit;font-size:13.5px}
#recs .chip{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--border-med);
  background:var(--surface);cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--fg-2)}
#recs .chip[aria-pressed="true"]{background:var(--navy-900);border-color:var(--navy-900);color:#fff}
#recs .twrap{overflow-x:auto;border:1px solid var(--border-light);border-radius:10px}
#recs table{width:100%;border-collapse:collapse;font-size:13.5px}
#recs th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--g-500);
  padding:9px 12px;border-bottom:1px solid var(--border-light);white-space:nowrap;background:var(--g-50)}
#recs td{padding:9px 12px;border-bottom:1px solid var(--g-100);vertical-align:top}
#recs tbody tr{cursor:pointer}
#recs tbody tr:hover,#recs tbody tr:focus{background:var(--sky-100);outline:none}
#recs tr:last-child td{border-bottom:0}
#recs .mono{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
#recs .st{display:inline-flex;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
#recs .st.wait{background:var(--amber-100);color:var(--amber-600)}
#recs .st.ok{background:var(--green-100);color:var(--green-600)}
#recs .st.no{background:var(--red-100);color:var(--red-600)}
#recs .who{display:block;font-size:11.5px;color:var(--g-500);margin-top:3px}
#recs .go{color:var(--sky-600);white-space:nowrap}
#recs .empty{padding:14px;border:1px dashed var(--border-med);border-radius:10px;color:var(--g-500);font-size:13.5px}
@media(max-width:640px){ #recs .hide-s{display:none} }
</style>
</head><body>
@@TOPBAR@@
<div class="body">
@@RAIL@@
  <main class="main">
    <p class="eyebrow" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky-500)">
      <a href="@@BASE@@all/" style="color:inherit;text-decoration:none" data-t="allForms">คลังฟอร์ม</a> ·
      <span id="chain"></span></p>

    <div class="fhero">
      <div class="band">
        <p class="o" id="org">D-0507 Flight Training Co., Ltd.</p>
        <h1 id="th"></h1>
        <p class="en" id="en"></p>
      </div>
      <div class="grid" id="meta"></div>
    </div>

    <div class="acts" id="acts"></div>
    <div id="revban"></div>
    <div id="alerts"></div>

    <div class="card" id="recs" style="display:none">
      <h3 data-t="recsTitle">บันทึกที่ส่งเข้ามา</h3>
      <p class="hint" id="recsSub" style="margin:2px 0 10px"></p>
      <div id="recsBody"></div>
    </div>

    <div class="card" id="guidewrap" style="display:none">
      <h3 id="guidehd"></h3>
      <div class="gitems" id="guide"></div>
    </div>

    <div class="card">
      <h3 data-t="whenWho">ฟอร์มนี้ใช้เมื่อไร · ใครเกี่ยวข้อง</h3>
      <dl class="kv" id="who"></dl>
    </div>

    <div class="card staffonly hide">
      <h3 data-t="ctrlStatus">สถานะเอกสารควบคุม</h3>
      <dl class="kv" id="ctrl"></dl>
    </div>

    <div class="card" id="flowwrap" style="display:none">
      <h3 data-t="flowTitle">ลำดับการออกใบ</h3>
      <p class="hint" id="flowdesc" style="margin:3px 0 0"></p>
      <div class="flowsteps" id="flowsteps"></div>
    </div>

    <div class="card" id="relwrap" style="display:none">
      <h3 data-t="related">ฟอร์มที่เกี่ยวข้องในสายงานเดียวกัน</h3>
      <div class="forms" id="rel" style="margin-top:4px"></div>
    </div>
  </main>
</div>
@@BOTNAV@@
<footer>D-0507 Flight Training Co., Ltd. · Controlled Document System</footer>
<script>window.BASE='@@BASE@@';</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="@@BASE@@assets/app.js"></script>
<script>D0507.GAS_URL='@@GASURL@@';</script>
<script>
"use strict";
const REG = @@REG@@;
const F   = @@FORM@@;
const A   = D0507;
const CHAIN_N = {
  preflight:{th:'ก่อนทำการบิน',en:'Pre-flight'}, training:{th:'บันทึกการฝึก',en:'Training records'},
  safety:{th:'นิรภัย / SMS',en:'Safety / SMS'}, maint:{th:'ช่างอากาศยาน',en:'Maintenance'},
  standardisation:{th:'มาตรฐานครูการบิน',en:'Instructor standardisation'},
  doccontrol:{th:'ควบคุมเอกสาร',en:'Document control'}, admin:{th:'ธุรการ / บุคคล',en:'Admin / HR'},
  audit:{th:'งานตรวจสอบ',en:'Audit'}, ops:{th:'ปฏิบัติการบิน',en:'Flight operations'}};

document.querySelectorAll('[data-cnt="forms"]').forEach(e=>e.textContent=REG.lefcount.total||'');
document.getElementById('th').textContent = A.nm(F);
document.getElementById('en').textContent = F.t;

A.reg = REG;
/* เมื่อ login แล้ว A.hydrate() จะดึงทะเบียนเต็มมาใส่ A.reg — เอารายละเอียดควบคุมของฟอร์มนี้มาเติม */
/* สเปกตารางบันทึกจากตอน build — เก็บไว้ก่อน hydrate เพราะทะเบียนใน Firestore
   เก็บ records แบบดิบ (คอลัมน์เป็นแค่ชื่อช่อง ไม่มีป้าย) ถ้าถูกทับ ตารางจะไม่มีหัว */
const REC = F.records || null;
A.initAuth(@@FBCFG@@, () => {
  const full = (A.reg.forms || []).find(x => x.abbr === F.abbr);
  if (full) Object.assign(F, full);
  RECS = null;
  paint();
  loadRecords();
});
paint();
// เปลี่ยนภาษาแล้ววาดใหม่ทั้งหน้า
A.onLang.push(() => paint());

/* ฉบับร่างที่ค้างของเอกสารนี้ — ให้เจ้าหน้าที่เห็นจากหน้าเอกสารเลย ไม่ต้องกดแก้ต้นฉบับก่อนถึงรู้
   ฉบับที่ใช้อยู่ (ปุ่มฟอร์มเปล่า / เปิด) ยังเป็นฉบับเดิมจนกว่าจะปิดงานในทะเบียน */
async function revBanner(){
  const el = document.getElementById('revban');
  if (!el || !A.isStaff() || !F || !F.doc) return;
  const r = await A.openRevision(F.doc);
  if (!r) { el.innerHTML = ''; return; }
  const url = 'https://docs.google.com/document/d/' + r.draftId + '/edit';
  el.innerHTML = `<div class="fk-gate warn" style="margin:12px 0"><span>
    <b>${A.esc(A.L(A.REV_STATE[r.state]))}</b> · Issue ${A.esc(r.newIss)} / Rev ${A.esc(r.newRev)}${
      r.newCode ? ' · ' + A.esc(r.newCode) : ''}${r.tracking ? ' · DRF <span class="mono">' + A.esc(r.tracking) + '</span>' : ''}<br>
    ${A.esc(A.L({th:'ฟอร์มเปล่าและปุ่มเปิดยังเป็นฉบับที่ใช้อยู่ ',en:'The blank form and Open still show the current edition. '}))}
    <a href="${A.esc(url)}" target="_blank" rel="noopener">${A.esc(A.L({th:'เปิดฉบับร่าง',en:'Open draft'}))} ↗</a></span></div>`;
}

/* ── บันทึกที่ส่งเข้ามาของใบนี้ ─────────────────────────────
   ใครเห็นกำหนดที่ records ในทะเบียน (บทบาทหรือตำแหน่ง) ผู้ดูแลระบบเห็นทุกใบ
   ก่อนมีตารางนี้ ใบที่ส่งเข้ามาเปิดดูได้แค่สองทาง — ผู้ส่งดูของตัวเอง และผู้ดูแลระบบ
   ครูการบินที่ต้องรู้ว่านักเรียนคนไหนได้รับอนุญาตบินเดี่ยวแล้ว จึงไม่มีทางรู้เลย */
let RECS = null, RTASK = {}, RQ = '', RST = 'all', RALL = false;
const RST_N = { all:{th:'ทั้งหมด',en:'All'}, wait:{th:'รออนุมัติ',en:'Pending'},
                ok:{th:'เสร็จแล้ว',en:'Completed'}, no:{th:'ไม่อนุมัติ',en:'Rejected'} };
function recState(r){
  if (r.adminAction === 'close') return { k:'ok', n:{th:'ปิดโดยผู้ดูแล',en:'Closed by admin'} };
  if (r.status === 'complete') return { k:'ok', n:(r.step||1) > 1 ? {th:'อนุมัติแล้ว',en:'Approved'} : {th:'ส่งแล้ว',en:'Submitted'} };
  if (r.status === 'rejected') return { k:'no', n:{th:'ไม่อนุมัติ',en:'Rejected'} };
  return { k:'wait', n:{th:'รออนุมัติ',en:'Pending'} };
}
function recVal(c, v){
  if (v === undefined || v === null || v === '') return '';
  if (c.opt && c.opt[String(v)]) return A.L(c.opt[String(v)]) || String(v);
  if (c.type === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
    const d = new Date(v + 'T00:00:00');
    return d.toLocaleDateString(A.lang === 'en' ? 'en-GB' : 'th-TH', {day:'2-digit',month:'short',year:'numeric'});
  }
  return String(v);
}
const recMs = v => { try { return v && v.toMillis ? v.toMillis() : (v ? new Date(v).getTime() : 0); } catch (e) { return 0; } };
async function loadRecords(){
  const box = document.getElementById('recs');
  if (!REC || !A.canSeeRecords(REC)) { box.style.display = 'none'; return; }
  box.style.display = '';
  document.getElementById('recsBody').innerHTML = `<div class="empty">${A.esc(A.L({th:'กำลังโหลด…',en:'Loading…'}))}</div>`;
  try {
    // เทียบเท่ากันช่องเดียว ไม่ต้องทำ index ผสม — เรียงในเครื่องเอง
    const [s, t] = await Promise.all([
      A.db.collection('submissions').where('formCode', '==', F.abbr).get(),
      A.db.collection('tasks').where('formCode', '==', F.abbr).get(),
    ]);
    RECS = s.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a, b) => recMs(b.submittedAt) - recMs(a.submittedAt));
    RTASK = {};
    t.docs.forEach(d => { const v = d.data();
      if (v.state === 'open' || v.state === 'pool') RTASK[v.subId] = v; });
  } catch (e) {
    document.getElementById('recsBody').innerHTML = `<div class="empty">${
      A.esc(A.L({th:'อ่านบันทึกไม่ได้: ',en:'Cannot read records: '}))}${A.esc(e.code || e.message)}</div>`;
    return;
  }
  paintRecords();
}
function paintRecords(){
  const box = document.getElementById('recs');
  if (!REC || !RECS || box.style.display === 'none') return;
  const esc = A.esc, cols = REC.cols || [];
  const n = { all: RECS.length };
  RECS.forEach(r => { const k = recState(r).k; n[k] = (n[k] || 0) + 1; });
  document.getElementById('recsSub').textContent = A.L({
    th: 'ใบที่ส่งเข้ามาแล้วทั้งหมด ' + RECS.length + ' ใบ · กดแถวเพื่อเปิดดูรายละเอียดและพิมพ์',
    en: RECS.length + ' submitted record(s) · click a row to open, view and print' });
  const q = RQ.trim().toLowerCase();
  const rows = RECS.filter(r => {
    if (RST !== 'all' && recState(r).k !== RST) return false;
    if (!q) return true;
    const d = r.data || {};
    return [r.tracking, r.submitterName].concat(cols.map(c => recVal(c, c.computed ? (r.computed || {})[c.k] : d[c.k])))
      .join(' ').toLowerCase().indexOf(q) >= 0;
  });
  const shown = RALL ? rows : rows.slice(0, 30);
  const bar = `<div class="rbar">
      <input type="search" id="rq" value="${esc(RQ)}" placeholder="${esc(A.L({th:'ค้นหาชื่อ ทะเบียน เลขที่ใบ',en:'Search name, registration, tracking'}))}">
      ${['all','wait','ok','no'].filter(k => k === 'all' || n[k]).map(k =>
        `<button type="button" class="chip" data-rst="${k}" aria-pressed="${RST === k}">${esc(A.L(RST_N[k]))} ${n[k] || 0}</button>`).join('')}
    </div>`;
  const table = !rows.length
    ? `<div class="empty">${esc(A.L(RECS.length ? {th:'ไม่มีใบที่ตรงกับที่ค้นหา',en:'No records match'}
                                             : {th:'ยังไม่มีใบที่ส่งเข้ามา',en:'No records yet'}))}</div>`
    : `<div class="twrap"><table><thead><tr>
        <th>${esc(A.L({th:'ส่งเมื่อ',en:'Submitted'}))}</th>
        ${cols.map((c, i) => `<th${i > 1 && i < cols.length - 1 ? ' class="hide-s"' : ''}>${esc(A.L(c.label) || c.k)}</th>`).join('')}
        <th>${esc(A.L({th:'สถานะ',en:'Status'}))}</th><th></th></tr></thead><tbody>${
        shown.map(r => {
          const st = recState(r), d = r.data || {}, tk = RTASK[r.id];
          const who = st.k !== 'wait' ? '' : tk
            ? (tk.state === 'open' ? (tk.assigneeName || '') : A.L({th:'กองรอ ',en:'Pool '}) + (tk.pool || ''))
            : A.L({th:'ยังไม่มีผู้รับ',en:'No one assigned'});
          return `<tr tabindex="0" data-open="${esc(r.id)}">
            <td class="mono">${esc(new Date(recMs(r.submittedAt)).toLocaleDateString(A.lang === 'en' ? 'en-GB' : 'th-TH',
                {day:'2-digit',month:'short',year:'2-digit'}))}</td>
            ${cols.map((c, i) => `<td${i > 1 && i < cols.length - 1 ? ' class="hide-s"' : ''}>${esc(recVal(c, c.computed ? (r.computed || {})[c.k] : d[c.k]))}</td>`).join('')}
            <td><span class="st ${st.k}">${esc(A.L(st.n))}</span>${who ? `<span class="who">${esc(who)}</span>` : ''}</td>
            <td class="go">${esc(A.L({th:'เปิด',en:'Open'}))} →</td></tr>`;
        }).join('')}</tbody></table></div>
      ${rows.length > shown.length ? `<div class="acts" style="margin-top:10px"><button class="fb" id="rall">${
        esc(A.L({th:'แสดงทั้งหมด ' + rows.length + ' ใบ',en:'Show all ' + rows.length}))}</button></div>` : ''}`;
  document.getElementById('recsBody').innerHTML = bar + table;
  const qi = document.getElementById('rq');
  qi.addEventListener('input', () => { RQ = qi.value; const pos = qi.selectionStart; paintRecords();
    const q2 = document.getElementById('rq'); q2.focus(); q2.setSelectionRange(pos, pos); });
  document.querySelectorAll('#recs [data-rst]').forEach(b => b.addEventListener('click', () => { RST = b.dataset.rst; paintRecords(); }));
  const ra = document.getElementById('rall'); if (ra) ra.addEventListener('click', () => { RALL = true; paintRecords(); });
  const open = id => { location.href = '@@BASE@@view/?id=' + encodeURIComponent(id); };
  document.querySelectorAll('#recs [data-open]').forEach(tr => {
    tr.addEventListener('click', () => open(tr.dataset.open));
    tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(tr.dataset.open); });
  });
}

function paint(){
  const staff = A.isStaff();
  document.getElementById('chain').textContent = A.L(CHAIN_N[F.chain]) || '—';
  const s = A.sysOf(REG, F);

  document.getElementById('meta').innerHTML = [
    [A.t('docCode'), F.doc || '—'],
    [A.t('ctrlCode'), staff ? (F.code || '—') : null],
    [A.t('issueRev'), F.iss ? F.iss + ' / ' + F.rev : '—'],
    [A.t('effective'), F.eff || '—'],
    [A.t('inSystem'), A.n2(s)],
  ].filter(x => x[1] !== null).map(x =>
    `<div><span>${A.esc(x[0])}</span><b>${A.esc(x[1])}</b></div>`).join('');

  /* เอกสารอ้างอิงไม่ใช่ใบกรอก — ทะเบียนคุมมันเหมือนกันเพราะมันคือเอกสารควบคุม
     แต่หน้าเว็บต้องไม่บอกว่า "ยังไม่มีฟอร์มออนไลน์" ราวกับรอใครมาทำให้
     เกณฑ์การให้คะแนนจะไม่มีวันมีช่องกรอก การรอนั้นไม่มีวันจบ */
  const isRef = F.kind === 'ref';
  const t = isRef ? null : A.target(REG, F);
  const openDoc = A.L(isRef ? {th:'เปิดเอกสาร',en:'Open document'}
                            : {th:'ฟอร์มเปล่า (PDF)',en:'Blank form (PDF)'});
  document.getElementById('acts').innerHTML =
    (t ? `<a class="big pri" href="${A.esc(t.url)}"${t.ext?' target="_blank" rel="noopener"':''}>${A.esc(t.label)}${t.ext?' ↗':''}</a>` :
     isRef ? '' : `<span class="big off">${A.esc(A.t('noOnline'))}</span>`) +
    /* ฟอร์มที่ย้ายไปทำในระบบอื่นแล้ว คนยังต้องเห็นหน้าตาเอกสารได้
       ไม่งั้นต้องไปรื้อไฟล์ .docx เอง ซึ่งคนทั่วไปเปิดไม่ได้
       download ให้ชื่อไฟล์เป็นเลขเอกสาร ไม่ใช่ตัวย่อ — คนดาวน์โหลดไปเก็บ
       ต้องรู้ว่าเป็นเอกสารอะไรจากชื่อไฟล์โดยไม่ต้องเปิด */
    (F.blank ? `<a class="big ${isRef?'pri':'sec'}" href="@@BASE@@${A.esc(F.blank)}"
        download="${A.esc((F.doc||F.abbr)+'.pdf')}" target="_blank" rel="noopener">${
        A.esc(openDoc)} ↓</a>` : '') +
    /* แม่แบบ Google Doc — ตัวที่ระบบเอาไปเติมคำตอบแล้วออกเป็น PDF
       เป็นของเจ้าหน้าที่เท่านั้น เปิดได้เฉพาะคนที่มีสิทธิ์ใน Drive อยู่แล้ว
       คนนอกเห็นลิงก์ไปก็เปิดไม่ได้ แต่ไม่ควรเห็นตั้งแต่แรก */
    (staff && F.tpl ? `<a class="big sec" href="https://docs.google.com/document/d/${
        A.esc(F.tpl)}/edit" target="_blank" rel="noopener">${
        A.esc(A.L({th:'แม่แบบ Google Doc',en:'Google Doc template'}))} ↗</a>` : '') +
    /* ต้นฉบับที่แก้ไขได้ — คนละอย่างกับ tpl
       tpl  = แม่แบบที่ระบบเติมคำตอบลงไปแล้วออก PDF (มี {{token}})
       edit = ตัวเอกสารเองบน Google Docs สำหรับแก้เนื้อหา
       เอกสารอ้างอิงอย่าง ECA ไม่มี tpl เพราะไม่มีช่องให้เติม แต่ยังต้องแก้ได้
       ปุ่มนี้ใช้ชื่อและความหมายเดียวกับในหน้าเช็กลิสต์ จะได้ไม่ต้องเรียนรู้ใหม่ */
    /* ผังงาน — ใครทำอะไร ส่งต่อถึงใคร กี่วัน ไม่ผ่านไปไหน
       เปิดให้ทุกคนดู ไม่ใช่แค่เจ้าหน้าที่ คนกรอกควรรู้ว่าใบที่ส่งไปจะไปถึงใคร */
    `<a class="big sec" href="@@BASE@@flow/?c=${encodeURIComponent(F.abbr)}">${
        A.esc(A.L({th:'ผังงาน',en:'Workflow'}))}</a>` +
    /* ใบที่กรอกได้โดยไม่ต้องเข้าสู่ระบบ (ธง anon ในทะเบียน — PWR ผู้โดยสาร · VSR ผู้รายงาน)
       คนที่ต้องกรอกไม่ได้อยู่ในระบบ จึงต้องส่งลิงก์ให้เขา ไม่ใช่บอกให้เข้าเว็บมาหาเอง */
    /* ใบที่มีหน้าจัดการของตัวเอง (DRC) ไม่ขึ้นปุ่มนี้ — ลิงก์ของมันต้องพ่วงเลขประกาศ
       ลิงก์เปล่าจะกรอกได้แต่ส่งไม่ผ่าน เพราะกติกาบังคับว่าต้องอ้างประกาศที่มีอยู่จริง */
    (F.anon && t && !F.admin ? `<button type="button" class="big sec" id="sharelink">${
        A.esc(A.L({th:'ส่งลิงก์ให้กรอก',en:'Share fill link'}))} ↗</button>` : '') +
    /* ไม่ลิงก์ตรงไป Google Docs — ถามก่อนว่าแก้เล็กน้อยในฉบับเดิม หรือออกฉบับใหม่
       ผ่าน DRF (ดู A.editSource ใน app.js) */
    (A.isAdmin() && F.edit ? `<button type="button" class="big sec" id="editsrc"
        title="แก้เล็กน้อยในฉบับเดิม หรือแก้ในฉบับร่างเพื่อออก Revision / Issue ใหม่"
        >${A.esc(A.L({th:'แก้ต้นฉบับ',en:'Edit source'}))} ✎</button>` : '') +
    /* ใบที่มีหน้าจัดการของตัวเอง (ตอนนี้มี DRC — เตรียมรายการแล้วสร้างลิงก์ให้ผู้รับ)
       ที่อยู่มาจากทะเบียน ไม่ได้ฝังตัวย่อไว้ในหน้านี้ ใบต่อไปที่ต้องมีหน้าจัดการ
       จึงเพิ่มได้ที่ทะเบียนอย่างเดียว */
    (staff && F.admin ? `<a class="big sec" href="@@BASE@@${A.esc(F.admin.url)}">${
        A.esc(A.L(F.admin.n))}</a>` : '') +
    `<a class="big sec" href="@@BASE@@all/">${A.esc(A.t('backToAll'))}</a>`;
  const sb = document.getElementById('sharelink');
  if (sb) sb.onclick = () => A.shareForm(F, t && !t.ext ? t.url : null);
  const eb = document.getElementById('editsrc');
  if (eb) eb.onclick = () => A.editSource({ abbr: F.abbr, doc: F.doc, title: F.t || F.th,
    code: F.code, iss: F.iss, rev: F.rev, edit: F.edit });
  revBanner();

  /* ขอบเขตการประเมิน — ใช้กับฟอร์มที่ตัวเอกสารอยู่ที่นี่เพื่อควบคุม
     แต่การกรอกจริงไปทำที่ระบบอื่น หน้านี้จึงต้องบอกให้ชัดว่าครอบคลุมอะไรและใครเป็นผู้ประเมิน */
  if (F.guide && (F.guide.items || []).length) {
    document.getElementById('guidewrap').style.display = '';
    document.getElementById('guidehd').textContent = A.L(F.guide);
    /* ฟอร์มที่ผู้ประเมินเป็นคนเดียวกันทุกหัวข้อ (เช่น SEF นักเรียนประเมินทั้งใบ)
       ไม่ต้องมีคอลัมน์ผู้ประเมินให้ซ้ำกันทุกแถว — บอกไว้ในหัวข้อพอ */
    const anyBy = F.guide.items.some(g => g.by);
    /* บางใบครอบคลุมหลายด้าน แต่ละด้านออกใบควบคุมคนละใบ (เช่น Annual Eval)
       ต้องบอกเลขใบที่ได้ ไม่งั้นคนกรอกจะคิดว่าทุกด้านออกใบเดียวกัน */
    const anyF = F.guide.items.some(g => g.f);
    const box = document.getElementById('guide');
    box.className = 'gitems' + (anyBy ? '' : ' nb') + (anyF ? ' wf' : '');
    box.innerHTML = F.guide.items.map(g =>
      `<div class="gitem"><b>${A.esc(g.n)}</b>${
        anyBy ? `<span class="by">${A.esc(g.by || '')}</span>` : ''}
        <span class="w">${A.esc(g.w)}</span>${
        !anyF ? '' : !g.f ? '<span class="gf">\u2014</span>'
          : g.fa && g.fa !== F.abbr
            ? `<a class="gf" href="@@BASE@@f/${A.esc(g.fa)}/">${A.esc(g.f)}</a>`
            : `<span class="gf on">${A.esc(g.f)}</span>`}</div>`).join('');
  }

  const al = [];
  if (F.hasDef === false && F.sys === 'here' && !F.jot && !F.assignTo && !isRef)
    al.push(['warn', A.t('noFields')]);
  if (staff && F.note) al.push([(REG.status[F.st]||{}).lv==='bad'?'stop':'warn', F.note]);
  document.getElementById('alerts').innerHTML = al.map(x =>
    `<div class="fk-gate ${x[0]==='stop'?'stop':'warn'}" style="margin-top:14px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
        stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 9.5v4.5"/>
        <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>${A.esc(x[1])}</span></div>`).join('');

  const rows = [];
  for (const r of REG.roles) if (F.r && F.r[r.k]) rows.push([A.n2(r), F.r[r.k]]);
  if (F.with && F.with.length) rows.push([A.t('withWhom'), F.with.join(' · ')]);
  if (F.assignTo) rows.push([A.t('sendTo'), F.assignTo]);
  rows.push([A.t('chain'), A.L(CHAIN_N[F.chain]) || '—']);
  document.getElementById('who').innerHTML = rows.map(r =>
    `<dt>${A.esc(r[0])}</dt><dd>${A.esc(r[1])}</dd>`).join('');

  if (staff) {
    const st = REG.status[F.st] || {};
    document.getElementById('ctrl').innerHTML = [
      [A.t('colStatus'), A.n2(st) || F.st],
      [A.t('inLef'), F.lef && F.lef.length ? F.lef.join(' · ') : A.t('notInLef')],
      [A.t('srcFile'), F.docx || '—'],
      [A.t('docOwner'), F.own || '—'],
      F.jotDup ? [A.t('jotDup'), F.jotDup] : null,
      F.sysOK ? [A.t('sysOK'), F.sysOK] : null,
    ].filter(Boolean).map(r => `<dt>${A.esc(r[0])}</dt><dd>${A.esc(r[1])}</dd>`).join('');
  }

  /* ลำดับการออกใบ — ใบที่ต้องออกก่อน ใบที่ต้องออกต่อ และเกณฑ์ที่ใบนี้อ้างอิง
     สายงาน (chain) บอกแค่ว่าอยู่หมวดเดียวกัน ไม่ได้บอกว่าอะไรมาก่อนอะไร
     ครูหนึ่งคนเดินผ่าน EFM → STR → PCR → RTR → PCR ซึ่งข้ามสายงาน QA กับ IM */
  const look = a => (REG.forms || []).find(x => x.abbr === a);
  const step = (t, list) => {
    const has = (list || []).map(look).filter(Boolean);
    if (!has.length) return '';
    return `<div class="fstep"><span class="lb">${A.esc(A.t(t))}</span><div class="fs">`
      + has.map(x => `<a href="../${A.esc(x.abbr)}/">${A.esc(A.nm(x))}
           <em>${A.esc(x.abbr)}</em></a>`).join('') + '</div></div>';
  };
  const flow = step('flowPrev', F.prev) + step('flowNext', F.next) + step('flowRefs', F.refs);
  if (flow) {
    document.getElementById('flowwrap').style.display = '';
    document.getElementById('flowsteps').innerHTML = flow;
    document.getElementById('flowdesc').textContent = F.flow ? A.L(F.flow) : '';
  }

  const rel = (A.isStaff() ? REG.forms : REG.forms.filter(f=>f.public))
    .filter(f => f.chain === F.chain && f.abbr !== F.abbr).slice(0, 6);
  if (rel.length) {
    document.getElementById('relwrap').style.display = '';
    document.getElementById('rel').innerHTML = rel.map(f => A.card(REG, f)).join('');
  }
}
</script>
</body></html>
