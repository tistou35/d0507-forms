const code=new URLSearchParams(location.search).get('c')||'';

/* ขั้นอนุมัติถัดไปที่ใช้จริงตามคำตอบปัจจุบัน (undefined = จบที่ผู้กรอก) */
function nextStep(){
  if(!FK) return null;
  const ctx=FK.ctx();
  return (DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx))[1] || null;
}
function needsApproval(){ return !!nextStep(); }

   assignedBy 'submitter' = ผู้ส่งเลือกเอง (FRAE — นักเรียนเลือกครู)
   assignedBy 'later'     = ส่งไปก่อน ระบบจับคู่ทีหลัง (SDF — เข้ากองรอผู้มีสิทธิ์รับ) */
/* กติกาอนุมัติมาจาก config/approvals (admin ตั้ง) ตกกลับไปใช้ค่าในนิยามฟอร์มถ้ายังไม่ได้ตั้ง */
function approval(){ return A.approvalOf(F.abbr, DEF, F); }
function pickAtSend(){ return !!nextStep() && approval().mode==='pick'; }

/* รายชื่อครูที่รับฟอร์มประเภทนี้ — อ่านได้ทั้งโลก มีแค่ชื่อกับตำแหน่ง ไม่มีอีเมล */
async function loadDir(){
  try{
    await A.loadApprovals();
    const d=await A.db.collection('publicDirectory').doc('instructors').get();
    const want=approval().position || F.assignTo;
    DIR=((d.exists&&d.data().list)||[]).filter(x=>!want||(x.recv||[]).includes(want));
  }catch(e){ DIR=[]; }
}

/* หน้านี้เป็นการ "เริ่มใบใหม่" เสมอ — คนที่กดกรอกคือผู้เริ่ม

   เดิมจับคู่ตามบทบาทตรงนี้ ทำให้คนที่มีบทบาทครูถูกจัดเป็นฝ่ายครูทันที

   ซึ่งเป็นคนละหน้ากัน (คิวงาน) ไม่ใช่ตอนเริ่มใบใหม่ */
function partyOf(){
  if(!DEF) return null;
  const first=(DEF.route||[])[0];
  return (first&&first.party) || (DEF.parties&&DEF.parties[0]||{}).k;
}
function renderFoot(){
  if(!FK) return;
  const miss=FK.validate(), stop=FK.blocked();
  document.getElementById('foot').innerHTML=`
    ${miss.length?`<div class="warn" style="margin-bottom:14px">${A.esc(A.t('incomplete'))}:
      ${A.esc(miss.map(m=>m.label).join(' · '))}</div>`:''}
    <div class="acts"><button class="big ${miss.length||stop?'off':'pri'}"
      ${miss.length||stop?'disabled':''} id="send">${A.esc(A.t('send'))}</button>
      <a class="big sec" href="${A.formUrl(F)}">${A.esc(A.t('cancel'))}</a></div>`;
  const b=document.getElementById('send');
  if(b && !b.disabled) b.addEventListener('click', e=>{ e.preventDefault(); review(); });
}

const LL=(o)=>FormKit.L(o,A.lang);

/* หัวสรุป — ฟอร์มที่มีคะแนนรวมใช้ score · ฟอร์มอื่นใช้ ui.headline (SDF ใช้ชั่วโมง FTL)
   ก่อนหน้านี้โชว์ "0 คะแนนความเสี่ยงรวม" กับฟอร์มที่ไม่มีคะแนน ซึ่งอ่านแล้วเข้าใจผิด */
function headBox(c,next){
  const hl=DEF.ui&&DEF.ui.headline;
  const big=hl ? (c[hl.value]===undefined?0:c[hl.value]) : c.score;
  const lab=hl ? FormKit.L(hl,A.lang)+' · '+A.t('limit')+' '+hl.of
               : FormKit.L({th:'คะแนนความเสี่ยงรวม',en:'Total risk score'},A.lang);
  return `<div class="fk-score ${FK.band().lv}"><span class="n">${A.esc(String(big))}</span>
    <span><b style="font-size:14.5px">${A.esc(lab)}</b><br>
    <span style="font-size:12.5px;color:var(--g-500)">${A.esc(next)}</span></span></div>`;
}

function shown(v,f){
  if(v===undefined||v===null||v==='') return '—';
  if(typeof v==='boolean') return v?'✓':'—';
  if(Array.isArray(v)) return v.join(' · ');
  if(typeof v==='string'&&v.indexOf('data:image')===0) return '✓ '+A.t('signed');
  if(f&&f.opt){ const o=f.opt.find(x=>String(x.v)===String(v)); if(o) return LL(o.n)||o.v; }
  if(f&&f.type==='date') return A.esc(v).split('-').reverse().join('/');
  return String(v);
}

function review(){
  const ctx=FK.ctx(), c=FK.computed(), gates=FK.gates();
  const me=partyOf();
  const rows=(DEF.sections||[])
    .filter(s=>FormKit.evalCond(s.showIf,ctx))
    // ส่วนที่ซ่อนจากฝ่ายอื่นก็ต้องไม่โผล่ในหน้าตรวจทานด้วย
    .filter(s=>!(s.hideOthers && me && s.party!==me))
    .map(sec=>{
    const fs=(sec.fields||[]).filter(f=>f.type!=='static'&&FormKit.evalCond(f.showIf,ctx));
    if(!fs.length) return '';
    // ช่องติ๊กแสดงเฉพาะข้อที่ติ๊ก แล้วสรุปจำนวนไว้ท้าย — ถ้าโชว์ '—' ครบทุกข้อ
    // ข้อที่ติ๊กจริงจะจมหายไปในแถวว่าง 36 แถว
    const box=fs.filter(f=>f.type==='check');
    const on=box.filter(f=>FK.data[f.k]);
    const rest=fs.filter(f=>f.type!=='check');
    const line=f=>`<div class="rvr"><span>${A.esc(LL(f.label))}</span>
        <b>${A.esc(shown(FK.data[f.k],f))}</b></div>`;
    return `<h4 class="rvh">${A.esc(LL(sec.title))}</h4>`
      + rest.map(line).join('') + on.map(line).join('')
      + (box.length?`<div class="rvr"><span>${A.esc(A.t('ticked'))}</span>
          <b>${on.length} / ${box.length}</b></div>`:'');
  }).join('');

  const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
  const st1=nextStep();
  const nx=(DEF.parties||[]).find(p=>p.k===(st1||{}).party);
  const next=!st1 ? A.t('endsHere')
    : st1.assignedBy==='submitter' ? A.t('goesToApproval')+' — '+(LL(nx&&nx.n)||st1.party)
    : A.t('goesToPool')+' — '+(LL(nx&&nx.n)||st1.party);

  // ผู้ที่ไม่ได้ล็อกอินปิดใบเองไม่ได้ — ใบต้องมีคนรับผิดชอบเสมอ
  const anon=!A.isStaff(), needs=needsApproval(), mustPick=pickAtSend();
  if(anon && !needs){
    modal(A.t('needLoginTitle'), A.t('needLoginSub'),
      `<p class="fk-static">${A.esc(A.t('needLoginBody'))}</p>`,
      `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
       <a class="big pri" href="../staff-login/">${A.esc(A.t('signIn'))}</a>`);
    return;
  }
  const picker = mustPick ? (DIR.length
    ? `<h4 class="rvh">${A.esc(A.t('sendToWho'))}</h4>
       <p class="hint" style="margin-bottom:8px">${A.esc(A.t('sendToWhoHint'))}</p>
       <div class="fk-opts" id="pick">`+DIR.map(x=>
         `<button type="button" class="fk-opt" data-uid="${A.esc(x.id)}"
            aria-pressed="${PICK===x.id}">${A.esc(x.name)}${x.cert?`<em style="font-style:normal;
            color:var(--g-500);font-size:11.5px;margin-left:7px">${A.esc(x.cert)}</em>`:''}</button>`).join('')+`</div>`
    : `<div class="fk-gate warn"><span>${A.esc(A.t('noRecipient'))}</span></div>`) : '';

  modal(A.t('reviewTitle'), A.t('reviewSub'),
    (gates.length?gates.map(g=>`<div class="fk-gate ${A.esc(g.level)}" style="margin-bottom:10px">
       <span>${A.esc(LL(g.msg))}</span></div>`).join(''):'')+
    headBox(c,next)+picker+rows,
    `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
     <button class="big pri" id="ok" value="ok">${A.esc(A.t('confirmSend'))}</button>`);
  const okb=document.getElementById('ok');
  const sync=()=>{ okb.disabled = mustPick && !PICK; okb.classList.toggle('off', okb.disabled); };
  document.querySelectorAll('#pick .fk-opt').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault(); PICK=b.dataset.uid;
    document.querySelectorAll('#pick .fk-opt').forEach(x=>x.setAttribute('aria-pressed', x===b));
    sync();
  }));
  sync();
  okb.addEventListener('click', e=>{ e.preventDefault(); if(okb.disabled) return; dlg.close(); send(); });
}

/* ── ส่งจริง ───────────────────────────────────────────────
   เขียนลง Firestore ก่อนเสมอ นั่นคือหลักฐานว่าส่งแล้ว
   ส่วนการทำ PDF/ชีต เป็นขั้นตามหลัง ล้มได้โดยไม่ทำให้ใบหาย */
async function send(){
  const foot=document.getElementById('foot');
  foot.innerHTML=`<div class="note">${A.esc(A.t('sending'))}</div>`;
  try{
    if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const u=firebase.auth().currentUser;
    const ref=A.db.collection('submissions').doc();
    const d=new Date(), p2=n=>String(n).padStart(2,'0');
    const trk=`${F.abbr}-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${ref.id.slice(0,4).toUpperCase()}`;
    const ctx=FK.ctx();
    const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
    const done=steps.length<=1;
    const st=steps[1]||null;

    // ลำดับคีย์และ status ต้องผ่าน newSubmissionOk() ใน firestore.rules
    // ผู้ไม่ล็อกอินสร้างได้เฉพาะ status 'pending' ที่มี assigneeUid จริงเท่านั้น
    const sub={
      formCode:F.abbr, tracking:trk,
      doc:F.doc||'', issue:F.iss||'', rev:F.rev||'', defRev:DEF.defRev||0,
      title:F.th||F.t||F.abbr,
      status: done?'complete':'pending',
      step: done?steps.length:2,
      assigneeUid: PICK||'',
      // ใบที่ยังไม่มีผู้รับต้องบอกว่าใครมีสิทธิ์รับไปอนุมัติ ไม่งั้นตกหล่นไม่มีใครรับผิดชอบ
      assignTo: (!PICK && st ? (approval().position || st.pool || F.assignTo || '') : ''),
      submitterUid:u.uid, submitterName:FK.data.picFirst?`${FK.data.picFirst} ${FK.data.picLast||''}`.trim():(u.displayName||''),
      submitterEmail:u.email||'',
      submittedAt:firebase.firestore.FieldValue.serverTimestamp(),
      computed:FK.computed(),
      data:FK.data,
    };
    await ref.set(sub);

    // งานในคิวของผู้อนุมัติ — ถ้าไม่สร้าง ใบจะค้างเป็น pending โดยไม่มีใครเห็น
    if(!done){
      const who=DIR.find(x=>x.id===PICK)||{};
      await A.db.collection('tasks').add({
        subId:ref.id, formCode:F.abbr, tracking:trk, title:sub.title,
        assigneeUid:PICK||'', assigneeName:who.name||'',
        // ยังไม่มีผู้รับ = อยู่ในกองรอ ให้ผู้มีสิทธิ์ตามบทบาทมากดรับ
        state: PICK?'open':'pool',
        pool: PICK?'':(approval().position||(st&&st.pool)||F.assignTo||''),
        step:2,
        fromUid:u.uid, fromName:sub.submitterName,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
    }

    let ex=null;
    if(done) ex=await A.exportSubmission(Object.assign({},sub,{submittedAt:d.toISOString()}));

    foot.innerHTML=`<div class="fk-gate info" style="margin-bottom:14px"><span>
        <b>${A.esc(A.t(done?'sentComplete':'sentPending'))}</b><br>
        ${A.esc(A.t('trackingNo'))}: <span class="mono">${A.esc(trk)}</span>
        ${ex&&ex.ok===false?'<br>'+A.esc(A.t('exportFailed'))+' '+A.esc(ex.error||''):''}
        ${ex&&ex.pdf?`<br><a href="${A.esc(ex.pdf)}" target="_blank" rel="noopener">PDF ↗</a>`:''}
      </span></div>
      <div class="acts"><a class="big pri" href="${A.formUrl(F)}">${A.esc(A.t('backToForm'))}</a>
        <a class="big sec" href="../all/">${A.esc(A.t('backToAll'))}</a></div>`;
    window.scrollTo({top:foot.getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'});
  }catch(e){
    foot.innerHTML=`<div class="fk-gate stop" style="margin-bottom:14px"><span>
        <b>${A.esc(A.t('sendFailed'))}</b><br>${A.esc(e.code||e.message||String(e))}
      </span></div>`;
    renderFootRetry();
  }
}
function renderFootRetry(){
  const d=document.createElement('div'); d.className='acts';
  d.innerHTML=`<button class="big pri" id="again">${A.esc(A.t('tryAgain'))}</button>`;
  document.getElementById('foot').appendChild(d);
  document.getElementById('again').addEventListener('click',()=>send());
}
</script>
