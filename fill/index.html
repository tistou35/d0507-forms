onName","type":"text","req":true,"half":true,"label":{"th":"ชื่อผู้ตรวจ","en":"Conductor name"}},{"k":"conDate","type":"date","req":true,"prefill":"today","half":true,"label":{"th":"วันที่","en":"Date"}},{"k":"conSign","type":"sign","req":true,"label":{"th":"ลายเซ็นผู้ตรวจ","en":"Conductor signature"}}]},{"k":"E","tab":"T3","party":"tki","hideOthers":true,"title":{"th":"ครูภาคทฤษฎีรับทราบ","en":"Instructor acknowledgement"},"fields":[{"k":"tkiAckName","type":"text","req":true,"half":true,"label":{"th":"ชื่อครูภาคทฤษฎี","en":"Instructor name"}},{"k":"tkiAckDate","type":"date","req":true,"half":true,"label":{"th":"วันที่","en":"Date"}},{"k":"tkiSign","type":"sign","req":true,"label":{"th":"ลายเซ็นครูภาคทฤษฎี","en":"Instructor signature"}}]}],"compute":[{"k":"total","op":"sum","of":["g1","g2","g3","g4","g5","g6"]},{"k":"pct","op":"pct","of":"total","max":30}],"gates":[{"when":"anyStarBelow(3)","level":"stop","short":{"th":"ไม่ผ่าน — ข้อความปลอดภัย","en":"SAFETY FAIL"},"msg":{"th":"ไม่ผ่านทันที — การถ่ายทอดเนื้อหาด้านความปลอดภัย ได้เกรด 2 หรือต่ำกว่า ตาม OMA D.2.9.5 ถือว่าไม่ผ่านไม่ว่าคะแนนรวมจะเป็นเท่าใด","en":"Automatic fail — delivery of safety-critical content graded 2 or below. Per OMA D.2.9.5 this fails the check regardless of any other score."}},{"when":"anyBelow(2)","level":"stop","short":{"th":"ไม่ผ่าน — มีเกรด 1","en":"GRADE 1 — FAIL"},"msg":{"th":"ไม่ผ่านทันที — OMA D.2.9.5 ระบุว่าเกรด 1 ในข้อใดก็ตามคือไม่ผ่าน · ให้พักการปฏิบัติหน้าที่ในส่วนที่เกี่ยวข้อง แจ้งหัวหน้าครูฝึกภายในวันเดียวกัน และเปิดการอบรมแก้ไขมาตรฐานตาม D.2.8 ภายใน 5 วันทำการ","en":"Automatic fail — OMA D.2.9.5: grade 1 in any area is a fail. Suspend from the affected duties, notify the HT the same day, and initiate D.2.8 corrective standardisation within 5 working days."}},{"when":"countBelow(3) > 2","level":"stop","short":{"th":"ไม่ผ่าน — ต่ำกว่าเกณฑ์เกิน 2 ข้อ","en":"FAIL — >2 AREAS"},"msg":{"th":"ไม่ผ่าน — OMA D.2.9.5 ระบุว่าเกรด 2 ในข้อที่ไม่ใช่ safety-critical เกินสองข้อคือไม่ผ่าน · ผ่านแบบมีเงื่อนไขใช้ได้กับหนึ่งถึงสองข้อเท่านั้น","en":"Fail — OMA D.2.9.5: grade 2 in more than two non-safety-critical areas is a fail. Marginal pass applies to one or two areas only."}},{"when":"countBelow(3) >= 1 && countBelow(3) <= 2 && anyBelow(2) == false && anyStarBelow(3) == false","level":"warn","short":{"th":"ผ่านแบบมีเงื่อนไข","en":"MARGINAL PASS"},"msg":{"th":"เกณฑ์ผ่านคือเกรด 3 ขึ้นไปทุกข้อ — มีข้อต่ำกว่าเกณฑ์ 1–2 ข้อ เข้าข่ายผ่านแบบมีเงื่อนไขตาม OMA D.2.9.5 · ให้บันทึกข้อที่ต้องปรับปรุง และนัดสังเกตการณ์ติดตามผลในการตรวจครั้งถัดไปหรือภายใน 6 เดือน","en":"Pass standard is grade 3+ in every area. One or two areas below standard is a Marginal Pass per OMA D.2.9.5 — document the improvement areas and schedule a follow-up observation at the next check or within 6 months."}}],"route":[{"step":1,"party":"con","sign":true},{"step":2,"party":"tki","sign":true,"assignedBy":"submitter","slaDays":2}],"export":{"docx":"D-0507-PCR-TKI-001.docx","lockUntilComplete":true}},"PWR":{"code":"PWR","doc":"D-0507-PWR-001","control":"AD/PWR/301-D","issue":"01","rev":"03","eff":"21 AUG 2026","title":{"th":"หนังสือสละสิทธิ์เรียกร้องของผู้โดยสาร","en":"Passenger Waiver and Release Form"},"retain":"OMA A.10","passthrough":[{"k":"ref","from":"flight-plan-webapp","note":"กุญแจของระบบวางแผนการบิน (Submission ID 8 ตัว) — ส่งมาทางลิงก์ prefill เก็บไว้ในใบเพื่อให้ฝั่งนั้นถามสถานะกลับได้โดยไม่ต้องส่งชื่อผู้โดยสารมา ไม่แสดงบนหน้าจอและไม่ขึ้น PDF"}],"ui":{"compact":true,"tabs":[{"k":"T1","th":"เงื่อนไข","en":"Terms"},{"k":"T2","th":"ผู้โดยสาร","en":"Passenger"},{"k":"T3","th":"ผู้ปกครอง","en":"Guardian"},{"k":"T4","th":"ลงนาม","en":"Sign"}]},"parties":[{"k":"pax","n":{"th":"ผู้โดยสาร","en":"Passenger"},"auth":"public"}],"sections":[{"k":"A","tab":"T1","party":"pax","title":{"th":"เงื่อนไขที่ต้องอ่านก่อนลงนาม","en":"Terms — read before signing"},"desc":{"th":"แท็บนี้เป็นข้อความของหนังสือสละสิทธิ์ฉบับเต็ม ไม่ใช่บทสรุป · โปรดอ่านให้ครบทั้งสี่ข้อ แล้วยืนยันทีละข้อ · หากผู้โดยสารอายุต่ำกว่า 18 ปี ผู้ปกครองเป็นผู้อ่านและยืนยันแทน","en":"This tab is the full text of the waiver, not a summary. Read all four clauses and confirm each one. If the passenger is under 18, the parent or legal guardian reads and confirms on their behalf."},"fields":[{"k":"readFirst","type":"static","text":{"th":"<p><b style=\"color:#c0392b\">โปรดอ่านอย่างละเอียดก่อนลงนาม<\/b><\/p><p>การลงนามในหนังสือฉบับนี้เป็นการยืนยันว่าท่านได้อ่าน เข้าใจ และตกลงยอมรับข้อกำหนดทั้งหมดข้างล่างนี้ด้วยความสมัครใจ<\/p><p>เอกสารนี้เป็น<b>การสละสิทธิ์เรียกร้องตามกฎหมาย<\/b> ไม่ใช่แบบฟอร์มลงทะเบียนทั่วไป เมื่อลงนามแล้ว ท่านจะไม่สามารถเรียกร้องค่าเสียหายจากบริษัทได้ในกรณีที่ระบุไว้ในข้อ 2 รวมถึงกรณีที่เกิดจากความประมาทเลินเล่อ หากมีข้อใดที่ท่านไม่เข้าใจ <b>โปรดสอบถามเจ้าหน้าที่ก่อนลงนาม<\/b> อย่าเพิ่งยืนยัน<\/p><p>หากผู้โดยสารอายุต่ำกว่า 18 ปี บิดามารดาหรือผู้ปกครองตามกฎหมายเป็นผู้อ่าน ยืนยัน และลงนามแทน ผู้เยาว์ลงนามเองไม่มีผลผูกพัน<\/p>","en":"<p><b style=\"color:#c0392b\">PLEASE READ CAREFULLY BEFORE SIGNING<\/b><\/p><p>By signing this form you confirm that you have read, understood, and voluntarily agree to all the terms set out below.<\/p><p>This is a <b>legal waiver of claims<\/b>, not an ordinary registration form. Once signed, you give up the right to claim compensation from the company in the circumstances set out in clause 2, including those arising from negligence. If there is anything you do not understand, <b>ask a member of staff before you sign<\/b> — do not confirm yet.<\/p><p>If the passenger is under 18, the parent or legal guardian reads, confirms, and signs on their behalf. A waiver signed by a minor alone is not binding.<\/p>"}},{"k":"docNote","type":"static","text":{"th":"<p><b>D-0507-PWR-001 · AD/PWR/301-D · ฉบับที่ 01 / แก้ไขครั้งที่ 03 · มีผล 21 AUG 2026<\/b><\/p><p>ข้อความที่ท่านกำลังจะยอมรับคือฉบับที่ระบุข้างต้น เลขกำกับนี้ปรากฏบนหัวและท้ายของเอกสารที่ท่านจะได้รับหลังลงนาม ใช้ตรวจสอบย้อนหลังได้ว่าท่านยอมรับข้อความฉบับใด<\/p>","en":"<p><b>D-0507-PWR-001 · AD/PWR/301-D · Issue 01 / Rev 03 · Effective 21 AUG 2026<\/b><\/p><p>These are the terms you are about to accept. The same reference appears in the header and footer of the signed document you will receive, so it can always be established which edition of the terms you accepted.<\/p>"}},{"k":"c1","type":"static","text":{"th":"<p><b>1 · การรับทราบความเสี่ยงและความรับผิดชอบ<\/b><\/p><p>ข้าพเจ้ารับทราบว่าข้าพเจ้าไม่ใช่พนักงานหรือเจ้าหน้าที่ผู้ได้รับมอบหมายของบริษัท จะนั่งในที่นั่งด้านหลังของอากาศยาน และได้รับการชี้แจงขั้นตอนด้านความปลอดภัยและขั้นตอนฉุกเฉินที่เกี่ยวข้องจากนักบินผู้ควบคุมอากาศยาน (PIC) แล้ว ข้าพเจ้าเข้าใจว่าการบินมีความเสี่ยงโดยสภาพ ซึ่งรวมถึงความเป็นไปได้ที่จะเกิดการบาดเจ็บ ความเสียหายต่อทรัพย์สิน หรือการเสียชีวิต และข้าพเจ้ายอมรับความรับผิดชอบทั้งหมดต่อการตัดสินใจเข้าร่วมเป็นผู้โดยสารด้วยความสมัครใจ<\/p>","en":"<p><b>1 · Acknowledgment of Risk and Responsibility<\/b><\/p><p>I acknowledge that I am not a company employee or authorized personnel, will occupy the rear seat of the aircraft, and have been briefed on applicable safety and emergency procedures by the Pilot-in-Command (PIC). I understand that aviation carries inherent risks, including the possibility of injury, property damage, or death, and I voluntarily accept full responsibility for my decision to participate as a passenger.<\/p>"}},{"k":"t1","type":"check","req":true,"label":{"th":"ข้าพเจ้าได้อ่านและยอมรับข้อ 1","en":"I have read and accept clause 1"}},{"k":"c2","type":"static","text":{"th":"<p><b>2 · การปลดเปลื้องความรับผิด การชดใช้ค่าเสียหาย และการสละสิทธิ์เรียกร้อง<\/b><\/p><p>ข้าพเจ้าขอปลดเปลื้องความรับผิด ชดใช้ค่าเสียหาย และไม่เรียกร้องเอาแก่ บริษัท ดี-0507 ไฟลท์ เทรนนิ่ง จำกัด กรรมการ พนักงาน ครูการบิน และตัวแทนของบริษัท จากค่าใช้จ่าย ข้อเรียกร้อง ความรับผิด หรือค่าเสียหายใด ๆ ทั้งสิ้น <b>รวมถึงที่เกิดจากความประมาทเลินเล่อ<\/b> อันเกี่ยวกับการบาดเจ็บ การสูญเสีย การเจ็บป่วย การเสียชีวิต หรือความเสียหายต่อทรัพย์สินส่วนบุคคลที่เกิดขึ้นเกี่ยวเนื่องกับเที่ยวบินนี้ ข้าพเจ้าตกลงจะไม่ยื่นข้อเรียกร้องหรือเรียกค่าชดเชยใด ๆ ต่อ ดี-0507 หรือบริษัทในเครือ อันเกิดจากการเข้าร่วมของข้าพเจ้า<\/p>","en":"<p><b>2 · Release, Indemnification, and Waiver of Claims<\/b><\/p><p>I hereby release, indemnify, and hold harmless D-0507 Flight Training Co., Ltd., its officers, employees, flight instructors, and agents from any and all costs, claims, liabilities, or damages — <b>including those arising from negligence<\/b> — relating to injury, loss, illness, death, or damage to personal property occurring in connection with this flight. I agree not to bring any claim or demand for compensation against D-0507 or its affiliates arising from my participation.<\/p>"}},{"k":"t2","type":"check","req":true,"label":{"th":"ข้าพเจ้าได้อ่านและยอมรับข้อ 2","en":"I have read and accept clause 2"}},{"k":"c3","type":"static","text":{"th":"<p><b>3 · ความประพฤติและคำรับรองว่าจะไม่ก่อความวุ่นวาย<\/b><\/p><p>ข้าพเจ้าตกลงจะปฏิบัติตามคำสั่งของนักบินผู้ควบคุมอากาศยานและเจ้าหน้าที่ประจำเที่ยวบินอย่างเคร่งครัดตลอดการบิน ข้าพเจ้าขอรับรองว่าข้าพเจ้าไม่ได้เป็นและจะไม่ประพฤติตนเป็นผู้โดยสารที่ก่อความวุ่นวายหรือรบกวน ตามนิยามใน ICAO Doc 10117 และกฎระเบียบของ CAAT ที่เกี่ยวข้อง ข้าพเจ้าเข้าใจว่าพฤติกรรมที่ก่อความวุ่นวาย ข่มขู่ หรือไม่ปฏิบัติตามคำสั่ง อาจส่งผลให้ถูกนำตัวออกจากอากาศยานทันที และอาจเป็นความผิดอาญาตามกฎหมายการเดินอากาศของประเทศไทย การเข้าร่วมของข้าพเจ้าขึ้นอยู่กับการอนุมัติของหัวหน้าครูฝึก (HT) หรือนักบินผู้ควบคุมอากาศยาน<\/p>","en":"<p><b>3 · Conduct and Unruly Passenger Declaration<\/b><\/p><p>I agree to comply strictly with all instructions issued by the PIC and flight crew throughout the flight. I declare that I am not, and will not conduct myself as, an <b>unruly or disruptive passenger<\/b> as defined under ICAO Doc 10117 and applicable CAAT regulations. I understand that any disruptive, threatening, or non-compliant behaviour may result in immediate removal from the aircraft and may constitute a criminal offence under Thai civil aviation law. My participation is conditional upon approval by the Head of Training (HT) or PIC.<\/p>"}},{"k":"t3","type":"check","req":true,"label":{"th":"ข้าพเจ้าได้อ่านและยอมรับข้อ 3","en":"I have read and accept clause 3"}},{"k":"c4","type":"static","text":{"th":"<p><b>4 · คำรับรองความเข้าใจ<\/b><\/p><p>ข้าพเจ้าบรรลุนิติภาวะแล้ว ได้อ่านและเข้าใจเนื้อหาของหนังสือสละสิทธิ์ฉบับนี้โดยตลอด และรับทราบว่าข้าพเจ้าผูกพันตามข้อกำหนดในหนังสือนี้ตามกฎหมาย ข้าพเจ้าลงนามในหนังสือนี้ด้วยความสมัครใจและปราศจากการบังคับ ในกรณีที่ผู้โดยสารเป็นผู้เยาว์ (อายุต่ำกว่า 18 ปี) บิดามารดาหรือผู้ปกครองตามกฎหมายเป็นผู้ลงนามแทนผู้เยาว์ และรับภาระผูกพันทั้งหมดตามหนังสือนี้<\/p>","en":"<p><b>4 · Declaration of Understanding<\/b><\/p><p>I am of legal age, have read and fully understood the contents of this waiver, and acknowledge that I am legally bound by its terms. I sign this form freely and without coercion. Where the passenger is a minor (under 18 years of age), the parent or legal guardian signs on behalf of the minor and accepts all obligations herein.<\/p>"}},{"k":"t4","type":"check","req":true,"label":{"th":"ข้าพเจ้าได้อ่านและยอมรับข้อ 4","en":"I have read and accept clause 4"}}]},{"k":"B","tab":"T2","party":"pax","title":{"th":"ก · ข้อมูลผู้โดยสาร","en":"A · Passenger details"},"fields":[{"k":"isMinor","type":"check","label":{"th":"ผู้โดยสารอายุต่ำกว่า 18 ปี — ต้องให้ผู้ปกครองกรอกและลงนามแทน","en":"Passenger is under 18 — a parent or legal guardian must complete and sign on their behalf"}},{"k":"paxName","type":"text","req":true,"label":{"th":"ชื่อ-นามสกุล","en":"Full name"}},{"k":"paxDob","type":"date","req":true,"label":{"th":"วันเกิด","en":"Date of birth"}},{"k":"ageShown","type":"static","showIf":"filled(paxDob)","text":{"th":"<p>อายุ ณ วันนี้ <b>{paxAge}<\/b> ปี — คำนวณจากวันเกิดที่กรอก ไม่ต้องกรอกเอง<\/p>","en":"<p>Age today: <b>{paxAge}<\/b> years — calculated from the date of birth entered.<\/p>"}},{"k":"paxPhone","type":"tel","req":true,"half":true,"label":{"th":"โทรศัพท์","en":"Phone number"}},{"k":"paxEmail","type":"email","req":true,"half":true,"label":{"th":"อีเมล","en":"Email address"}},{"k":"paxId","type":"text","req":true,"label":{"th":"เลขบัตรประชาชน / หนังสือเดินทาง","en":"ID / Passport No."}},{"k":"paxAddr","type":"textarea","req":true,"label":{"th":"ที่อยู่","en":"Address"}}]},{"k":"C","tab":"T3","party":"pax","showIf":"isMinor == true","title":{"th":"ข · ผู้ปกครองของผู้เยาว์","en":"B · Parent or legal guardian"},"desc":{"th":"แสดงเฉพาะเมื่อผู้โดยสารอายุต่ำกว่า 18 ปี · ผู้ปกครองต้องยินยอมด้วยตนเองเพิ่มจากการยอมรับข้อ 1–4 และลงนามในส่วนนี้ ไม่ใช่ในช่องลายเซ็นผู้โดยสาร","en":"Shown only when the passenger is under 18. The guardian gives their own consent in addition to accepting clauses 1–4, and signs in this section rather than in the passenger signature block."},"fields":[{"k":"gName","type":"text","reqIf":"isMinor == true","label":{"th":"ชื่อบิดามารดา / ผู้ปกครองตามกฎหมาย","en":"Parent / legal guardian name"}},{"k":"gRel","type":"text","reqIf":"isMinor == true","half":true,"label":{"th":"ความสัมพันธ์กับผู้เยาว์","en":"Relationship to minor"}},{"k":"gPhone","type":"tel","reqIf":"isMinor == true","half":true,"label":{"th":"โทรศัพท์ผู้ปกครอง","en":"Guardian phone number"}},{"k":"gId","type":"text","reqIf":"isMinor == true","label":{"th":"เลขบัตรประชาชน / หนังสือเดินทาง ของผู้ปกครอง","en":"Guardian ID / Passport No."}},{"k":"gConsentText","type":"static","text":{"th":"<p><b>ความยินยอมของผู้ปกครอง<\/b><\/p><p>ข้าพเจ้าเป็นบิดามารดาหรือผู้ปกครองตามกฎหมายของผู้โดยสารที่ระบุชื่อไว้ในส่วน ก ข้าพเจ้าได้อ่านข้อ 1 ถึง 4 ข้างต้นแล้ว และยอมรับข้อกำหนดเหล่านั้นแทนผู้เยาว์ ข้าพเจ้ายินยอมให้ผู้เยาว์เข้าร่วมเที่ยวบินนี้ในฐานะผู้โดยสาร และรับภาระผูกพันทั้งหมดตามหนังสือสละสิทธิ์ฉบับนี้<\/p>","en":"<p><b>Guardian consent<\/b><\/p><p>I am the parent or legal guardian of the passenger named in Section A. I have read clauses 1 to 4 above and I accept them on behalf of the minor. I consent to the minor participating in this flight as a passenger and I accept all obligations set out in this waiver.<\/p>"}},{"k":"gConsent","type":"check","reqIf":"isMinor == true","label":{"th":"GUARDIAN CONSENT — ข้าพเจ้ายินยอมตามข้อความข้างต้น","en":"GUARDIAN CONSENT — I give the consent stated above"}},{"k":"gSignName","type":"text","reqIf":"isMinor == true","half":true,"label":{"th":"ชื่อผู้ลงนาม (ตัวบรรจง)","en":"Name of signatory (print)"}},{"k":"gSignDate","type":"date","reqIf":"isMinor == true","prefill":"today","half":true,"label":{"th":"วันที่ลงนาม","en":"Date signed"}},{"k":"gSign","type":"sign","reqIf":"isMinor == true","label":{"th":"ลายเซ็นผู้ปกครอง","en":"Guardian signature"}}]},{"k":"D","tab":"T4","party":"pax","title":{"th":"ค · ลายเซ็นผู้โดยสาร","en":"C · Passenger signature"},"desc":{"th":"ผู้โดยสารอายุ 18 ปีขึ้นไปลงนามในส่วนนี้ · ผู้เยาว์ไม่ต้องลงนาม ผู้ปกครองลงนามในแท็บผู้ปกครองแล้ว","en":"Passengers aged 18 or over sign here. A minor does not sign — the guardian has already signed on the guardian tab."},"fields":[{"k":"paxSign","type":"sign","reqIf":"isMinor != true","showIf":"isMinor != true","label":{"th":"ลายเซ็นผู้โดยสาร","en":"Passenger signature"}},{"k":"signDate","type":"date","reqIf":"isMinor != true","showIf":"isMinor != true","prefill":"today","half":true,"label":{"th":"วันที่ลงนาม","en":"Date signed"}},{"k":"minorNote","type":"static","showIf":"isMinor == true","text":{"th":"<p>ผู้โดยสารเป็นผู้เยาว์ — ลายเซ็นที่ใช้คือลายเซ็นของผู้ปกครองในแท็บก่อนหน้า ส่วนนี้จึงเว้นว่างไว้ตามแบบเอกสาร<\/p>","en":"<p>The passenger is a minor — the operative signature is the guardian's on the previous tab, so this block is left blank as the paper form requires.<\/p>"}}]}],"gates":[{"when":"isMinor == true","level":"info","short":{"th":"ผู้เยาว์","en":"MINOR"},"msg":{"th":"ผู้โดยสารเป็นผู้เยาว์ — ผู้ปกครองต้องกรอกข้อมูล ให้ความยินยอม และลงนามในแท็บผู้ปกครอง ผู้เยาว์ไม่ต้องลงนามเอง","en":"The passenger is a minor — the guardian must complete their details, give consent, and sign on the guardian tab. The minor does not sign."}},{"when":"filled(paxDob) && paxAge < 18 && isMinor != true","level":"stop","sh function netBar(){
  let el=document.getElementById('netbar');
  if(!el){ el=document.createElement('div'); el.id='netbar';
    document.getElementById('head').insertAdjacentElement('afterend', el); }
  const off=!A.online;
  const dr = DRAFT_AT ? new Date(DRAFT_AT) : null;
  const when = dr ? dr.toLocaleString(A.lang==='en'?'en-GB':'th-TH',
                 {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  el.className = 'netbar' + (off?' off':'');
  el.innerHTML = off
    ? `<b>${A.esc(A.L({th:'ไม่มีสัญญาณ',en:'Offline'}))}</b> — ${A.esc(A.L({
        th:'กรอกต่อได้ ระบบเก็บไว้ในเครื่อง กดส่งแล้วจะส่งเองเมื่อมีสัญญาณ',
        en:'Keep filling. Answers are held on this device and sent when a signal returns.'}))}`
    : (DRAFT_AT ? `${A.esc(A.L({th:'มีร่างค้างจาก',en:'Draft restored from'}))} ${A.esc(when)} — ${
        A.esc(A.L({th:'กรอกต่อได้เลย',en:'continue where you left off'}))}` : '');
  el.style.display = (off || DRAFT_AT) ? '' : 'none';
}
A.onNet.push(netBar);

/* อ่านค่าที่ส่งมาโดยไม่กิน — prefill() ลบ stash ทิ้งหลังใช้ เรียกซ้ำจะได้ค่าว่าง
   ตัวนี้จึงแยกไว้ให้ extLink() ส่องหา ref ได้โดยไม่ไปแย่งค่าของช่องกรอก */
function prefillRaw(){
  let raw=new URLSearchParams(location.search).get('p');
  if(!raw){ try{ raw=sessionStorage.getItem(PKEY); }catch(e){} }
  if(!raw) return null;
  try{
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    const o=JSON.parse(new TextDecoder().decode(bytes));
    return (o&&typeof o==='object'&&!Array.isArray(o))?o:null;
  }catch(e){ return null; }
}

function prefill(){
  let raw=new URLSearchParams(location.search).get('p');
  if(!raw){ try{ raw=sessionStorage.getItem(PKEY); }catch(e){} }
  if(!raw||!DEF) return {};
  try{ sessionStorage.removeItem(PKEY); }catch(e){}
  let o;
  try{
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    o=JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ console.warn('[prefill] อ่านค่าที่ส่งมาไม่ได้',e); return {}; }
  if(!o||typeof o!=='object'||Array.isArray(o)) return {};
  const signKeys=new Set();
  (DEF.sections||[]).forEach(sec=>(sec.fields||[]).forEach(f=>{
    if(f.type==='sign') signKeys.add(f.k);
  }));
  const out={};
  Object.keys(o).forEach(k=>{ if(!signKeys.has(k)) out[k]=o[k]; });
  return out;
}

function shown(v,f){
  if(v===undefined||v===null||v==='') return '—';
  if(typeof v==='boolean') return v?'✓':'—';
  // ตารางติ๊ก — เก็บเป็น { ข้อ: ค่า } แสดงเป็นรายชื่อข้อที่ติ๊ก ไม่ใช่ [object Object]
  if(v&&typeof v==='object'&&!Array.isArray(v)&&f&&f.type==='checklist'){
    const nm=o=>o?LL(o.n)||o.v:'';
    const on=(f.items||[]).filter(it=>v[it.id]).map(it=>{
      const lab=LL(it)||it.th||it.id;
      const opt=(f.opts||[]).find(o=>o.v===v[it.id]);
      const val=opt?nm(opt):v[it.id];
      return (f.opts&&f.opts.length>1)?`${lab} — ${val}`:lab;
    });
    if(!on.length) return '—';
    return on.join('\n')+`  (${on.length}/${(f.items||[]).length})`;
  }
  // ตารางแถวซ้ำ — แถวว่างไม่ต้องแสดง คนตรวจทานจะได้เห็นเฉพาะที่กรอกจริง
  if(Array.isArray(v)&&v.length&&typeof v[0]==='object'){
    const cols=(f&&f.cols)||[];
    const rows=v.filter(r=>r&&Object.keys(r).some(k=>String(r[k]||'').trim()!==''));
    if(!rows.length) return '—';
    return rows.map((r,i)=>(i+1)+'. '+cols.map(c=>r[c.k]).filter(x=>String(x||'').trim()!=='')
      .join(' · ')).join('\n');
  }
  if(Array.isArray(v)) return v.join(' · ');
  if(typeof v==='string'&&v.indexOf('data:image')===0) return '✓ '+A.t('signed');
  if(f&&f.opt){ const o=f.opt.find(x=>String(x.v)===String(v)); if(o) return LL(o.n)||o.v; }
  if(f&&f.type==='date') return A.esc(v).split('-').reverse().join('/');
  return String(v);
}

    const rest=fs.filter(f=>f.type!=='check');
    const line=f=>`<div class="rvr"><span>${A.esc(LL(f.label))}</span>
        <b>${A.esc(shown(FK.data[f.k],f))}</b></div>`;
    return `<h4 class="rvh">${A.esc(LL(sec.title))}</h4>`
      + rest.map(line).join('') + on.map(line).join('')
      + (box.length?`<div class="rvr"><span>${A.esc(A.t('ticked'))}</span>
          <b>${on.length} / ${box.length}</b></div>`:'');
  }).join('');

  const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
  const st1=nextStep();
  const nx=(DEF.parties||[]).find(p=>p.k===(st1||{}).party);
  const next=!st1 ? A.t('endsHere')
    : st1.assignedBy==='submitter' ? A.t('goesToApproval')+' — '+(LL(nx&&nx.n)||st1.party)
    : A.t('goesToPool')+' — '+(LL(nx&&nx.n)||st1.party);

  // ผู้ที่ไม่ได้ล็อกอินปิดใบเองไม่ได้ — ใบต้องมีคนรับผิดชอบเสมอ
  const anon=!A.isStaff(), needs=needsApproval(), mustPick=pickAtSend();
  if(anon && !needs){
    modal(A.t('needLoginTitle'), A.t('needLoginSub'),
      `<p class="fk-static">${A.esc(A.t('needLoginBody'))}</p>`,
      `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
       <a class="big pri" href="../staff-login/?next=${
          encodeURIComponent(location.pathname + location.search)}">${A.esc(A.t('signIn'))}</a>`);
    return;
  }
  const picker = mustPick ? (DIR.length
    ? `<h4 class="rvh">${A.esc(A.t('sendToWho'))}</h4>
       <p class="hint" style="margin-bottom:8px">${A.esc(A.t('sendToWhoHint'))}</p>
       <div class="fk-opts" id="pick">`+DIR.map(x=>
         `<button type="button" class="fk-opt" data-uid="${A.esc(x.id)}"
            aria-pressed="${PICK===x.id}">${A.esc(x.name)}${x.cert?`<em style="font-style:normal;
            color:var(--g-500);font-size:11.5px;margin-left:7px">${A.esc(x.cert)}</em>`:''}</button>`).join('')+`</div>`
    : `<div class="fk-gate warn"><span>${A.esc(A.t('noRecipient'))}</span></div>`) : '';

  modal(A.t('reviewTitle'), A.t('reviewSub'),
    (gates.length?gates.map(g=>`<div class="fk-gate ${A.esc(g.level)}" style="margin-bottom:10px">
       <span>${A.esc(LL(g.msg))}</span></div>`).join(''):'')+
    headBox(c,next)+picker+rows,
    `<button class="fb" value="cancel">${A.esc(A.t('goBack'))}</button>
     <button class="big pri" id="ok" value="ok">${A.esc(A.t('confirmSend'))}</button>`);
  const okb=document.getElementById('ok');
  const sync=()=>{ okb.disabled = mustPick && !PICK; okb.classList.toggle('off', okb.disabled); };
  document.querySelectorAll('#pick .fk-opt').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault(); PICK=b.dataset.uid;
    document.querySelectorAll('#pick .fk-opt').forEach(x=>x.setAttribute('aria-pressed', x===b));
    sync();
  }));
  sync();
  okb.addEventListener('click', e=>{ e.preventDefault(); if(okb.disabled) return; dlg.close(); send(); });
}

/* ── ส่งจริง ───────────────────────────────────────────────
   เขียนลง Firestore ก่อนเสมอ นั่นคือหลักฐานว่าส่งแล้ว
   ส่วนการทำ PDF/ชีต เป็นขั้นตามหลัง ล้มได้โดยไม่ทำให้ใบหาย */
async function send(){
  const foot=document.getElementById('foot');
  foot.innerHTML=`<div class="note">${A.esc(A.t('sending'))}</div>`;
  try{
    if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const u=firebase.auth().currentUser;
    const ref=A.db.collection('submissions').doc();
    const d=new Date(), p2=n=>String(n).padStart(2,'0');
    const trk=`${F.abbr}-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${ref.id.slice(0,4).toUpperCase()}`;
    const ctx=FK.ctx();
    const steps=(DEF.route||[]).filter(r=>FormKit.evalCond(r.onlyIf,ctx));
    const done=steps.length<=1;
    const st=steps[1]||null;

    // ลำดับคีย์และ status ต้องผ่าน newSubmissionOk() ใน firestore.rules
    // ผู้ไม่ล็อกอินสร้างได้เฉพาะ status 'pending' ที่มี assigneeUid จริงเท่านั้น
    const sub={
      formCode:F.abbr, tracking:trk,
      doc:F.doc||'', issue:F.iss||'', rev:F.rev||'', defRev:DEF.defRev||0,
      title:F.th||F.t||F.abbr,
      status: done?'complete':'pending',
      step: done?steps.length:2,
      assigneeUid: PICK||'',
      // ใบที่ยังไม่มีผู้รับต้องบอกว่าใครมีสิทธิ์รับไปอนุมัติ ไม่งั้นตกหล่นไม่มีใครรับผิดชอบ
      assignTo: (!PICK && st ? (approval().position || st.pool || F.assignTo || '') : ''),
      submitterUid:u.uid, submitterName:FK.data.picFirst?`${FK.data.picFirst} ${FK.data.picLast||''}`.trim():(u.displayName||''),
      submitterEmail:u.email||'',
      submittedAt:firebase.firestore.FieldValue.serverTimestamp(),
      computed:FK.computed(),
      data:FK.visibleData(),
    };
    // สายกลับไปยังระบบที่ส่งคนมา — เก็บไว้ในใบเอง ไม่ใช่แค่ใน sessionStorage
    // ขั้นอนุมัติเกิดทีหลัง คนละเครื่อง คนละคน ถ้าไม่ติดมากับใบ ตอนหัวหน้าครูฝึก
    // กดอนุมัติจะไม่มีอะไรบอกได้ว่าต้องแจ้งใครกลับ
    // (rules นับคีย์ไว้ที่ 22 — ใบนี้ 17 บวกสองยังอยู่ในนั้น)
    const link=extLink();
    if(link){ sub.extRef=link.extRef; sub.extSystem=link.extSystem; }
    await ref.set(sub);
    // ลบสายทิ้งเมื่อผูกกับใบเรียบร้อยแล้ว ไม่งั้นค้างไปโผล่ในใบถัดไปของแท็บเดียวกัน
    if(link){ try{ sessionStorage.removeItem(RKEY); }catch(e){} }

    // งานในคิวของผู้อนุมัติ — ถ้าไม่สร้าง ใบจะค้างเป็น pending โดยไม่มีใครเห็น
    if(!done){
      const who=DIR.find(x=>x.id===PICK)||{};
      await A.db.collection('tasks').add({
        subId:ref.id, formCode:F.abbr, tracking:trk, title:sub.title,
        assigneeUid:PICK||'', assigneeName:who.name||'',
        // ยังไม่มีผู้รับ = อยู่ในกองรอ ให้ผู้มีสิทธิ์ตามบทบาทมากดรับ
        state: PICK?'open':'pool',
        pool: PICK?'':(approval().position||(st&&st.pool)||F.assignTo||''),
        step:2,
        fromUid:u.uid, fromName:sub.submitterName,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      });
    }

    /* ── ยืนยันว่าถึงเซิร์ฟเวอร์จริงหรือยัง ────────────────────
       Firestore ที่เปิด persistence ไว้จะ resolve ทันทีจากแคชในเครื่อง
       แม้ไม่มีสัญญาณ — ใบไม่หาย แต่ยังไม่ถึงเซิร์ฟเวอร์
       บอกว่า "ส่งแล้ว" ตอนนั้นคือคำที่ไม่จริง คนกรอกอาจปิดเครื่องแล้วเดินจากไป
       ร่างในเครื่องจึงเก็บไว้จนกว่าเซิร์ฟเวอร์จะรับ ไม่ใช่ลบทันทีที่กดส่ง */
    const queued = await new Promise(res => {
      let done_=false;
      const un = ref.onSnapshot({includeMetadataChanges:true}, snap => {
        if (done_) return;
        if (!snap.metadata.hasPendingWrites){ done_=true; un(); res(false); }
      }, () => { if(!done_){ done_=true; res(true); } });
      // ไม่รอเกินสองวินาที — ถ้ายังไม่ยืนยันถือว่าเข้าคิว หน้าเว็บต้องไม่ค้าง
      setTimeout(() => { if(!done_){ done_=true; try{un();}catch(e){} res(true); } }, 2000);
    });
    if (!queued) A.draftClear(code);

    let ex=null;
    // render = ใบนี้ในรูปแบบที่พิมพ์ได้ (หัวข้อ ป้ายชื่อ ค่าที่อ่านออก ลายเซ็น)
    // ส่งไปกับการส่งออกเท่านั้น ไม่เก็บลง Firestore — ประกอบใหม่จากนิยามฟอร์มได้เสมอ
    // และ rules นับคีย์ของใบไว้ที่ 22
    if(done) ex=await A.exportSubmission(Object.assign({},sub,{
      submittedAt:d.toISOString(), render:FK.docSpec(), computedLabels:cLabels()}));

    /* แจ้งกลับทันทีที่ลงนามเสร็จ ไม่รอผลอนุมัติ
       ต้นทางถามคำถามเดียวคือ "คนนี้ลงนามหรือยัง" การอนุมัติของหัวหน้าครูฝึก
       เป็นขั้นตอนของระบบนี้ ปลายทางไม่ควรต้องรอมันก่อนจะทำบัญชีผู้โดยสารต่อ
       (พออนุมัติแล้วจะมีการแจ้งซ้ำอีกครั้งจากหน้าอนุมัติ) */
    const notified = await notifyExt(link, done?'approved':'submitted', trk);

    foot.innerHTML=`<div class="fk-gate ${queued?'warn':'info'}" style="margin-bottom:14px"><span>
        <b>${A.esc(queued ? A.L({th:'เก็บไว้ในเครื่องแล้ว — ยังไม่ถึงเซิร์ฟเวอร์',
                                 en:'Held on this device — not yet on the server'})
                          : A.t(done?'sentComplete':'sentPending'))}</b><br>
        ${queued ? A.esc(A.L({
            th:'ระบบจะส่งเองเมื่อมีสัญญาณ · อย่าเพิ่งล้างข้อมูลเบราว์เซอร์จนกว่าจะส่งสำเร็จ',
            en:'It will be sent automatically when a signal returns. Do not clear browser data until then.'}))+'<br>' : ''}
        ${A.esc(A.t('trackingNo'))}: <span class="mono">${A.esc(trk)}</span>
        ${link?'<br>'+A.esc(A.t(notified&&notified.ok?'extNotified':'extNotifyFailed')):''}
        ${ex&&ex.ok===false?'<br>'+A.esc(A.t('exportFailed'))+' '+A.esc(ex.error||''):''}
        ${ex&&ex.pdf?`<br><a href="${A.esc(ex.pdf)}" target="_blank" rel="noopener">PDF ↗</a>`:''}
      </span></div>
      <div class="acts"><a class="big pri" href="${A.formUrl(F)}">${A.esc(A.t('backToForm'))}</a>
        <a class="big sec" href="../all/">${A.esc(A.t('backToAll'))}</a></div>`;
    window.scrollTo({top:foot.getBoundingClientRect().top+window.scrollY-90,behavior:'smooth'});
  }catch(e){
    foot.innerHTML=`<div class="fk-gate stop" style="margin-bottom:14px"><span>
        <b>${A.esc(A.t('sendFailed'))}</b><br>${A.esc(e.code||e.message||String(e))}
      </span></div>`;
    renderFootRetry();
  }
}
function renderFootRetry(){
  const d=document.createElement('div'); d.className='acts';
  d.innerHTML=`<button class="big pri" id="again">${A.esc(A.t('tryAgain'))}</button>`;
  document.getElementById('foot').appendChild(d);
  document.getElementById('again').addEventListener('click',()=>send());
}
</script>
</body></html>
